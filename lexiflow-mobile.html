/* ============================================================
   LexiFlow — views/ai.js
   Конструктор промпта для нейросети: пользователь выбирает язык,
   тему, уровень и число примеров, а страница собирает готовый
   запрос под формат импорта LexiFlow.
   ============================================================ */
(function (global) {
  'use strict';
  var App = (global.App = global.App || {});
  var U = App.util;
  var h = U.h, icon = U.icon;
  var V = (App.views = App.views || {});

  /* Падежные формы нужны, чтобы фраза в промпте звучала по-русски:
     «слов английского языка», «предложение на английском языке». */
  var LANGS = [
    { nom: 'английский', gen: 'английского', prep: 'английском' },
    { nom: 'немецкий', gen: 'немецкого', prep: 'немецком' },
    { nom: 'французский', gen: 'французского', prep: 'французском' },
    { nom: 'испанский', gen: 'испанского', prep: 'испанском' },
    { nom: 'итальянский', gen: 'итальянского', prep: 'итальянском' },
    { nom: 'португальский', gen: 'португальского', prep: 'португальском' },
    { nom: 'китайский', gen: 'китайского', prep: 'китайском' },
    { nom: 'японский', gen: 'японского', prep: 'японском' },
    { nom: 'турецкий', gen: 'турецкого', prep: 'турецком' },
    { nom: 'польский', gen: 'польского', prep: 'польском' },
    { nom: 'чешский', gen: 'чешского', prep: 'чешском' },
    { nom: 'арабский', gen: 'арабского', prep: 'арабском' }
  ];
  var LEVELS = ['A1', 'A2', 'B1', 'B2', 'C1'];

  function langOf(name) {
    for (var i = 0; i < LANGS.length; i++) {
      if (LANGS[i].nom === name) return LANGS[i];
    }
    return { nom: name, gen: name, prep: name };
  }

  /** Настройки конструктора. Живут в памяти вкладки — переживать перезагрузку им не нужно. */
  var state = {
    lang: 'английский',
    topic: 'Повседневная жизнь',
    level: 'B1',
    count: 50,
    examples: 1,
    byDeck: false
  };

  /**
   * Собрать текст промпта.
   * Формулировки согласованы с парсером `store.importTabular()`: заголовки,
   * кавычки для полей с запятыми, отсутствие markdown-обёртки.
   */
  function buildPrompt(st) {
    st = st || state;
    var cols = ['Слово', 'Перевод', 'Транскрипция', 'Пример', 'Перевод примера'];
    if (st.examples > 1) cols.push('Пример 2', 'Перевод примера 2');
    if (st.byDeck) cols.unshift('Колода');

    var L = langOf(st.lang);
    var out = [];
    out.push('Создай список из ' + st.count + ' слов ' + L.gen + ' языка по теме «' + st.topic +
      '» уровня ' + st.level + ' для изучения русского человека.');
    out.push('');
    out.push('Верни результат ТОЛЬКО как CSV-файл, без пояснений и без markdown-разметки (без ```).');
    out.push('Первая строка — заголовки ровно такие:');
    out.push(cols.join(','));
    out.push('');
    out.push('Требования к строкам:');

    var n = 0;
    if (st.byDeck) {
      out.push(++n + '. Колода — короткое название подтемы: разложи слова по 3–4 подтемам внутри темы «' + st.topic + '».');
    }
    out.push(++n + '. Слово — на ' + L.prep + ' языке, в словарной форме (для глаголов — инфинитив; в английском — с частицей to).');
    out.push(++n + '. Перевод — на русском, кратко, можно несколько значений через запятую.');
    out.push(++n + '. Транскрипция — в IPA, без квадратных скобок, например: ɔːlˈðəʊ');
    out.push(++n + '. Пример — короткое предложение на ' + L.prep + ' языке, в котором есть это слово.');
    out.push(++n + '. Перевод примера — точный перевод этого предложения на русский.');
    out.push(++n + '. Если внутри значения есть запятая или кавычки — оберни всё поле в двойные кавычки: "хотя, несмотря на"');
    out.push(++n + '. Никаких пустых полей и повторов слов.');
    if (st.examples > 1) {
      out.push(++n + '. Второй пример должен показывать другое значение или другой контекст.');
    }
    out.push('');
    out.push('Сохрани ответ в файл words.csv в кодировке UTF-8.');
    return out.join('\n');
  }

  function render(root) {
    var area = h('textarea', {
      class: 'input input--area input--mono', id: 'ai-prompt', rows: 18, spellcheck: 'false'
    });

    function refresh() {
      area.value = buildPrompt(state);
      // Поле растёт под текст, чтобы промпт было видно целиком.
      // scrollHeight имеет смысл только когда элемент уже в документе,
      // поэтому первый вызов идёт после U.append().
      area.style.height = 'auto';
      var hgt = area.scrollHeight;
      area.style.height = (hgt > 0 ? Math.min(hgt + 12, 560) : 220) + 'px';
    }

    /* --- Параметры --- */
    // Внимание: `selected`/`checked` нельзя передавать в h() как boolean —
    // setAttribute('selected','false') всё равно выделяет пункт. Ставим свойства вручную.
    var langSel = h('select', { class: 'input' },
      LANGS.map(function (l) { return h('option', { value: l.nom, text: l.nom.charAt(0).toUpperCase() + l.nom.slice(1) }); }));
    langSel.value = state.lang;
    langSel.addEventListener('change', function () { state.lang = this.value; refresh(); });

    var topicIn = h('input', { class: 'input', value: state.topic, maxlength: 80, placeholder: 'Например: Путешествия' });
    topicIn.addEventListener('input', function () { state.topic = this.value.trim() || 'Повседневная жизнь'; refresh(); });

    var levelSel = h('select', { class: 'input' },
      LEVELS.map(function (l) { return h('option', { value: l, text: l }); }));
    levelSel.value = state.level;
    levelSel.addEventListener('change', function () { state.level = this.value; refresh(); });

    var countIn = h('input', { class: 'input', type: 'number', min: '5', max: '300', step: '5', value: String(state.count) });
    countIn.addEventListener('input', function () {
      state.count = U.clamp(parseInt(this.value, 10) || 50, 5, 300);
      refresh();
    });

    var exSeg = h('div', { class: 'segmented' });
    [[1, 'Один'], [2, 'Два']].forEach(function (o) {
      exSeg.appendChild(h('button', {
        class: 'segmented__item' + (state.examples === o[0] ? ' is-active' : ''),
        onclick: function () {
          state.examples = o[0];
          U.qsa('.segmented__item', exSeg).forEach(function (b) { b.classList.remove('is-active'); });
          this.classList.add('is-active');
          refresh();
        }
      }, h('span', { text: o[1] })));
    });

    var deckBox = h('input', { type: 'checkbox' });
    deckBox.checked = state.byDeck;
    deckBox.addEventListener('change', function () { state.byDeck = this.checked; refresh(); });

    var deckRow = h('label', { class: 'setting-row setting-row--switch' },
      h('div', { class: 'setting-row__text' },
        h('b', { text: 'Разложить по колодам' }),
        h('span', { class: 'muted small', text: 'Модель добавит колонку «Колода» и распределит слова по подтемам.' })
      ),
      h('span', { class: 'switch' }, deckBox, h('span', { class: 'switch__track' }))
    );

    var params = panel('Что нужно выучить', 'target',
      settingRow('Язык', 'Слова, которые вы учите.', langSel),
      settingRow('Тема', 'Чем уже тема, тем полезнее список.', topicIn),
      settingRow('Уровень', 'Сложность слов и предложений.', levelSel),
      settingRow('Сколько слов', 'Оптимально 20–50 за раз: список реально выучить.', countIn),
      settingRow('Примеров на слово', 'Два примера показывают слово в разных контекстах.', exSeg),
      deckRow
    );

    /* --- Готовый промпт --- */
    var copyBtn = h('button', { class: 'btn btn--primary btn--sm', onclick: function () {
      U.copyText(area.value).then(function (ok) {
        U.toast(ok ? 'Промпт скопирован — вставьте его в нейросеть'
          : 'Скопировать не удалось: выделите текст в поле и нажмите Ctrl+C', ok ? 'ok' : 'err', 4200);
      });
    } }, icon('copy', 15), h('span', { text: 'Скопировать промпт' }));

    var downloadBtn = h('button', { class: 'btn btn--ghost btn--sm', onclick: function () {
      U.download('prompt-lexiflow.txt', area.value, 'text/plain');

    } }, icon('download', 15), h('span', { text: 'Скачать .txt' }));

    var resetBtn = h('button', { class: 'btn btn--ghost btn--sm', onclick: function () {
      refresh();

    } }, icon('refresh', 15), h('span', { text: 'Собрать заново' }));

    var promptPanel = panel('Готовый промпт', 'brain',

      area,
      h('div', { class: 'inline-row' }, copyBtn, downloadBtn, resetBtn)
    );

    /* --- Как использовать --- */
    var howPanel = panel('Как это использовать', 'info',

        h('div', {},

  /** Справка по форматам файла — тем же составом, что и на экране данных. */

// ===== js/views/sync.js =====
/* ============================================================
   LexiFlow — views/sync.js
   Панель синхронизации: подключение хранилища GitHub Gist,
   ручной обмен, автосинхронизация и отключение.
   ============================================================ */
(function (global) {
  'use strict';
  var App = (global.App = global.App || {});
  var U = App.util, S = App.store;
  var h = U.h, icon = U.icon;
  var V = (App.views = App.views || {});

  var STATUS_LABELS = {
    off: 'Не настроено',
    idle: 'Готово к обмену',
    syncing: 'Синхронизация…',
    ok: 'Синхронизировано',
    error: 'Ошибка'
  };

  var STATUS_CLASSES = {
    off: 'tag tag--muted',
    idle: 'tag tag--muted',
    syncing: 'tag',
    ok: 'tag',
    error: 'tag tag--warn'
  };

  /* ---------- Сборка панели (в стиле views/tools.js) ---------- */

  function panelShell(title, iconName) {
    var children = Array.prototype.slice.call(arguments, 2);
    return h('section', { class: 'panel' },
      h('div', { class: 'panel__head' },
        h('h2', { class: 'panel__title' }, icon(iconName, 17), h('span', { text: title }))
      ),
      h('div', { class: 'panel__body' }, children)
    );
  }

  function row(label, hint, control) {
    return h('div', { class: 'setting-row' },
      h('div', { class: 'setting-row__text' },
        h('b', { text: label }),
        hint ? h('span', { class: 'muted small', text: hint }) : null
      ),
      h('div', { class: 'setting-row__control' }, control)
    );
  }

  /** Короткая сводка изменений для тоста. */
  function statsText(stats) {
    stats = stats || {};
    var parts = [];
    if (stats.decksAdded) parts.push('колод +' + stats.decksAdded);
    if (stats.decksUpdated) parts.push('колод обновлено: ' + stats.decksUpdated);
    if (stats.cardsAdded) parts.push('карточек +' + stats.cardsAdded);
    if (stats.cardsUpdated) parts.push('карточек обновлено: ' + stats.cardsUpdated);
    if (stats.deleted) parts.push('удалено: ' + stats.deleted);
    if (stats.logsAdded) parts.push('записей журнала +' + stats.logsAdded);
    if (stats.orphans) parts.push('осталось без колоды: ' + stats.orphans);
    return parts.length ? parts.join(', ') : 'изменений не было';
  }

  /* ============================================================
     Панель
     ============================================================ */

  function panelView() {
    var SY = App.sync;
    var cfg = S.settings().sync || {};

    var statusText = h('div', { class: 'setting-row__text' });

    /* Подпись держим ссылкой, а не поиском по DOM: так её можно менять
       из syncUi() без обращения к разметке. */
    var connectLabel = h('span', { text: 'Создать хранилище' });

    var connectBtn = h('button', {
      class: 'btn btn--primary',
      onclick: doConnect
    }, icon('check', 16), connectLabel);

    /* Токен GitHub: нужен один раз, чтобы создать хранилище.
       Fine-grained token с единственным правом «Gist: read and write».
       Хранится только на этом устройстве. */
    var tokenInput = h('input', {
      class: 'input input--mono',
      type: 'password',
      placeholder: 'Вставьте токен GitHub',
      autocomplete: 'off',
      spellcheck: 'false'
    });

    /* Второе устройство подключается по коду: иначе оно заведёт своё
       хранилище, и данные двух устройств не встретятся никогда. */
    var gistInput = h('input', {
      class: 'input input--mono',
      type: 'text',
      placeholder: 'Код хранилища с другого устройства',
      autocomplete: 'off',
      spellcheck: 'false'
    });

    var joinBtn = h('button', {
      class: 'btn btn--ghost',
      onclick: doJoin
    }, icon('download', 16), h('span', { text: 'Подключиться к хранилищу' }));

    var codeBox = h('div', { class: 'inline-row' });

    var nowBtn = h('button', {
      class: 'btn btn--ghost',
      onclick: doNow
    }, icon('refresh', 16), h('span', { text: 'Синхронизировать сейчас' }));

    var offBtn = h('button', {
      class: 'btn btn--danger',
      onclick: doDisconnect
    }, icon('close', 16), h('span', { text: 'Отключить' }));

    var autoInput = h('input', { type: 'checkbox', checked: !!cfg.auto });
    autoInput.addEventListener('change', function () {
      if (autoInput.checked) SY.start(); else SY.stop();
      U.toast(autoInput.checked ? 'Автосинхронизация включена' : 'Автосинхронизация выключена', 'info', 2200);
      syncUi();
    });

    var autoRow = h('label', { class: 'setting-row setting-row--switch' },
      h('div', { class: 'setting-row__text' },
        h('b', { text: 'Синхронизировать автоматически' }),
        h('span', { class: 'muted small', text: 'Отправляет правки через несколько секунд после изменения и раз в 5 минут, пока приложение открыто.' })
      ),
      h('span', { class: 'switch' }, autoInput, h('span', { class: 'switch__track' }))
    );

    var root = panelShell('Синхронизация', 'refresh',
      h('div', { class: 'setting-row' }, statusText),
      h('div', { class: 'setting-row' },
        h('div', { class: 'setting-row__text' },
          h('b', { text: 'Токен GitHub' }),
          h('span', { class: 'muted small', text: 'Нужен один раз. Классический Personal Access Token с правом «gist». Fine-grained токены не работают с Gist API. Хранится только на этом устройстве и не попадает в гист и в резервную копию.' })
        ),
        h('div', { class: 'setting-row__control setting-row__control--stack' },
          tokenInput,
          h('div', { class: 'inline-row' }, connectBtn, nowBtn, offBtn)
        )
      ),
      h('div', { class: 'setting-row' },
        h('div', { class: 'setting-row__text' },
          h('b', { text: 'Код хранилища' }),
          h('span', { class: 'muted small', text: 'Покажите этот код на втором устройстве — тогда оба будут писать в одно место.' })
        ),
        h('div', { class: 'setting-row__control setting-row__control--stack' },
          codeBox,
          gistInput,
          h('div', { class: 'inline-row' }, joinBtn)
        )
      ),
      autoRow,
      h('div', { class: 'panel__section' },
        h('span', { class: 'field__label', text: 'Как это работает' }),
        h('p', { class: 'muted small', text: 'Копия колод, слов и прогресса лежит в секретном гисте GitHub — это обычный файл JSON. Серверов LexiFlow не существует: приложение обменивается данными напрямую с api.github.com и только тогда, когда синхронизация включена.' }),
        h('p', { class: 'muted small', text: 'Перед отправкой своя копия сливается с облачной: побеждает более свежая правка, а удаления переносятся отдельно через надгробия (tombstones), поэтому ничего не воскресает и не теряется, даже если править по очереди с двух устройств.' }),
        h('p', { class: 'muted small', text: 'Секретный гист не индексируется поиском, но открывается по ссылке любому, у кого она есть. Токен даёт право записи только в этот гист — выдайте ему единственное разрешение «Gist: read and write», тогда утечка токена не откроет доступ к остальным репозиториям.' }),
        h('p', { class: 'muted small' },
          'Создать токен: GitHub → Settings → Developer settings → Personal access tokens → ',
          h('b', { text: 'Tokens (classic)' }),
          ' → Generate new token (classic) → право ',
          h('b', { text: 'gist' }),
          '. Fine-grained токены не поддерживают Gist API. ',
          h('a', {
            href: 'https://github.com/settings/tokens',
            target: '_blank',
            rel: 'noopener',
            text: 'Открыть страницу токенов'
          })
        )
      )
    );

    /* ---------- Обновление интерфейса ---------- */

    function paintStatus(snapshot) {
      U.clear(statusText);
      var at = snapshot.at;
      /* Пока синхронизация не настроена, status() не хранит сообщений —
         но причина прошлой неудачи важна, поэтому читаем её из настроек. */
      var lastError = (S.settings().sync || {}).lastError || '';
      U.append(statusText, [
        h('b', { text: 'Синхронизация' }),
        h('span', { class: 'inline-row' },
          h('span', { class: STATUS_CLASSES[snapshot.state] || 'tag', text: STATUS_LABELS[snapshot.state] || snapshot.state }),
          h('span', { class: 'muted small', text: at
            ? 'последний обмен: ' + U.fmtDateTime(at) + ' · ' + U.fmtRelative(at)
            : 'обмен ещё не выполнялся' })
        ),
        snapshot.message
          ? h('span', { class: snapshot.state === 'error' ? 'warn-text' : 'muted small', text: snapshot.message })
          : (lastError ? h('span', { class: 'warn-text', text: 'Прошлая попытка не удалась: ' + lastError }) : null),
        /* Правки, не уехавшие в облако, показываем прямо: иначе непонятно,
           почему колода, удалённая на телефоне, ещё жива на компьютере. */
        (SY.pending && SY.pending())
          ? h('span', { class: 'warn-text', text: 'Есть неотправленные правки — уйдут в облако при первой возможности.' })
          : null
      ]);
    }

    function syncUi() {
      var snapshot = SY.status();
      var configured = SY.isConfigured();
      var syncing = snapshot.state === 'syncing';
      var gistId = (S.settings().sync || {}).gistId || '';

      paintStatus(snapshot);

      connectBtn.disabled = syncing;
      joinBtn.disabled = syncing;
      nowBtn.disabled = !configured || syncing;
      offBtn.disabled = !configured;
      autoInput.checked = !!S.settings().sync.auto;
      connectLabel.textContent = configured ? 'Пересоздать' : 'Создать';
      tokenInput.placeholder = configured
        ? 'Токен сохранён — введите новый, чтобы заменить'
        : 'Вставьте токен GitHub';

      /* Показываем код, только когда хранилище есть: пустое поле сбивало бы
         с толку — непонятно, надо ли что-то вводить. */
      U.clear(codeBox);
      if (!gistId) return;
      U.append(codeBox, [
        h('code', { class: 'code code--wrap', text: gistId }),
        h('button', {
          class: 'btn btn--ghost btn--sm',
          onclick: function () {
            U.copyText(gistId);
            U.toast('Код хранилища скопирован', 'ok', 2400);
          }
        }, icon('copy', 15), h('span', { text: 'Скопировать' }))
      ]);
    }

    /* Статус меняется из любого места приложения — держим панель в курсе.
       Отписываемся, как только панель убрали из документа, иначе подписки
       копились бы при каждом переходе по экранам. */
    var everAttached = false;
    var unsubscribe = SY.onChange(function () {
      var inDocument = !!(global.document && global.document.body && global.document.body.contains(root));
      if (inDocument) everAttached = true;
      else if (everAttached) { unsubscribe(); return; }
      syncUi();
    });

    /* ---------- Действия ---------- */

    function doConnect() {
      var token = tokenInput.value.trim();
      if (!token) { U.toast('Вставьте токен GitHub', 'err'); return; }

      connectBtn.disabled = true;
      SY.connect(token).then(function (res) {
        connectBtn.disabled = false;
        if (!res || !res.ok) {
          U.toast((res && res.error) || 'Не удалось подключиться', 'err', 5200);
          syncUi();
          return;
        }
        /* Токен не держим в поле ввода: он уже сохранён в настройках. */
        tokenInput.value = '';
        tokenInput.placeholder = 'Токен сохранён — введите новый, чтобы заменить';
        U.toast(res.login ? 'Хранилище подключено: ' + res.login : 'Хранилище подключено', 'ok', 3200);
        syncUi();
      }, function () {
        connectBtn.disabled = false;
        U.toast('Не удалось подключиться к GitHub', 'err', 4200);
        syncUi();
      });
    }

    function doJoin() {
      /* Токен: если поле пустое, а в настройках уже сохранён — используем его.
         Это главный сценарий: второе устройство уже знает токен (вставил его
         при первом подключении), но при вводе кода хранилища вводит только код. */
      var token = tokenInput.value.trim() || S.settings().sync.token;
      var code = gistInput.value.trim();
      if (!token) { U.toast('Введите токен GitHub', 'err'); return; }
      if (!code) { U.toast('Введите код хранилища с первого устройства', 'err'); return; }

      joinBtn.disabled = true;
      SY.join(token, code).then(function (res) {
        joinBtn.disabled = false;
        if (!res || !res.ok) {
          U.toast((res && res.error) || 'Не удалось подключиться к хранилищу', 'err', 5600);
          syncUi();
          return;
        }
        /* Токен не держим в поле ввода: он уже сохранён в настройках. */
        tokenInput.value = '';
        tokenInput.placeholder = 'Токен сохранён — введите новый, чтобы заменить';
        gistInput.value = '';
        U.toast('Хранилище подключено, данные перенесены', 'ok', 3600);
        syncUi();
      }, function () {
        joinBtn.disabled = false;
        U.toast('Не удалось подключиться к GitHub', 'err', 4200);
        syncUi();
      });
    }

    function doNow() {
      nowBtn.disabled = true;
      SY.now().then(function (res) {
        nowBtn.disabled = false;
        if (!res || !res.ok) {
          U.toast((res && res.error) || 'Синхронизация не удалась', 'err', 5200);
          syncUi();
          return;
        }
        U.toast('Готово: ' + statsText(res.stats), 'ok', 5200);
        if (App.router && App.router.refresh) App.router.refresh();
        syncUi();
      }, function () {
        nowBtn.disabled = false;
        U.toast('Синхронизация не удалась', 'err', 4200);
        syncUi();
      });
    }

    function doDisconnect() {
      U.confirmDialog('Отключить синхронизацию?',
        'Токен и адрес хранилища будут удалены с этого устройства. Копия данных в гисте останется — её можно подключить заново или удалить вручную на GitHub.',
        'Отключить'
      ).then(function (ok) {
        if (!ok) return;
        SY.disconnect();
        tokenInput.value = '';
        tokenInput.placeholder = 'Вставьте токен GitHub';
        U.toast('Синхронизация отключена', 'ok', 3200);
        syncUi();
      });
    }

    syncUi();
    return root;
  }

  /* ============================================================
     Полноэкранный вариант (если понадобится отдельный маршрут)
     ============================================================ */

  function render(root) {
    var head = h('div', { class: 'page-head' },
      h('div', { class: 'page-head__main' },
        h('button', {
          class: 'icon-btn', 'aria-label': 'Назад',
          onclick: function () { App.router.go('#/settings'); }
        }, icon('back', 20)),
        h('div', {},
          h('h1', { class: 'page-title', text: 'Синхронизация' }),
          h('p', { class: 'page-sub', text: 'Одна база слов и прогресса на всех ваших устройствах' })
        )
      )
    );

    U.clear(root);
    U.append(root, [h('div', { class: 'page page--narrow' }, head, panelView())]);
  }

  V.sync = { render: render, panel: panelView };
})(window);

/* ============================================================
   LexiFlow — views/notify.js
   Панель напоминаний: включение, время, проверка разрешения.
   Собирается теми же классами и хелперами, что и views/tools.js,
   чтобы настройки выглядели однородно.

(function (global) {
  'use strict';
  var App = (global.App = global.App || {});
  var U = App.util;

  var PERMISSION_LABELS = {

  var PERMISSION_CLASSES = {
    unsupported: 'tag tag--muted',

    denied: 'tag tag--warn'
  };

// ===== js/app.js =====
/* ============================================================
   LexiFlow — app.js
   Роутер, оболочка интерфейса, темы, PWA (установка и офлайн).
   ============================================================ */
(function (global) {
  'use strict';
  var App = (global.App = global.App || {});
  var U = App.util, S = App.store;
  var h = U.h, icon = U.icon;

  /* ============================================================
     Тема
     ============================================================ */

  var theme = {
    media: null,
    apply: function (mode) {
      var resolved = mode;
      if (mode === 'auto') {
        resolved = theme.media && theme.media.matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', resolved);
      var meta = U.qs('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', resolved === 'dark' ? '#0e1016' : '#f5f6fa');
      var btn = U.qs('#theme-toggle');
      if (btn) {
        U.clear(btn);
        btn.appendChild(icon(resolved === 'dark' ? 'moon' : 'sun', 18));
      }
    },
    toggle: function () {
      var cur = document.documentElement.getAttribute('data-theme');
      var next = cur === 'dark' ? 'light' : 'dark';
      S.updateSettings({ theme: next });
      theme.apply(next);
    },
    init: function () {
      theme.media = global.matchMedia ? global.matchMedia('(prefers-color-scheme: dark)') : null;
      if (theme.media && theme.media.addEventListener) {
        theme.media.addEventListener('change', function () {
          if (S.settings().theme === 'auto') theme.apply('auto');
        });
      }
      theme.apply(S.settings().theme || 'auto');
    }
  };
  App.theme = theme;

  /* ============================================================
     PWA
     ============================================================ */

  var deferredPrompt = null;
  var swRegistration = null;

  var pwa = {
    init: function () {
      global.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        pwa.renderInstallBanner();
        if (U.qs('#settings')) App.router.refresh();
      });
      global.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        U.toast('LexiFlow установлен на устройство', 'ok', 3200);
        pwa.renderInstallBanner();
      });
      pwa.register();
      setTimeout(function () {
        if (pwa.canInstall() || pwa.isIosSafari()) pwa.renderInstallBanner();
      }, 2500);
    },
    register: function () {
      if (!('serviceWorker' in navigator)) return;
      if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        // swRegistration disabled for mobile build
        reg.addEventListener('updatefound', function () {
          var sw = reg.installing;
          if (!sw) return;
          sw.addEventListener('statechange', function () {
            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
              U.toast('Доступна новая версия — перезагрузите страницу', 'info', 5000);
            }
          });
        });
      }).catch(function (e) {
        console.warn('LexiFlow: service worker не зарегистрирован', e);
      });
    },
    canInstall: function () { return !!deferredPrompt; },
    isStandalone: function () {
      return (global.matchMedia && global.matchMedia('(display-mode: standalone)').matches) ||
        global.navigator.standalone === true;
    },
    isIosSafari: function () {
      var ua = navigator.userAgent || '';
      return /iPad|iPhone|iPod/.test(ua) && !global.MSStream;
    },
    statusText: function () {
      if (!('serviceWorker' in navigator)) return 'Не поддерживается браузером';
      if (location.protocol !== 'http:' && location.protocol !== 'https:') return 'Доступен при запуске через веб-сервер';
      if (!navigator.onLine) return 'Работает офлайн';
      return swRegistration ? 'Активен, приложение кэшировано' : 'Регистрация…';
    },
    promptInstall: function () {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function (choice) {
          if (choice.outcome === 'accepted') U.toast('Устанавливаем…', 'ok');
          deferredPrompt = null;
          pwa.renderInstallBanner();
        });
        return;
      }
      if (pwa.isIosSafari()) {
        U.modal({
          title: 'Установка на iPhone / iPad',
          body: h('div', { class: 'install-guide' },
            h('p', { text: 'Safari не показывает кнопку установки автоматически. Добавьте приложение на главный экран вручную:' }),
            h('ol', {},
              h('li', { text: 'Нажмите кнопку «Поделиться» в нижней панели Safari.' }),
              h('li', { text: 'Выберите «На экран “Домой”».' }),
              h('li', { text: 'Подтвердите — иконка LexiFlow появится среди приложений.' })
            ),
            h('p', { class: 'muted small', text: 'После установки приложение откроется в полноэкранном режиме и будет работать офлайн.' })
          ),
          actions: [{ label: 'Понятно', variant: 'primary' }]
        });
        return;
      }
      U.modal({
        title: 'Установка приложения',
        body: h('div', { class: 'install-guide' },
          h('p', { text: 'Браузер пока не предложил установку автоматически. Обычно она доступна через меню браузера:' }),
          h('ul', {},
            h('li', { text: 'Chrome / Edge: значок «Установить приложение» в адресной строке или меню «⋮» → «Установить приложение».' }),
            h('li', { text: 'Android: меню «⋮» → «Добавить на главный экран».' }),
            h('li', { text: 'Safari на Mac: «Файл» → «Добавить в Dock».' })
          )
        ),
        actions: [{ label: 'Понятно', variant: 'primary' }]
      });
    },
    update: function () {
      if (!swRegistration) { location.reload(); return; }
      swRegistration.update().then(function () {
        U.toast('Проверено. Загружаем свежую версию…', 'info');
        setTimeout(function () { location.reload(); }, 700);
      }).catch(function () { location.reload(); });
    },
    renderInstallBanner: function () {
      var bar = U.qs('#install-bar');
      if (!bar) return;
      var route = router.current || {};
      var onStudy = route.name === 'study' || route.name === 'test';
      var show = (pwa.canInstall() || (pwa.isIosSafari() && !pwa.isStandalone())) &&
        !pwa.isStandalone() && !S.get().meta.installDismissed && !onStudy;
      U.clear(bar);
      bar.classList.toggle('is-visible', !!show);
      if (!show) return;
      U.append(bar, [
        h('span', { class: 'install-bar__icon' }, icon('install', 18)),
        h('div', { class: 'install-bar__text' },
          h('b', { text: 'Установите LexiFlow' }),
          h('span', { class: 'muted small', text: 'Работает офлайн, открывается как обычное приложение' })
        ),
        h('button', { class: 'btn btn--primary btn--sm', onclick: function () { pwa.promptInstall(); } }, h('span', { text: 'Установить' })),
        h('button', {
          class: 'icon-btn', title: 'Скрыть', onclick: function () {
            S.get().meta.installDismissed = true;
            S.save();
            pwa.renderInstallBanner();
          }
        }, icon('close', 16))
      ]);
    }
  };
  App.pwa = pwa;

  /* ============================================================
     Роутер
     ============================================================ */

  var NAV = [
    { id: 'decks', label: 'Колоды', icon: 'layers', hash: '#/decks' },
    { id: 'study', label: 'Учить', icon: 'play', hash: '#/study/all' },
    { id: 'browse', label: 'Словарь', icon: 'list', hash: '#/browse/all' },
    { id: 'stats', label: 'Прогресс', icon: 'chart', hash: '#/stats' },
    { id: 'settings', label: 'Ещё', icon: 'settings', hash: '#/settings' }
  ];

  var router = {
    current: { name: 'decks', params: {} },
    primary: null,
    setPrimary: function (fn) { router.primary = fn; },

    parse: function () {
      var hash = (location.hash || '#/decks').replace(/^#\/?/, '');
      var parts = hash.split('/').filter(Boolean);
      if (!parts.length) return { name: 'decks', params: {} };
      var name = parts[0];
      var id = parts[1] || null;
      var sub = parts[2] || null;
      var map = { decks: 'decks', deck: 'deck', study: 'study', test: 'test', browse: 'browse', stats: 'stats', settings: 'settings', data: 'data', ai: 'ai', sync: 'sync', notify: 'notify', phone: 'phone' };
      return { name: map[name] || 'decks', params: { id: id, sub: sub } };
    },

    go: function (hash) {
      if (location.hash === hash) { router.render(); return; }
      location.hash = hash;
    },

    refresh: function () { router.render(); },

    render: function () {
      var route = router.parse();
      var prev = router.current;
      router.current = route;
      var root = U.qs('#view');
      if (!root) return;
      router.primary = null;

      // смена экрана закрывает открытые диалоги и сбрасывает незавершённую сессию
      U.closeModals();
      var onStudy = route.name === 'study' || route.name === 'test';
      if (!onStudy && prev && (prev.name === 'study' || prev.name === 'test')) {
        App.views.study.discard();
      }

      try {
        switch (route.name) {
          case 'deck': App.views.decks.renderDeck(root, route.params); break;
          case 'study': App.views.study.render(root, route.params); break;
          case 'test': App.views.study.renderTest(root, route.params); break;
          case 'browse': App.views.browse.render(root, route.params); break;
          case 'stats': App.views.stats.render(root, route.params); break;
          case 'settings': App.views.tools.renderSettings(root); break;
          case 'data': App.views.tools.renderData(root); break;
          case 'ai': App.views.ai.render(root); break;
          case 'sync': App.views.sync.render(root); break;
          case 'notify': App.views.notify.render(root); break;
          case 'phone': App.views.phone.render(root); break;
          default: App.views.decks.render(root, route.params);
        }
      } catch (e) {
        console.error('LexiFlow: ошибка отрисовки', e);
        U.clear(root);
        root.appendChild(h('div', { class: 'page' },
          h('div', { class: 'empty' },
            h('div', { class: 'empty__icon' }, icon('warning', 30)),
            h('h3', { class: 'empty__title', text: 'Что-то пошло не так' }),
            h('p', { class: 'empty__text', text: String(e && e.message || e) }),
            h('button', { class: 'btn btn--primary', onclick: function () { App.router.go('#/decks'); } }, h('span', { text: 'На главную' }))
          )));
      }

      router.updateNav(route);
      pwa.renderInstallBanner();
      var main = U.qs('#main');
      if (main) main.scrollTop = 0;
      global.scrollTo(0, 0);
    },

    updateNav: function (route) {
      var activeId = route.name === 'deck' ? 'decks'
        : route.name === 'test' ? 'study'
        : route.name === 'data' ? 'settings'
        : route.name;
      U.qsa('[data-nav]').forEach(function (el) {
        el.classList.toggle('is-active', el.dataset.nav === activeId);
      });
      var title = { decks: 'Колоды', deck: 'Колода', study: 'Тренировка', test: 'Тест', browse: 'Словарь', stats: 'Прогресс', settings: 'Настройки', data: 'Данные', ai: 'Промпт для нейросети', sync: 'Синхронизация', notify: 'Напоминания', phone: 'На телефон' }[route.name] || 'LexiFlow';
      document.title = 'LexiFlow — ' + title;
    }
  };
  App.router = router;

  /* ============================================================
     Оболочка
     ============================================================ */

  function buildShell() {
    var sidebar = U.qs('#sidebar');
    var tabbar = U.qs('#tabbar');

    U.clear(sidebar);
    U.append(sidebar, [
      h('div', { class: 'brand' },
        h('div', { class: 'brand__logo' }, icon('layers', 20)),
        h('div', { class: 'brand__text' },
          h('b', { text: 'LexiFlow' }),
          h('span', { text: 'интервальное повторение' })
        )
      ),
      h('nav', { class: 'nav' },
        NAV.map(function (n) {
          return h('a', {
            class: 'nav__item', href: n.hash, dataset: { nav: n.id }
          }, icon(n.icon, 19), h('span', { text: n.label }));
        })
      ),
      h('div', { class: 'nav nav--secondary' },
        h('a', { class: 'nav__item', href: '#/ai', dataset: { nav: 'ai' } }, icon('sparkle', 19), h('span', { text: 'Промпт для нейросети' })),
        h('a', { class: 'nav__item', href: '#/sync', dataset: { nav: 'sync' } }, icon('refresh', 19), h('span', { text: 'Синхронизация' })),
        h('a', { class: 'nav__item', href: '#/notify', dataset: { nav: 'notify' } }, icon('bell', 19), h('span', { text: 'Напоминания' })),
        h('a', { class: 'nav__item', href: '#/phone', dataset: { nav: 'phone' } }, icon('grid', 19), h('span', { text: 'На телефон' })),
        h('a', { class: 'nav__item', href: '#/data', dataset: { nav: 'data' } }, icon('download', 19), h('span', { text: 'Импорт / экспорт' }))
      ),
      h('div', { class: 'sidebar__foot' },
        h('button', { class: 'nav__item nav__item--btn', id: 'theme-toggle', onclick: function () { theme.toggle(); } }, icon('moon', 19), h('span', { text: 'Сменить тему' }))
      )
    ]);

    U.clear(tabbar);
    U.append(tabbar, NAV.map(function (n) {
      return h('a', { class: 'tab', href: n.hash, dataset: { nav: n.id } },
        icon(n.icon, 21), h('span', { text: n.label }));
    }));
  }

  /* ============================================================
     Инициализация
     ============================================================ */

  function init() {
    S.load();

    // первый запуск — демонстрационные колоды, чтобы приложение не выглядело пустым
    var data = S.get();
    if (!data.decks.length && !data.meta.seeded) {
      S.seedDemo();
      S.flush();
    }
    data.meta.lastOpen = Date.now();

    theme.init();
    if (S.settings().reduceMotion) document.documentElement.classList.add('reduce-motion');

    buildShell();

    global.addEventListener('hashchange', function () { router.render(); });
    if (!location.hash) location.hash = '#/decks';

    router.render();

    /* Синхронизация уже была настроена на этом устройстве — возобновляем.
       S.load() уже прогнал данные из localStorage, поэтому isConfigured()
       видит настоящие настройки. */
    if (App.sync && App.sync.isConfigured()) {
      App.sync.start();
    }

    pwa.init();

    // сохранение при уходе со страницы
    global.addEventListener('beforeunload', function () { S.flush(); });
    // pagehide — страховка для iOS Safari: beforeunload там ненадёжен,
    // а свернул приложение и потерял правки — обидно. flush() идемпотентен.
    global.addEventListener('pagehide', function () { S.flush(); });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') S.flush();
    });

    /* Правки с другого устройства. Удалил карточку на телефоне — на
       компьютере она обязана исчезнуть сама, а не ждать ручной
       синхронизации: для этого синхронизация и заведена. Обновляем только
       когда ничего не вырываем из рук (см. App.sync.shouldRefreshOnRemote). */
    if (typeof S.subscribe === 'function') {
      S.subscribe(function (reason) {
        if (String(reason || '') !== 'sync:remote') return;
        var route = router.current || {};
        var active = document.activeElement;
        if (!App.sync.shouldRefreshOnRemote({
          inSession: route.name === 'study' || route.name === 'test',
          modalOpen: !!U.qs('.modal'),
          typing: !!active && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName || '')
        })) return;
        router.render();
        U.toast('Данные обновлены с другого устройства', 'info', 2000);
      });
    }

    // связь между вкладками
    global.addEventListener('storage', function (e) {
      if (e.key === S.STORAGE_KEY && e.newValue) {
        try {
          S.load();
          router.render();
          U.toast('Данные обновлены в другой вкладке', 'info');
        } catch (err) { /* ignore */ }
      }
    });

    global.addEventListener('online', function () { U.toast('Соединение восстановлено', 'ok', 1600); });
    global.addEventListener('offline', function () { U.toast('Офлайн-режим: приложение продолжает работать', 'info', 2600); });

    console.log('%cLexiFlow', 'font-weight:700;color:#7c5cff', 'готово · колод: ' + data.decks.length + ', карточек: ' + data.cards.length);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})(window);
