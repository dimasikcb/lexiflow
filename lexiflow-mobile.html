<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LexiFlow — тренажёр иностранных слов</title>

<meta name="description" content="LexiFlow — веб-приложение для изучения иностранных слов: колоды карточек, интервальное повторение, тренировки и тесты, статистика, работа офлайн.">
<meta name="theme-color" content="#0e1016">
<meta name="color-scheme" content="dark light">






<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LexiFlow">
<meta name="application-name" content="LexiFlow">
<meta name="format-detection" content="telephone=no">

<style>
/* ============================================================
   LexiFlow — style.css
   Тёмная и светлая темы, адаптивная вёрстка (сайдбар → таббар).
   ============================================================ */

/* ---------- Токены ---------- */

:root {
  --bg: #0e1016;
  --bg-soft: #131722;
  --panel: #171b26;
  --panel-2: #1c2130;
  --panel-3: #222838;
  --border: #272e3d;
  --border-soft: #1f2532;
  --text: #e9edf6;
  --text-dim: #a3adc0;
  --text-mute: #6f7889;
  --accent: #7c5cff;
  --accent-2: #9b7bff;
  --accent-soft: rgba(124, 92, 255, .16);
  --teal: #2ec5b6;
  --amber: #f0b429;
  --danger: #ff5c72;
  --ok: #3ddc84;
  --shadow-lg: 0 24px 60px rgba(0, 0, 0, .45);
  --shadow: 0 10px 28px rgba(0, 0, 0, .32);
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, .22);
  --radius: 18px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --sidebar-w: 268px;
  --maxw: 1180px;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}

[data-theme="light"] {
  --bg: #f4f5fa;
  --bg-soft: #eceef6;
  --panel: #ffffff;
  --panel-2: #f7f8fd;
  --panel-3: #eef0f8;
  --border: #e2e5ef;
  --border-soft: #ebedf5;
  --text: #171a24;
  --text-dim: #5c6577;
  --text-mute: #8b93a5;
  --accent: #6845f0;
  --accent-2: #8360ff;
  --accent-soft: rgba(104, 69, 240, .1);
  --teal: #12a894;
  --amber: #d99a08;
  --danger: #e8384f;
  --ok: #16a34a;
  --shadow-lg: 0 24px 60px rgba(28, 33, 56, .16);
  --shadow: 0 10px 28px rgba(28, 33, 56, .1);
  --shadow-sm: 0 2px 8px rgba(28, 33, 56, .07);
  color-scheme: light;
}

/* ---------- База ---------- */

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

body.is-locked { overflow: hidden; }

h1, h2, h3, h4 { margin: 0; font-weight: 650; letter-spacing: -.01em; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
input, textarea, select { font: inherit; }
ul, ol { margin: 0; padding-left: 1.15em; }

.muted { color: var(--text-dim); }
.small { font-size: 13px; }
.hidden { display: none !important; }
.row-gap { display: flex; gap: 8px; flex-wrap: wrap; }
.warn-text { color: var(--amber); font-size: 13px; }
.mono { font-family: var(--mono); }

.dot {
  display: inline-block;
  width: 9px; height: 9px;
  border-radius: 50%;
  margin-right: 8px;
  flex: none;
}

.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after {
  animation-duration: .001ms !important;
  transition-duration: .001ms !important;
}

/* ---------- Каркас ---------- */

#app {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  min-height: 100dvh;
}

#view { min-width: 0; }

.page {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 28px 32px 56px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.page--narrow { max-width: 880px; }

/* ---------- Сайдбар ---------- */

.sidebar {
  position: sticky;
  top: 0;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 22px 16px;
  background: var(--bg-soft);
  border-right: 1px solid var(--border-soft);
}

.brand { display: flex; align-items: center; gap: 12px; padding: 0 6px 6px; }

.brand__logo {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border-radius: 13px;
  background: linear-gradient(140deg, var(--accent), var(--teal));
  color: #fff;
  box-shadow: 0 8px 22px rgba(124, 92, 255, .35);
}

.brand__text { display: flex; flex-direction: column; line-height: 1.25; }
.brand__text b { font-size: 16px; letter-spacing: -.02em; }
.brand__text span { font-size: 11.5px; color: var(--text-mute); }

.nav { display: flex; flex-direction: column; gap: 3px; }

.nav__item {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 13px;
  border-radius: var(--radius-sm);
  color: var(--text-dim);
  font-size: 14.5px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  transition: background .16s ease, color .16s ease;
}

.nav__item:hover { background: var(--panel-3); color: var(--text); }

.nav__item.is-active {
  background: var(--accent-soft);
  color: var(--text);
  font-weight: 600;
}

.nav__item.is-active svg { color: var(--accent-2); }

.nav--secondary { margin-top: auto; }
.sidebar__foot { border-top: 1px solid var(--border-soft); padding-top: 12px; }

/* ---------- Таббар (мобильные) ---------- */

.tabbar {
  display: none;
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 60;
  padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--bg-soft) 92%, transparent);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--border-soft);
}

.tab {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 2px;
  color: var(--text-mute);
  font-size: 10.5px;
  font-weight: 500;
  border-radius: 12px;
}

.tab.is-active { color: var(--accent-2); }
.tab svg { width: 21px; height: 21px; }

/* ---------- Кнопки ---------- */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px;
  border-radius: 12px;
  border: 1px solid transparent;
  background: var(--panel-3);
  color: var(--text);
  font-size: 14px;
  font-weight: 550;
  cursor: pointer;
  white-space: nowrap;
  transition: transform .12s ease, background .16s ease, border-color .16s ease, opacity .16s ease;
}

.btn:active { transform: scale(.975); }
.btn--primary { background: linear-gradient(140deg, var(--accent), #6a4bf0); color: #fff; box-shadow: 0 8px 20px rgba(124, 92, 255, .28); }
.btn--primary:hover { filter: brightness(1.06); }
.btn--ghost { background: transparent; border-color: var(--border); color: var(--text-dim); }
.btn--ghost:hover { background: var(--panel-3); color: var(--text); }
.btn--danger { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 34%, transparent); }
.btn--danger:hover { background: color-mix(in srgb, var(--danger) 24%, transparent); }
.btn--sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.btn--lg { padding: 14px 22px; font-size: 15.5px; border-radius: 14px; }
.btn--wide { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.icon-btn {
  display: inline-grid; place-items: center;
  width: 36px; height: 36px;
  border-radius: 11px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  flex: none;
  transition: background .16s ease, color .16s ease;
}

.icon-btn:hover { background: var(--panel-3); color: var(--text); }
.icon-btn--danger:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 14%, transparent); }
.icon-btn--round { border-radius: 50%; background: var(--panel-3); width: 34px; height: 34px; }
.icon-btn--sm { width: 28px; height: 28px; border-radius: 9px; }
.icon-btn.is-playing { color: var(--teal); animation: pulse 1s ease infinite; }
.icon-btn:disabled { opacity: .35; cursor: default; }

@keyframes pulse { 50% { transform: scale(1.12); } }

/* ---------- Заголовки страниц ---------- */

.page-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 18px; flex-wrap: wrap;
}

.page-head__main { display: flex; align-items: flex-start; gap: 10px; }
.page-head__actions { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }

.page-title {
  font-size: 26px; letter-spacing: -.025em;
  display: flex; align-items: center; gap: 4px;
}

.page-sub { color: var(--text-dim); font-size: 13.5px; margin-top: 3px; }

.search-wrap {
  display: flex; align-items: center; gap: 8px;
  padding: 0 12px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text-mute);
  min-width: 210px;
}

.search-wrap--sm { min-width: 170px; padding: 0 10px; }
.search-wrap--grow { flex: 1; min-width: 200px; }
.search-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.input--search { border: none !important; background: none !important; padding: 10px 0 !important; box-shadow: none !important; width: 100%; }

/* ---------- Обзорные карточки ---------- */

.overview { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }

.ov-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  display: flex; flex-direction: column; gap: 4px;
  position: relative;
  overflow: hidden;
}

.ov-card--accent { border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: linear-gradient(150deg, var(--accent-soft), var(--panel)); }

.ov-card__top { display: flex; align-items: center; gap: 8px; color: var(--text-dim); font-size: 13px; }
.ov-card__top svg { color: var(--accent-2); }
.ov-card__value { font-size: 27px; letter-spacing: -.03em; }
.ov-card__hint { font-size: 12px; color: var(--text-mute); }

/* ---------- Колоды ---------- */

.deck-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }

.deck-tile {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  display: flex; flex-direction: column; gap: 14px;
  cursor: pointer;
  overflow: hidden;
  transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
}

.deck-tile:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--deck-color) 55%, transparent); box-shadow: var(--shadow); }

.deck-tile__glow {
  position: absolute; inset: -40% 55% 55% -20%;
  background: radial-gradient(circle at 30% 30%, var(--deck-color), transparent 68%);
  opacity: .17; filter: blur(24px); pointer-events: none;
}

.deck-tile__head { display: flex; align-items: flex-start; gap: 12px; position: relative; }

.deck-tile__badge {
  width: 40px; height: 40px; flex: none;
  display: grid; place-items: center;
  border-radius: 12px;
  background: color-mix(in srgb, var(--deck-color) 22%, transparent);
  color: var(--deck-color);
}

.deck-tile__meta { flex: 1; min-width: 0; }
.deck-tile__name { font-size: 16.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.deck-tile__langs { font-size: 12.5px; color: var(--text-mute); margin-top: 2px; }
.deck-tile__counts { display: flex; gap: 8px; flex-wrap: wrap; }

.count-pill {
  display: flex; align-items: baseline; gap: 5px;
  padding: 6px 10px;
  border-radius: 10px;
  background: var(--panel-2);
  border: 1px solid var(--border-soft);
  font-size: 12px; color: var(--text-dim);
}

.count-pill b { font-size: 14px; color: var(--text); }
.count-pill--due b { color: var(--amber); }
.count-pill--new b { color: var(--accent-2); }

.deck-tile__foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
.deck-tile__cta { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--accent-2); }
.deck-tile__cta--ghost { color: var(--text-dim); }

.progress { height: 6px; border-radius: 99px; background: var(--panel-3); overflow: hidden; }
.progress--sm { height: 5px; margin-top: 6px; }
.progress__bar { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--teal)); transition: width .4s ease; }

/* ---------- Панели ---------- */

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.panel--wide { padding-bottom: 4px; }

.panel__head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px; flex-wrap: wrap;
  padding: 16px 18px;
  border-bottom: 1px solid var(--border-soft);
}

.panel__title { font-size: 16px; display: flex; align-items: center; gap: 8px; }
.panel__title svg { color: var(--accent-2); }
.panel__tools { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.panel__body { padding: 6px 18px 18px; display: flex; flex-direction: column; gap: 4px; }
.panel__section { padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--border-soft); }
.panel__section--row { flex-direction: row; flex-wrap: wrap; gap: 18px; align-items: center; }
.panel__foot { padding: 16px 18px; display: flex; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--border-soft); }

/* ---------- Панель действий в колоде ---------- */

.action-bar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }

.action-card {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  cursor: pointer;
  text-align: left;
  color: var(--text-dim);
  transition: border-color .16s ease, transform .16s ease, background .16s ease;
}

.action-card:hover { border-color: color-mix(in srgb, var(--accent) 45%, transparent); transform: translateY(-2px); background: var(--panel-2); }
.action-card__icon { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 11px; background: var(--accent-soft); color: var(--accent-2); }
.action-card__body { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.action-card__body b { color: var(--text); font-size: 14.5px; }
.action-card__body small { color: var(--text-mute); font-size: 12px; }
.action-card > svg { color: var(--text-mute); flex: none; }

.stat-row { display: flex; gap: 10px; flex-wrap: wrap; }

.stat-chip {
  display: flex; align-items: baseline; gap: 6px;
  padding: 8px 13px;
  border-radius: 12px;
  background: var(--panel);
  border: 1px solid var(--border);
  font-size: 12.5px; color: var(--text-dim);
}

.stat-chip b { font-size: 16px; color: var(--text); }
.stat-chip--due b { color: var(--amber); }
.stat-chip--new b { color: var(--accent-2); }
.stat-chip--learning b { color: var(--amber); }
.stat-chip--review b { color: var(--teal); }

/* ---------- Чипы ---------- */

.chips { display: flex; gap: 8px; flex-wrap: wrap; }

.chip {
  padding: 7px 13px;
  border-radius: 99px;
  border: 1px solid var(--border);
  background: var(--panel-2);
  color: var(--text-dim);
  font-size: 13px;
  cursor: pointer;
  transition: all .16s ease;
}

.chip:hover { color: var(--text); border-color: var(--text-mute); }
.chip.is-active { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 50%, transparent); color: var(--text); font-weight: 550; }

/* ---------- Список слов ---------- */

.word-list { display: flex; flex-direction: column; }

.word-row {
  display: flex; align-items: center; gap: 14px;
  padding: 13px 18px;
  border-top: 1px solid var(--border-soft);
  transition: background .14s ease;
}

.word-row:hover { background: var(--panel-2); }
.word-row__main { flex: 1; min-width: 0; }
.word-row__top { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.word-row__word { font-size: 15.5px; font-weight: 600; }
.word-row__ipa { font-family: var(--mono); font-size: 12.5px; color: var(--text-mute); }
.word-row__trans { color: var(--text-dim); font-size: 14px; margin-top: 2px; }
.word-row__example { color: var(--text-mute); font-size: 12.5px; font-style: italic; margin-top: 3px; }
.word-row__example-trans { font-style: normal; opacity: .85; }
.word-row__example-more { font-style: normal; font-size: 11px; opacity: .7; white-space: nowrap; }
.word-row__side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
.word-row__due { font-size: 11.5px; color: var(--text-mute); }
.word-row__actions { display: flex; gap: 2px; flex: none; }

.tag {
  display: inline-flex; align-items: center;
  padding: 3px 9px;
  border-radius: 8px;
  font-size: 11.5px;
  font-weight: 550;
  background: var(--panel-3);
  color: var(--text-dim);
}

.tag--new { background: var(--accent-soft); color: var(--accent-2); }
.tag--learning { background: color-mix(in srgb, var(--amber) 18%, transparent); color: var(--amber); }
.tag--review { background: color-mix(in srgb, var(--teal) 18%, transparent); color: var(--teal); }
.tag--warn { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
.tag--muted { background: var(--panel-3); color: var(--text-mute); }

/* ---------- Пустое состояние ---------- */

.empty {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 52px 24px;
  text-align: center;
}

.empty__icon {
  width: 64px; height: 64px;
  display: grid; place-items: center;
  border-radius: 20px;
  background: var(--accent-soft);
  color: var(--accent-2);
}

.empty__title { font-size: 17px; }
.empty__text { color: var(--text-dim); font-size: 14px; max-width: 420px; }
.empty > .btn, .empty > .row-gap { margin-top: 8px; }

/* ---------- Формы ---------- */

.form { display: flex; flex-direction: column; gap: 14px; }
.form--grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.form--grid > .muted { grid-column: 1 / -1; }
.form__row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
.form__block { display: flex; flex-direction: column; gap: 8px; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field__label { font-size: 12.5px; font-weight: 550; color: var(--text-dim); }
.field__hint { font-size: 11.5px; color: var(--text-mute); }

.input {
  width: 100%;
  padding: 11px 13px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--panel-2);
  color: var(--text);
  outline: none;
  transition: border-color .16s ease, box-shadow .16s ease;
}

.input::placeholder { color: var(--text-mute); }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input--lg { font-size: 16.5px; padding: 13px 15px; font-weight: 550; }
.input--area { resize: vertical; min-height: 66px; line-height: 1.5; }
.input--mono { font-family: var(--mono); font-size: 13px; }
.input--num { width: 110px; text-align: center; }
.input--sm { padding: 8px 10px; font-size: 13px; width: auto; }
select.input { cursor: pointer; }

.inline-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.range-row { display: flex; align-items: center; gap: 10px; }
.range-row input[type="range"] { width: 150px; accent-color: var(--accent); }
.range-row__value { min-width: 42px; text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- Субтитры озвучки ---------- */
/* Слово, которое синтезатор произносит прямо сейчас, подсвечивается —
   так текст на экране не расходится со звуком. */
.tts-word {
  border-radius: 5px;
  padding: 0 2px;
  margin: 0 -2px;
  transition: background-color .08s linear, color .08s linear, box-shadow .08s linear;
}
/* Подсветка идёт через box-shadow, а не через padding: строка не «прыгает». */
.tts-word.is-spoken {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 0 0 2px var(--accent);
}

.voice-rows { display: grid; gap: 4px; }
.voice-rows .setting-row { padding: 8px 0; }

/* --- Качество голоса: вердикт вместо непонятного названия --- */
.quality-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .01em;
  white-space: nowrap;
}
.quality-badge--neural { background: color-mix(in srgb, var(--teal) 22%, transparent); color: var(--teal); }
.quality-badge--normal { background: var(--panel-2); color: var(--text-dim); }
.quality-badge--poor { background: color-mix(in srgb, var(--danger) 20%, transparent); color: var(--danger); }
.quality-badge--none { background: color-mix(in srgb, var(--danger) 20%, transparent); color: var(--danger); }

.voice-diag {
  display: grid;
  gap: 6px;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--panel-2);
  margin-bottom: 8px;
}
.voice-diag--neural { border-color: color-mix(in srgb, var(--teal) 40%, transparent); }
.voice-diag--poor,
.voice-diag--none { border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
.voice-diag__head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.voice-diag__head svg { color: var(--text-dim); flex: none; }
.voice-diag--neural .voice-diag__head svg { color: var(--teal); }
.voice-diag--poor .voice-diag__head svg,
.voice-diag--none .voice-diag__head svg { color: var(--danger); }
.voice-diag__fix { margin: 0; font-size: 13px; line-height: 1.5; color: var(--text-dim); }

/* Предупреждение об озвучке в начале тренировки: голосов нет или они
   механические. Не модальное — оно не должно мешать отвечать. */
.tts-notice {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent);
  background: color-mix(in srgb, var(--danger) 10%, var(--panel-2));
  margin: 0 16px 4px;
}
.tts-notice--soft {
  border-color: color-mix(in srgb, var(--amber) 40%, transparent);
  background: var(--panel-2);
}
.tts-notice__text { display: grid; gap: 4px; flex: 1; min-width: 0; }
.tts-notice__text b { font-size: 14px; }
.tts-notice__text span { line-height: 1.5; color: var(--text-dim); }
.tts-notice__actions { display: flex; align-items: center; gap: 6px; flex: none; }
/* Кнопка скачивания сетевой озвучки: в строку действий она не помещается,
   поэтому занимает всю ширину под текстом предупреждения. */
.tts-notice { flex-wrap: wrap; }
.tts-notice__download { flex-basis: 100%; display: grid; gap: 8px; }
.tts-notice__progress { display: grid; gap: 6px; }

/* Панель «Качественная озвучка из интернета» в настройках */
.tts-net__warn {
  display: grid; gap: 4px;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid color-mix(in srgb, var(--amber) 40%, transparent);
  background: color-mix(in srgb, var(--amber) 8%, var(--panel-2));
  font-size: 12.5px; line-height: 1.5; color: var(--text-dim);
}
.tts-net__progress { display: grid; gap: 6px; }
.tts-net__status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
@media (max-width: 640px) {
  .tts-notice { flex-direction: column; align-items: stretch; margin: 0 10px 4px; }
  .tts-notice__actions { justify-content: space-between; }
}

.color-row { display: flex; gap: 8px; flex-wrap: wrap; }
.color-dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: transform .14s ease; }
.color-dot:hover { transform: scale(1.12); }
.color-dot.is-active { border-color: var(--text); box-shadow: 0 0 0 3px var(--accent-soft); }

.examples { display: flex; flex-direction: column; gap: 9px; }
.example-row { display: flex; align-items: flex-start; gap: 8px; }
.example-row__fields { flex: 1; display: flex; flex-direction: column; gap: 7px; }

.switch { position: relative; display: inline-flex; width: 46px; height: 27px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch__track { position: absolute; inset: 0; border-radius: 99px; background: var(--panel-3); border: 1px solid var(--border); transition: background .18s ease; pointer-events: none; }
.switch__track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 21px; height: 21px; border-radius: 50%; background: var(--text-mute); transition: transform .18s ease, background .18s ease; }
.switch input:checked + .switch__track { background: var(--accent); border-color: var(--accent); }
.switch input:checked + .switch__track::after { transform: translateX(19px); background: #fff; }

.switch-row { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--text-dim); cursor: pointer; }
.switch-row--num { gap: 12px; }

.segmented { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--panel-3); border: 1px solid var(--border); }
.segmented__item { padding: 7px 13px; border: none; background: none; border-radius: 9px; font-size: 13px; color: var(--text-dim); cursor: pointer; }
.segmented__item.is-active { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: var(--shadow-sm); }

.check-option { display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--text-dim); cursor: pointer; }
.check-option input { width: 17px; height: 17px; accent-color: var(--accent); }

.check { position: relative; display: inline-flex; flex: none; cursor: pointer; }
.check input { position: absolute; opacity: 0; width: 22px; height: 22px; margin: 0; cursor: pointer; }
.check__box {
  width: 21px; height: 21px;
  display: grid; place-items: center;
  border-radius: 7px;
  border: 1.5px solid var(--border);
  background: var(--panel-2);
  color: transparent;
  transition: all .15s ease;
}
.check input:checked + .check__box { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ---------- Модальные окна ---------- */

.overlay {
  position: fixed; inset: 0; z-index: 200;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background: rgba(6, 8, 14, .62);
  backdrop-filter: blur(6px);
  opacity: 0;
  transition: opacity .18s ease;
}

.overlay.is-in { opacity: 1; }

.modal {
  width: 100%;
  max-width: 560px;
  max-height: min(88dvh, 900px);
  display: flex; flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow-lg);
  transform: translateY(10px) scale(.99);
  transition: transform .2s ease;
  overflow: hidden;
}

.overlay.is-in .modal { transform: none; }

.modal__head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 16px 18px;
  border-bottom: 1px solid var(--border-soft);
}

.modal__title { font-size: 17px; }
.modal__body { padding: 18px; overflow-y: auto; }
.modal__foot { display: flex; gap: 10px; justify-content: flex-end; padding: 14px 18px; border-top: 1px solid var(--border-soft); flex-wrap: wrap; }
.modal__text { color: var(--text-dim); }

.menu-list { display: flex; flex-direction: column; gap: 2px; }

.menu-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 13px;
  border-radius: 12px;
  border: none; background: none;
  color: var(--text-dim);
  font-size: 14.5px;
  text-align: left;
  cursor: pointer;
  width: 100%;
}

.menu-item:hover { background: var(--panel-2); color: var(--text); }
.menu-item--danger { color: var(--danger); }
.menu-item--danger:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); }

/* ---------- Тосты ---------- */

#toasts {
  position: fixed;
  left: 50%; top: calc(14px + env(safe-area-inset-top));
  transform: translateX(-50%);
  z-index: 400;
  display: flex; flex-direction: column; gap: 8px; align-items: center;
  pointer-events: none;
  width: min(92vw, 460px);
}

.toast {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 16px;
  border-radius: 13px;
  background: var(--panel-3);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  font-size: 14px;
  opacity: 0;
  transform: translateY(-12px);
  transition: opacity .22s ease, transform .22s ease;
  max-width: 100%;
}

.toast.is-in { opacity: 1; transform: none; }
.toast--ok svg { color: var(--ok); }
.toast--err svg { color: var(--danger); }
.toast--warn svg { color: var(--amber); }
.toast--info svg { color: var(--accent-2); }

/* ---------- Баннер установки ---------- */

.install-bar {
  display: none;
  align-items: center; gap: 12px;
  margin: 0 auto 8px;
  max-width: var(--maxw);
  padding: 12px 16px;
  border-radius: var(--radius-md);
  background: linear-gradient(120deg, var(--accent-soft), var(--panel));
  border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
}

.install-bar.is-visible { display: flex; }
.install-bar__icon { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: 11px; background: var(--accent); color: #fff; }
.install-bar__text { display: flex; flex-direction: column; flex: 1; min-width: 0; }

/* ============================================================
   Тренировка
   ============================================================ */

.study {
  max-width: 780px;
  margin: 0 auto;
  padding: 18px 20px 40px;
  min-height: 100dvh;
  display: flex; flex-direction: column; gap: 18px;
}

.study__bar { display: flex; align-items: center; gap: 14px; }
.study__meter { flex: 1; min-width: 0; }
.study__meter-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.study__meter-label { font-size: 13px; color: var(--text-dim); }
.study__meter-right { font-size: 12px; color: var(--text-mute); }
.study__actions { display: flex; gap: 4px; }

.study__stage { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
.study__footer { display: flex; flex-direction: column; gap: 10px; }

.qcard {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 26px;
  display: flex; flex-direction: column; gap: 18px;
  animation: cardIn .28s ease;
}

@keyframes cardIn { from { opacity: 0; transform: translateY(10px); } }

.qcard__prompt { display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; }
.qcard__label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-mute); }
.qcard__word { display: flex; align-items: center; gap: 10px; justify-content: center; flex-wrap: wrap; }
.qcard__word-text { font-size: clamp(26px, 6vw, 40px); font-weight: 680; letter-spacing: -.03em; line-height: 1.15; }
.qcard__ipa { font-family: var(--mono); font-size: 15px; color: var(--text-mute); }

.qcard__answer {
  border-top: 1px dashed var(--border);
  padding-top: 18px;
  display: flex; flex-direction: column; gap: 12px;
  animation: cardIn .24s ease;
}

.qcard__answer-main { display: flex; align-items: center; gap: 10px; justify-content: center; flex-wrap: wrap; }
.qcard__answer-text { font-size: clamp(20px, 4.6vw, 28px); font-weight: 620; color: var(--teal); text-align: center; }
.qcard__examples { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.qcard__examples li { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 13px; border-radius: 12px; background: var(--panel-2); font-size: 14px; }
.qcard__example-text { color: var(--text); }
.qcard__example-trans { color: var(--text-mute); font-size: 13px; }
.qcard__notes { font-size: 13.5px; color: var(--text-dim); background: var(--panel-2); padding: 10px 13px; border-radius: 12px; }
.qcard__tags { display: flex; gap: 6px; flex-wrap: wrap; }

/* Рейтинг */

.rating-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; }

.rate {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 12px 6px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--panel);
  cursor: pointer;
  transition: transform .12s ease, border-color .16s ease, background .16s ease;
}

.rate:active { transform: scale(.97); }
.rate__label { font-size: 14px; font-weight: 600; }
.rate__interval { font-size: 11.5px; color: var(--text-mute); }
.rate__key { font-size: 10px; color: var(--text-mute); border: 1px solid var(--border); border-radius: 5px; padding: 0 4px; margin-top: 2px; }

.rate--1 { color: var(--danger); }
.rate--2 { color: var(--amber); }
.rate--3 { color: var(--teal); }
.rate--4 { color: var(--accent-2); }
.rate--1:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); border-color: var(--danger); }
.rate--2:hover { background: color-mix(in srgb, var(--amber) 12%, transparent); border-color: var(--amber); }
.rate--3:hover { background: color-mix(in srgb, var(--teal) 12%, transparent); border-color: var(--teal); }
.rate--4:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); border-color: var(--accent); }
.rate.is-suggested { border-color: currentColor; box-shadow: 0 0 0 3px var(--accent-soft); }

.kbd-hint { font-size: 11px; color: var(--text-mute); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; margin-left: 4px; }

/* Варианты ответа */

.choices { display: grid; gap: 10px; }

.choice {
  display: flex; align-items: center; gap: 12px;
  padding: 15px 17px;
  border-radius: 15px;
  border: 1px solid var(--border);
  background: var(--panel-2);
  cursor: pointer;
  text-align: left;
  font-size: 15.5px;
  transition: border-color .14s ease, background .14s ease, transform .12s ease;
}

.choice:hover:not(.is-locked) { border-color: var(--accent); background: var(--panel-3); }
.choice:active:not(.is-locked) { transform: scale(.99); }
.choice__key { width: 24px; height: 24px; flex: none; display: grid; place-items: center; border-radius: 8px; background: var(--panel-3); font-size: 12px; color: var(--text-mute); }
.choice__text { flex: 1; }
.choice.is-correct { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.choice.is-correct .choice__key { background: var(--ok); color: #04140b; }
.choice.is-wrong { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 13%, transparent); }
.choice.is-wrong .choice__key { background: var(--danger); color: #fff; }
.choice.is-locked { cursor: default; opacity: .92; }

/* Ввод перевода */

.typing { display: flex; flex-direction: column; gap: 12px; }
.input--answer { font-size: 18px; padding: 15px 17px; text-align: center; }
.input--answer.is-ok { border-color: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
.input--answer.is-near { border-color: var(--amber); box-shadow: 0 0 0 3px color-mix(in srgb, var(--amber) 20%, transparent); }
.input--answer.is-bad { border-color: var(--danger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 20%, transparent); }

.typing__result { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.typing__verdict { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; }
.typing__result--ok .typing__verdict { color: var(--ok); }
.typing__result--near .typing__verdict { color: var(--amber); }
.typing__result--bad .typing__verdict { color: var(--danger); }
.typing__diff { font-size: 17px; letter-spacing: .01em; }
.typing__diff del { color: var(--danger); text-decoration: line-through; opacity: .8; }
.typing__diff ins { color: var(--ok); text-decoration: none; border-bottom: 2px solid var(--ok); }

/* Аудирование */

.qcard__prompt--audio { gap: 14px; }
.audio-controls { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.audio-controls__row { display: flex; gap: 8px; }

.audio-hero {
  position: relative;
  width: 116px; height: 116px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--panel-2);
  color: var(--accent-2);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  cursor: pointer;
}

.audio-hero__ring { position: absolute; inset: -6px; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); }
.audio-hero__hint { font-size: 10px; color: var(--text-mute); }
.audio-hero.is-playing { color: var(--teal); animation: pulse 1s ease infinite; }
.audio-hero.is-playing .audio-hero__ring { border-color: var(--teal); }

/* Ожидание обучения */

.inter { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 46px 24px; text-align: center; }
.inter__icon { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 20px; background: var(--accent-soft); color: var(--accent-2); }
.inter__title { font-size: 19px; }
.inter__text { color: var(--text-dim); max-width: 440px; }
.inter__timer { color: var(--text); }
.inter__actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }

/* Результаты */

.result { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding: 22px 0; }
.result__icon { width: 76px; height: 76px; display: grid; place-items: center; border-radius: 24px; background: var(--accent-soft); color: var(--accent-2); }
.result__icon--test { background: color-mix(in srgb, var(--amber) 18%, transparent); color: var(--amber); }
.result__title { font-size: 23px; }
.result__sub { color: var(--text-dim); }

.result-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; width: 100%; margin-top: 10px; }
.result-stat { display: flex; flex-direction: column; gap: 2px; padding: 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--border); }
.result-stat b { font-size: 21px; letter-spacing: -.02em; }
.result-stat span { font-size: 12px; color: var(--text-mute); }

.result__actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }

.mistake-list { display: flex; flex-direction: column; }
.mistake { display: flex; align-items: center; gap: 12px; padding: 11px 18px; border-top: 1px solid var(--border-soft); font-size: 14.5px; }
.mistake__trans { color: var(--text-dim); }

/* ---------- Экран выбора режима ---------- */

.mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; padding: 4px 18px 14px; }

.mode-card {
  display: flex; flex-direction: column; gap: 6px;
  padding: 15px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: var(--panel-2);
  cursor: pointer;
  text-align: left;
  color: var(--text-dim);
  transition: all .16s ease;
}

.mode-card:hover { border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.mode-card.is-active { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
.mode-card__icon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 11px; background: var(--panel-3); color: var(--accent-2); }
.mode-card b { color: var(--text); font-size: 14.5px; }
.mode-card small { color: var(--text-mute); font-size: 12px; line-height: 1.4; }
.mode-grid--compact { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }

/* ---------- Словарь ---------- */

.browse-toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.browse-toolbar .input { width: auto; min-width: 150px; }

.bulk-bar {
  display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
  padding: 12px 16px;
  border-radius: var(--radius-md);
  background: var(--accent-soft);
  border: 1px solid color-mix(in srgb, var(--accent) 34%, transparent);
}

.bulk-bar__count { font-weight: 600; font-size: 13.5px; }

.browse-list { display: flex; flex-direction: column; gap: 0; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }

.browse-row { display: flex; align-items: center; gap: 14px; padding: 13px 16px; border-top: 1px solid var(--border-soft); }
.browse-row:first-child { border-top: none; }
.browse-row:hover { background: var(--panel-2); }
.browse-row.is-selected { background: var(--accent-soft); }
.browse-row__main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.browse-row__top { display: flex; align-items: center; gap: 8px; }
.browse-row__word { font-size: 15px; }
.browse-row__trans { color: var(--text-dim); font-size: 14px; }
.browse-row__side { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex: none; }
.browse-row__actions { display: flex; gap: 2px; flex: none; }

/* ---------- Статистика ---------- */

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }

.kpi {
  padding: 16px 18px;
  border-radius: var(--radius);
  background: var(--panel);
  border: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 4px;
}

.kpi--accent { background: linear-gradient(150deg, var(--accent-soft), var(--panel)); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.kpi__top { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-dim); }
.kpi__top svg { color: var(--accent-2); }
.kpi__value { font-size: 24px; letter-spacing: -.03em; }
.kpi__hint { font-size: 12px; color: var(--text-mute); }

.stats-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; }
.stats-col { display: flex; flex-direction: column; gap: 16px; }

.chart { width: 100%; height: auto; display: block; padding: 8px 10px 4px; }
.chart__grid { stroke: var(--border); stroke-width: 1; stroke-dasharray: 3 5; }
.chart__axis { fill: var(--text-mute); font-size: 10.5px; font-family: var(--font); }
.chart__bar { fill: var(--accent); opacity: .85; }
.chart__bar--fresh { fill: var(--teal); }
.chart__bar--forecast { fill: var(--amber); opacity: .8; }
.chart__value { fill: var(--text-mute); font-size: 10px; font-family: var(--font); }
.chart__hit { fill: transparent; }
.chart__hit:hover { fill: var(--accent-soft); }

.legend { display: flex; gap: 14px; flex-wrap: wrap; }
.legend__item { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-dim); }
.legend__dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend__dot--bar { background: var(--accent); }
.legend__dot--fresh { background: var(--teal); }
.legend--heat { gap: 5px; align-items: center; }
.legend--heat .heat { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

.donut-wrap { display: flex; align-items: center; gap: 18px; padding: 16px 18px 22px; flex-wrap: wrap; }
.donut { width: 168px; height: 168px; flex: none; }
.donut__track { stroke: var(--panel-3); }
.donut__value { fill: var(--text); font-size: 26px; font-weight: 650; font-family: var(--font); }
.donut__label { fill: var(--text-mute); font-size: 11px; font-family: var(--font); }
.donut-legend { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 9px; flex: 1; min-width: 150px; }
.donut-legend__row { display: flex; align-items: center; gap: 9px; font-size: 13.5px; }
.donut-legend__label { flex: 1; color: var(--text-dim); }

.heat-wrap { overflow-x: auto; padding: 12px 18px 20px; }
.heatmap { display: block; }
.heat { fill: var(--panel-3); }
.heat--l0 { fill: var(--panel-3); }
.heat--l1 { fill: color-mix(in srgb, var(--accent) 28%, var(--panel-3)); }
.heat--l2 { fill: color-mix(in srgb, var(--accent) 50%, var(--panel-3)); }
.heat--l3 { fill: color-mix(in srgb, var(--accent) 74%, var(--panel-3)); }
.heat--l4 { fill: var(--accent); }

.table-wrap { overflow-x: auto; padding: 4px 6px 16px; }
.table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.table th { text-align: left; padding: 11px 12px; color: var(--text-mute); font-weight: 550; font-size: 12.5px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.table td { padding: 11px 12px; border-bottom: 1px solid var(--border-soft); white-space: nowrap; }
.table tr:hover td { background: var(--panel-2); }

.leech-list { display: flex; flex-direction: column; }
.leech { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-top: 1px solid var(--border-soft); }
.leech__main { flex: 1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.leech__trans { color: var(--text-dim); font-size: 14px; }

/* ---------- Настройки / данные ---------- */

.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 13px 0; border-top: 1px solid var(--border-soft); flex-wrap: wrap; }
.panel__body > .setting-row:first-child, .panel__body > :first-child { border-top: none; }
.setting-row__text { display: flex; flex-direction: column; gap: 2px; min-width: 180px; flex: 1; }
.setting-row__text b { font-size: 14.5px; font-weight: 550; }
.setting-row__control { flex: none; }
.setting-row__control--stack { display: flex; flex-direction: column; gap: 8px; min-width: 220px; }
.setting-row--switch { cursor: pointer; }

.storage { display: flex; flex-direction: column; gap: 10px; padding: 6px 0 12px; }
.storage__row { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--text-dim); }
.storage__stats { display: flex; gap: 10px; flex-wrap: wrap; }
.storage__chip { display: flex; align-items: baseline; gap: 5px; padding: 7px 12px; border-radius: 11px; background: var(--panel-2); border: 1px solid var(--border-soft); font-size: 12.5px; color: var(--text-mute); }
.storage__chip b { color: var(--text); font-size: 14px; }

.about { padding: 4px 2px; color: var(--text-dim); font-size: 13.5px; display: flex; flex-direction: column; gap: 8px; }

.export-list { display: flex; flex-direction: column; }
.export-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--border-soft); flex-wrap: wrap; }
.export-row__main { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 180px; }
.export-row__actions { display: flex; gap: 8px; }

.options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }

.format-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; padding: 4px 0 12px; }
.format-card { padding: 14px; border-radius: var(--radius-md); background: var(--panel-2); border: 1px solid var(--border-soft); display: flex; flex-direction: column; gap: 6px; }

.code {
  font-family: var(--mono);
  font-size: 11.5px;
  line-height: 1.5;
  color: var(--text-dim);
  background: var(--bg);
  border: 1px solid var(--border-soft);
  border-radius: 9px;
  padding: 9px 11px;
  margin: 0;
  overflow-x: auto;
  white-space: pre;
}
.code--wrap { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow-y: auto; }

/* Нумерованные шаги и подсказки: страница «Промпт для нейросети» */
.steps { margin: 0; padding-left: 20px; display: grid; gap: 7px; font-size: 13.5px; color: var(--text-dim); }
.steps li { line-height: 1.55; }
.steps b { color: var(--text); }
.tips { margin: 0; padding-left: 18px; display: grid; gap: 7px; font-size: 12.5px; color: var(--text-mute); }
.tips li { line-height: 1.5; }
.tips b { color: var(--text-dim); }
.steps code, .tips code, .modal__text code {
  font-family: var(--mono);
  font-size: 11.5px;
  padding: 1px 5px;
  border-radius: 5px;
  background: var(--panel-3);
  border: 1px solid var(--border-soft);
  color: var(--text-dim);

#ai-prompt { min-height: 220px; resize: vertical; }

.install-guide { display: flex; flex-direction: column; gap: 12px; color: var(--text-dim); font-size: 14px; }
.install-guide ol, .install-guide ul { display: flex; flex-direction: column; gap: 7px; }

   ============================================================ */

@media (max-width: 1100px) {
  .overview { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .action-bar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats-grid { grid-template-columns: 1fr; }
}

@media (max-width: 900px) {
  #app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
  .tabbar { display: flex; }

  .study { padding: 12px 12px calc(92px + env(safe-area-inset-bottom)); }
  .page-title { font-size: 22px; }
  .page-head__actions { width: 100%; }
  .page-head__actions .btn { flex: 1; }
  .search-wrap { flex: 1; min-width: 0; }
  .deck-grid { grid-template-columns: 1fr; }
  .ov-card__value { font-size: 23px; }
  .modal { max-width: 100%; }
  .modal--sheet { border-radius: 20px 20px 0 0; }
  .overlay { padding: 0; align-items: flex-end; }
  .modal--sheet { max-height: 92dvh; }
  .word-row { flex-wrap: wrap; gap: 10px; }
  .word-row__side { align-items: flex-start; flex-direction: row; width: 100%; gap: 8px; }
  .word-row__actions { margin-left: auto; }
  .qcard { padding: 20px 16px; border-radius: 18px; }
  .rating-row { gap: 7px; }
  .rate { padding: 11px 4px; border-radius: 12px; }
  .rate__label { font-size: 12.5px; }
  .rate__key { display: none; }
  .browse-toolbar .input { min-width: 0; flex: 1; }
  .install-bar { margin: 12px 14px 0; }
}

@media (max-width: 560px) {
  .install-bar { flex-wrap: wrap; gap: 10px; margin: 12px 14px 0; }
  .install-bar__text { order: 2; flex: 1 1 100%; }
  .install-bar .btn { order: 3; width: 100%; }
  .install-bar .icon-btn { order: 1; margin-left: auto; }
  .overview { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .ov-card { padding: 13px 14px; }
  .action-bar { grid-template-columns: 1fr; }
  .mode-grid { grid-template-columns: 1fr; }
  .result-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .kpi__value { font-size: 20px; }
  .page-head__actions { flex-direction: column; }
  .page-head__actions .btn { width: 100%; }
  .qcard__word-text { font-size: 27px; }
  .btn--lg { padding: 13px 18px; font-size: 15px; }
  .modal__foot .btn { flex: 1; }
  .donut-wrap { justify-content: center; }
  .tab { font-size: 10px; }
  .setting-row { flex-direction: column; align-items: flex-start; gap: 10px; }
  .setting-row__control { width: 100%; }
  .setting-row__control--stack { min-width: 0; }
}

@media (min-width: 901px) {
  .install-bar { margin-top: 20px; }
}

/* Печать */
@media print {
  .sidebar, .tabbar, .install-bar, #toasts { display: none !important; }
}

    learningSteps: [1, 10],    // шаги обучения, минуты
    relearningSteps: [10],     // шаги после забывания, минуты
    graduatingInterval: 1,     // дней: выход из обучения
    easyInterval: 4,           // дней: «Легко» на обучении
    startingEase: 2.5,         // стартовый ease-фактор
    easyBonus: 1.3,            // множитель для «Легко» на повторении
    hardInterval: 1.2,         // множитель для «Трудно» на повторении

    s.relearningSteps = cleanSteps(s.relearningSteps, [10]);
    s.graduatingInterval = clampNum(s.graduatingInterval, 1, 365, 1);
    s.easyInterval = clampNum(s.easyInterval, 1, 365, 4);
    s.startingEase = clampNum(s.startingEase, 1.3, 4, 2.5);
    s.easyBonus = clampNum(s.easyBonus, 1, 3, 1.3);
