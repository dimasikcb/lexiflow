/* ============================================================
   LexiFlow — store.js
   Слой данных: колоды, карточки, журнал повторений, настройки.
   Хранение — localStorage (работает и на file://, и в PWA),
   автосохранение с дебаунсом + принудительный flush.
   ============================================================ */
(function (global) {
  'use strict';
  var App = (global.App = global.App || {});
  var U = App.util, SRS = App.srs;

  var STORAGE_KEY = 'lexiflow.data.v1';
  var DATA_VERSION = 1;

  var DEFAULT_APP_SETTINGS = {
    theme: 'auto',            // auto | dark | light
    defaultMode: 'flip',      // режим тренировки по умолчанию
    defaultDir: 'fwd',        // fwd | rev | mixed
    sessionLimit: 40,         // карточек за сессию
    dailyGoal: 30,            // цель повторений в день
    ttsRate: 0.95,
    ttsPitch: 1,              // тон голоса
    ttsVolume: 1,             // громкость
    ttsVoice: {},             // закреплённые голоса: { en: voiceURI, de: … }
    /* Какие предупреждения об озвучке человек уже закрыл: { 'en:none': true }.
       Ключ включает уровень голоса, поэтому если голос появится или сменится
       на роботизированный, предупреждение покажется снова. */
    ttsNoticeSeen: {},
    ttsHighlight: true,       // подсвечивать произносимое слово
    ttsAutoPlay: true,
    /* Сетевая озвучка (js/ttsnet.js): MP3 со стороннего сервиса, скачанный
       в кэш браузера. Включена по умолчанию, потому что включается НЕ всегда,
       а только когда нормального голоса в системе нет: решение принимает
       ttsnet.available(lang) — он смотрит на качество системного голоса
       (none/poor → идём в сеть, normal/neural → читает система).
       Если человек не хочет отправлять фразы на чужой сервер, он выключает
       это в настройках, и тогда остаётся системный голос.
       downloaded — подсказка для интерфейса; правду о содержимом кэша
       даёт ttsnet.stats(), потому что кэш у каждого устройства свой. */
    ttsNet: {
      enabled: true,
      downloaded: 0
    },
    showTranscription: true,
    keyboardShortcuts: true,
    reduceMotion: false,
    /* Синхронизация. Токен здесь же, но в синхронизируемый файл он не попадает
       (см. syncPayload) — иначе первый же экспорт опубликовал бы ключ. */
    sync: {
      provider: 'off',        // off | gist
      token: '',              // GitHub fine-grained token, право только gist
      gistId: '',             // id секретного гиста
      auto: true,             // синхронизировать автоматически
      lastAt: 0,              // время последней удачной синхронизации
      lastError: ''
    },
    /* Напоминания */
    notify: {
      enabled: false,
      time: '19:00',          // во сколько напоминать
      onlyIfDue: true,        // только если есть карточки к повторению
      lastShown: ''           // YYYY-MM-DD последнего показа, чтобы не спамить
    }
  };

  /* Сколько надгробий храним. Старые удаления помнить вечно не нужно. */
  var TOMBSTONE_LIMIT = 2000;

  var state = null;
  var listeners = [];
  var saveTimer = null;
  var storageOk = true;

  /* ---------- Инициализация ---------- */

  /**
   * Копия настроек по умолчанию. Важно: вложенный объект голосов нужно
   * клонировать, иначе правки пользователя утекут в DEFAULT_APP_SETTINGS.
   */
  function freshSettings() {
    var out = Object.assign({}, DEFAULT_APP_SETTINGS);
    out.ttsVoice = Object.assign({}, DEFAULT_APP_SETTINGS.ttsVoice);
    out.ttsNoticeSeen = Object.assign({}, DEFAULT_APP_SETTINGS.ttsNoticeSeen);
    out.ttsNet = Object.assign({}, DEFAULT_APP_SETTINGS.ttsNet);
    out.sync = Object.assign({}, DEFAULT_APP_SETTINGS.sync);
    out.notify = Object.assign({}, DEFAULT_APP_SETTINGS.notify);
    return out;
  }

  function emptyData() {
    return {
      version: DATA_VERSION,
      decks: [],
      cards: [],
      logs: [],
      /* Удаления. Без них удалённая на телефоне карточка «воскресает»
         с компьютера при первом же слиянии. */
      tombstones: [],
      settingsUpdatedAt: 0,
      settings: freshSettings(),
      meta: { createdAt: Date.now(), lastOpen: Date.now(), seeded: false }
    };
  }

  function load() {
    var raw = null;
    try {
      raw = global.localStorage.getItem(STORAGE_KEY);
    } catch (e) {
      storageOk = false;
    }
    if (!raw) {
      state = emptyData();
      return state;
    }
    try {
      var parsed = JSON.parse(raw);
      state = migrate(parsed);
    } catch (e) {
      console.error('LexiFlow: повреждённые данные, создан новый набор', e);
      state = emptyData();
    }
    return state;
  }

  function migrate(data) {
    var base = emptyData();
    var out = Object.assign(base, data || {});
    out.version = DATA_VERSION;
    out.settings = Object.assign({}, DEFAULT_APP_SETTINGS, data && data.settings);
    out.settings.ttsVoice = Object.assign({}, out.settings.ttsVoice);
    out.settings.ttsNoticeSeen = Object.assign({}, out.settings.ttsNoticeSeen);
    out.settings.sync = Object.assign({}, DEFAULT_APP_SETTINGS.sync, data && data.settings && data.settings.sync);
    out.settings.notify = Object.assign({}, DEFAULT_APP_SETTINGS.notify, data && data.settings && data.settings.notify);
    /* Отдельным слиянием, а не общим Object.assign выше: у сетевой озвучки
       явное «выключено» пользователя должно пережить загрузку, и объект
       нужно клонировать, иначе правки утекут в DEFAULT_APP_SETTINGS. */
    out.settings.ttsNet = Object.assign({}, DEFAULT_APP_SETTINGS.ttsNet, data && data.settings && data.settings.ttsNet);
    out.settingsUpdatedAt = out.settingsUpdatedAt || 0;
    out.meta = Object.assign({}, base.meta, data && data.meta);
    out.decks = Array.isArray(out.decks) ? out.decks : [];
    out.cards = Array.isArray(out.cards) ? out.cards : [];
    out.logs = Array.isArray(out.logs) ? out.logs : [];
    out.tombstones = Array.isArray(out.tombstones) ? out.tombstones : [];
    // нормализация
    out.decks.forEach(function (d) {
      d.settings = SRS.sanitizeSettings(d.settings);
      if (!d.id) d.id = U.uid('d');
      if (!d.createdAt) d.createdAt = Date.now();
      if (!d.updatedAt) d.updatedAt = d.createdAt;
      if (!d.color) d.color = pickColor(out.decks.indexOf(d));
    });
    out.cards.forEach(function (c) {
      if (!c.id) c.id = U.uid('c');
      if (!c.createdAt) c.createdAt = Date.now();
      if (!c.updatedAt) c.updatedAt = c.createdAt;
      if (!Array.isArray(c.examples)) c.examples = [];
      if (!Array.isArray(c.tags)) c.tags = [];
      if (!c.srs) c.srs = SRS.newState(SRS.DEFAULT_SETTINGS, c.createdAt || Date.now());
    });
    out.tombstones = out.tombstones.filter(function (t) { return t && t.id && t.kind; });
    // журнал ограничиваем 20 000 последних записей, чтобы не разрастался
    if (out.logs.length > 20000) out.logs = out.logs.slice(-20000);
    return out;
  }

  function get() {
    if (!state) load();
    return state;
  }

  /* ---------- Сохранение ---------- */

  function save() {
    if (!state) return;
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 220);
  }

  function flush() {
    if (!state) return;
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    try {
      global.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      storageOk = true;
    } catch (e) {
      storageOk = false;
      if (!flush.warned) {
        flush.warned = true;
        U.toast('Не удалось сохранить данные (хранилище переполнено). Сделайте экспорт бэкапа.', 'err', 6000);
      }
      console.error('LexiFlow: ошибка сохранения', e);
    }
  }

  function isStorageOk() { return storageOk; }

  /** Уведомить подписчиков об изменении данных. */
  function notify(reason) {
    save();
    listeners.forEach(function (fn) {
      try { fn(reason); } catch (e) { console.error(e); }
    });
  }

  function subscribe(fn) {
    listeners.push(fn);
    return function () { listeners = listeners.filter(function (f) { return f !== fn; }); };
  }

  /* ---------- Надгробия удалений ---------- */

  /**
   * Запомнить удаление. Без этого при слиянии удалённая запись вернётся
   * с другого устройства: там она всё ещё существует и «новее» не станет.
   */
  function addTombstone(id, kind) {
    if (!id) return;
    var data = get();
    if (!Array.isArray(data.tombstones)) data.tombstones = [];
    // повторное удаление той же записи не должно копить дубликаты
    data.tombstones = data.tombstones.filter(function (t) { return !(t.id === id && t.kind === kind); });
    data.tombstones.push({ id: id, kind: kind, at: Date.now() });
    if (data.tombstones.length > TOMBSTONE_LIMIT) {
      data.tombstones = data.tombstones.slice(-TOMBSTONE_LIMIT);
    }
  }

  function tombstones() { return get().tombstones || []; }

  function clearTombstones() {
    var data = get();
    data.tombstones = [];
    notify('tombstones:clear');
  }

  /* ---------- Колоды ---------- */

  var COLORS = ['#7c5cff', '#2ec5b6', '#ff7a59', '#f0b429', '#3ea6ff', '#e94f8a', '#48c774', '#9b6bff'];

  function pickColor(i) { return COLORS[i % COLORS.length]; }

  function createDeck(input) {
    var data = get();
    var deck = {
      id: U.uid('d'),
      name: (input && input.name) || 'Новая колода',
      description: (input && input.description) || '',
      langFrom: (input && input.langFrom) || 'en',
      langTo: (input && input.langTo) || 'ru',
      color: (input && input.color) || pickColor(data.decks.length),
      icon: (input && input.icon) || '',
      createdAt: Date.now(),
      updatedAt: Date.now(),
      archived: false,
      settings: SRS.sanitizeSettings(input && input.settings)
    };
    data.decks.push(deck);
    notify('deck:create');
    return deck;
  }

  function updateDeck(id, patch) {
    var deck = getDeck(id);
    if (!deck) return null;
    Object.assign(deck, patch);
    if (patch && patch.settings) deck.settings = SRS.sanitizeSettings(patch.settings);
    deck.updatedAt = Date.now();
    notify('deck:update');
    return deck;
  }

  function getDeck(id) {
    return get().decks.find(function (d) { return d.id === id; }) || null;
  }

  function deleteDeck(id, deleteCards) {
    var data = get();
    data.decks = data.decks.filter(function (d) { return d.id !== id; });
    addTombstone(id, 'deck');
    if (deleteCards !== false) {
      var ids = {};
      data.cards.forEach(function (c) { if (c.deckId === id) ids[c.id] = true; });
      data.cards = data.cards.filter(function (c) { return c.deckId !== id; });
      data.logs = data.logs.filter(function (l) { return !ids[l.cardId]; });
      Object.keys(ids).forEach(function (cid) { addTombstone(cid, 'card'); });
    } else {
      data.cards.forEach(function (c) { if (c.deckId === id) { c.deckId = null; c.updatedAt = Date.now(); } });
    }
    notify('deck:delete');
  }

  function duplicateDeck(id) {
    var data = get();
    var src = getDeck(id);
    if (!src) return null;
    var copy = JSON.parse(JSON.stringify(src));
    copy.id = U.uid('d');
    copy.name = src.name + ' (копия)';
    copy.createdAt = copy.updatedAt = Date.now();
    data.decks.push(copy);
    cardsOf(id).forEach(function (c) {
      var cc = JSON.parse(JSON.stringify(c));
      cc.id = U.uid('c');
      cc.deckId = copy.id;
      cc.createdAt = cc.updatedAt = Date.now();
      cc.srs = SRS.newState(copy.settings, Date.now());
      data.cards.push(cc);
    });
    notify('deck:duplicate');
    return copy;
  }

  /* ---------- Карточки ---------- */

  function createCard(input) {
    var data = get();
    var deck = getDeck(input.deckId);
    var settings = deck ? deck.settings : SRS.DEFAULT_SETTINGS;
    var now = Date.now();
    var card = {
      id: U.uid('c'),
      deckId: input.deckId || null,
      word: (input.word || '').trim(),
      translation: (input.translation || '').trim(),
      transcription: (input.transcription || '').trim(),
      examples: (input.examples || []).filter(function (e) { return e && (e.text || e.translation); }),
      notes: (input.notes || '').trim(),
      tags: (input.tags || []).filter(Boolean),
      audioUrl: input.audioUrl || '',
      createdAt: now,
      updatedAt: now,
      suspended: false,
      srs: SRS.newState(settings, now)
    };
    data.cards.push(card);
    if (deck) deck.updatedAt = now;
    notify('card:create');
    return card;
  }

  function updateCard(id, patch) {
    var card = getCard(id);
    if (!card) return null;
    Object.assign(card, patch);
    card.updatedAt = Date.now();
    notify('card:update');
    return card;
  }

  function getCard(id) {
    return get().cards.find(function (c) { return c.id === id; }) || null;
  }

  function deleteCard(id) {
    var data = get();
    data.cards = data.cards.filter(function (c) { return c.id !== id; });
    data.logs = data.logs.filter(function (l) { return l.cardId !== id; });
    addTombstone(id, 'card');
    notify('card:delete');
  }

  function deleteCards(ids) {
    var set = {};
    ids.forEach(function (i) { set[i] = true; });
    var data = get();
    data.cards = data.cards.filter(function (c) { return !set[c.id]; });
    data.logs = data.logs.filter(function (l) { return !set[l.cardId]; });
    ids.forEach(function (i) { addTombstone(i, 'card'); });
    notify('card:delete-many');
  }

  function cardsOf(deckId) {
    return get().cards.filter(function (c) { return c.deckId === deckId; });
  }

  function allCards(deckIds) {
    if (!deckIds || !deckIds.length) return get().cards.slice();
    var set = {};
    deckIds.forEach(function (d) { set[d] = true; });
    return get().cards.filter(function (c) { return set[c.deckId]; });
  }

  /** Сброс прогресса карточки. */
  function resetCard(id) {
    var card = getCard(id);
    if (!card) return;
    var deck = getDeck(card.deckId);
    card.srs = SRS.newState(deck ? deck.settings : SRS.DEFAULT_SETTINGS, Date.now());
    card.updatedAt = Date.now();
    notify('card:reset');
  }

  function resetDeckProgress(deckId) {
    var deck = getDeck(deckId);
    if (!deck) return;
    var now = Date.now();
    cardsOf(deckId).forEach(function (c) { c.srs = SRS.newState(deck.settings, now); });
    get().logs = get().logs.filter(function (l) { return l.deckId !== deckId; });
    notify('deck:reset');
  }

  /* ---------- Журнал повторений ---------- */

  function addLog(entry) {
    var data = get();
    var log = Object.assign({
      id: U.uid('l'),
      ts: Date.now(),
      grade: 3,
      mode: 'flip',
      dir: 'fwd',
      correct: true,
      ms: 0,
      deckId: null,
      cardId: null,
      stateFrom: 'new',
      stateTo: 'learning',
      test: false
    }, entry);
    data.logs.push(log);
    return log;
  }

  function removeLog(id) {
    var data = get();
    data.logs = data.logs.filter(function (l) { return l.id !== id; });
  }

  function logsSince(ts) {
    return get().logs.filter(function (l) { return l.ts >= ts; });
  }

  /* ---------- Настройки приложения ---------- */

  function settings() { return get().settings; }

  function updateSettings(patch) {
    var data = get();
    Object.assign(data.settings, patch);
    data.settingsUpdatedAt = Date.now();
    notify('settings:update');
    return get().settings;
  }

  /* ---------- Статистика ---------- */

  function deckStats(deckId, now) {
    now = now || Date.now();
    var cards = deckId ? cardsOf(deckId) : get().cards;
    var st = { total: cards.length, new: 0, learning: 0, review: 0, suspended: 0, due: 0, leeches: 0 };
    var dayEnd = U.startOfDay(now) + U.MS_DAY;
    cards.forEach(function (c) {
      if (c.suspended) { st.suspended++; return; }
      if (SRS.isNew(c)) st.new++;
      else if (SRS.isLearning(c)) st.learning++;
      else st.review++;
      if (c.srs && c.srs.due < dayEnd) st.due++;
      if (c.srs && c.srs.leech) st.leeches++;
    });
    return st;
  }

  /** Сколько новых карточек уже введено сегодня (по журналу). */
  function newIntroducedToday(deckId, now) {
    var dayStart = U.startOfDay(now || Date.now());
    var count = 0;
    get().logs.forEach(function (l) {
      if (l.ts < dayStart) return;
      if (deckId && l.deckId !== deckId) return;
      if (l.stateFrom === 'new') count++;
    });
    return count;
  }

  function reviewsToday(deckId, now) {
    var dayStart = U.startOfDay(now || Date.now());
    var count = 0;
    get().logs.forEach(function (l) {
      if (l.ts < dayStart) return;
      if (deckId && l.deckId !== deckId) return;
      count++;
    });
    return count;
  }

  /** Серия дней подряд с хотя бы одним повторением. */
  function streak(now) {
    now = now || Date.now();
    var days = {};
    get().logs.forEach(function (l) { days[U.dayKey(l.ts)] = true; });
    var count = 0;
    var cursor = U.startOfDay(now);
    // если сегодня ещё не занимались — серию считаем со вчера
    if (!days[U.dayKey(cursor)]) cursor -= U.MS_DAY;
    while (days[U.dayKey(cursor)]) {
      count++;
      cursor -= U.MS_DAY;
    }
    return count;
  }

  /* ---------- Импорт / экспорт ---------- */

  /**
   * Полный бэкап. Секреты вырезаются: файл бэкапа люди пересылают друг другу
   * и кладут в облако, а токен синхронизации даёт доступ к хранилищу данных.
   */
  function exportAll() {
    var safe = Object.assign({}, get().settings);
    safe.sync = Object.assign({}, safe.sync, { token: '', gistId: '' });
    return JSON.stringify({
      app: 'LexiFlow',
      version: DATA_VERSION,
      exportedAt: new Date().toISOString(),
      decks: get().decks,
      cards: get().cards,
      logs: get().logs,
      tombstones: get().tombstones || [],
      settings: safe
    }, null, 2);
  }

  function exportDeck(deckId, withProgress) {
    var deck = getDeck(deckId);
    if (!deck) return '{}';
    var cards = cardsOf(deckId).map(function (c) {
      var copy = JSON.parse(JSON.stringify(c));
      if (!withProgress) copy.srs = null;
      return copy;
    });
    return JSON.stringify({
      app: 'LexiFlow',
      version: DATA_VERSION,
      exportedAt: new Date().toISOString(),
      decks: [deck],
      cards: cards
    }, null, 2);
  }

  function csvEscape(v) {
    var s = String(v === null || v === undefined ? '' : v);
    if (/[",\n\r;]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function exportCsv(deckIds) {
    return csvForCards(allCards(deckIds));
  }

  /** CSV по произвольному набору карточек (используется и в словаре). */
  function csvForCards(cards) {
    // Если у карточек больше одного примера — добавляем парные колонки
    // «Пример 2 / Перевод примера 2» и т. д., чтобы ничего не потерялось.
    var maxExamples = 1;
    cards.forEach(function (c) {
      var n = (c.examples || []).length;
      if (n > maxExamples) maxExamples = n;
    });

    var head = ['Колода', 'Слово', 'Перевод', 'Транскрипция'];
    for (var e = 1; e <= maxExamples; e++) {
      head.push(e === 1 ? 'Пример' : 'Пример ' + e);
      head.push(e === 1 ? 'Перевод примера' : 'Перевод примера ' + e);
    }
    head = head.concat(['Теги', 'Состояние', 'Интервал (дн)', 'Следующее повторение']);

    var rows = [head];
    cards.forEach(function (c) {
      var deck = getDeck(c.deckId);
      var exs = c.examples || [];
      var row = [deck ? deck.name : '', c.word, c.translation, c.transcription];
      for (var i = 0; i < maxExamples; i++) {
        var ex = exs[i] || {};
        row.push(ex.text || '', ex.translation || '');
      }
      row.push(
        (c.tags || []).join(' '),
        SRS.stateLabel(c),
        c.srs ? (c.srs.state === 'review' ? c.srs.interval : '') : '',
        c.srs ? new Date(c.srs.due).toISOString().slice(0, 10) : ''
      );
      rows.push(row);
    });
    return '\uFEFF' + rows.map(function (r) { return r.map(csvEscape).join(','); }).join('\r\n');
  }

  /** Разбор CSV с поддержкой кавычек и разделителей , ; \t */
  function parseDelimited(text) {
    text = text.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
    var firstLine = text.split('\n')[0] || '';
    var counts = [
      { sep: ',', n: (firstLine.match(/,/g) || []).length },
      { sep: ';', n: (firstLine.match(/;/g) || []).length },
      { sep: '\t', n: (firstLine.match(/\t/g) || []).length }
    ].sort(function (a, b) { return b.n - a.n; });
    var sep = counts[0].n > 0 ? counts[0].sep : ',';

    var rows = [], row = [], field = '', inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (inQuotes) {
        if (ch === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else inQuotes = false;
        } else field += ch;
      } else if (ch === '"') {
        inQuotes = true;
      } else if (ch === sep) {
        row.push(field); field = '';
      } else if (ch === '\n') {
        row.push(field); field = '';
        if (row.some(function (f) { return f.trim() !== ''; })) rows.push(row);
        row = [];
      } else field += ch;
    }
    row.push(field);
    if (row.some(function (f) { return f.trim() !== ''; })) rows.push(row);
    return rows;
  }

  /**
   * Универсальный импорт.
   * @param {string} text — содержимое файла
   * @param {object} opts — {deckId, newDeckName, format:'auto'|'json'|'csv'|'lines', skipHeader, dedupe}
   * @returns {{added:number, skipped:number, decks:number}}
   */
  function importText(text, opts) {
    opts = opts || {};
    var trimmed = String(text || '').trim();
    if (!trimmed) return { added: 0, skipped: 0, decks: 0, error: 'Пустой файл' };

    // формат по умолчанию — автоопределение (JSON начинается с { или [)
    var format = opts.format || 'auto';
    var looksJson = trimmed[0] === '{' || trimmed[0] === '[';

    if (format === 'json' || (format === 'auto' && looksJson)) {
      var payload;
      try { payload = JSON.parse(trimmed); }
      catch (e) { return { added: 0, skipped: 0, decks: 0, error: 'Некорректный JSON' }; }
      return importJson(payload, opts);
    }
    return importTabular(trimmed, opts);
  }

  function importJson(payload, opts) {
    var data = get();
    var result = { added: 0, skipped: 0, decks: 0 };
    var isBareList = Array.isArray(payload);
    var decksIn = isBareList ? [] : (payload.decks || []);
    var cardsIn = isBareList ? payload : (payload.cards || []);
    var now = Date.now();

    var fixedDeckId = opts.deckId || null;
    var specById = {};
    decksIn.forEach(function (d) { if (d && d.id) specById[d.id] = d; });

    // Колоды создаются лениво: если все карточки окажутся дубликатами,
    // пустые колоды в базе не появятся.
    var createdByKey = {};

    function ensureDeck(spec) {
      var key = spec && spec.id ? 'id:' + spec.id : 'default';
      if (createdByKey[key]) return createdByKey[key];
      var deck = {
        id: U.uid('d'),
        name: (spec && spec.name) || opts.newDeckName || 'Импортированная колода',
        description: (spec && spec.description) || '',
        langFrom: (spec && spec.langFrom) || 'en',
        langTo: (spec && spec.langTo) || 'ru',
        color: (spec && spec.color) || pickColor(data.decks.length),
        createdAt: now, updatedAt: now, archived: false,
        settings: SRS.sanitizeSettings(spec && spec.settings)
      };
      data.decks.push(deck);
      createdByKey[key] = deck.id;
      result.decks++;
      return deck.id;
    }

    var existing = {};
    if (opts.dedupe !== false) {
      data.cards.forEach(function (c) {
        existing[U.normalize(c.word) + '|' + U.normalize(c.translation)] = true;
      });
    }

    cardsIn.forEach(function (c) {
      if (!c || (!c.word && !c.translation)) { result.skipped++; return; }
      var key = U.normalize(c.word) + '|' + U.normalize(c.translation);
      if (existing[key]) { result.skipped++; return; }

      var deckId = fixedDeckId || ensureDeck(specById[c.deckId] || null);
      var deck = getDeck(deckId);
      data.cards.push({
        id: U.uid('c'),
        deckId: deckId,
        word: String(c.word || '').trim(),
        translation: String(c.translation || '').trim(),
        transcription: String(c.transcription || '').trim(),
        examples: Array.isArray(c.examples) ? c.examples.filter(function (e) { return e && (e.text || e.translation); }) : [],
        notes: c.notes || '',
        tags: Array.isArray(c.tags) ? c.tags : String(c.tags || '').split(/[\s,]+/).filter(Boolean),
        audioUrl: c.audioUrl || '',
        createdAt: c.createdAt || now,
        updatedAt: now,
        suspended: !!c.suspended,
        srs: (c.srs && c.srs.state) ? c.srs : SRS.newState(deck ? deck.settings : SRS.DEFAULT_SETTINGS, now)
      });
      existing[key] = true;
      result.added++;
    });

    // файл без карточек, но с колодами — сохраняем структуру
    if (!cardsIn.length && !fixedDeckId) {
      decksIn.forEach(function (d) { ensureDeck(d); });
    }

    notify('import');
    return result;
  }

  function createDeckSilent(data, name) {
    var deck = {
      id: U.uid('d'),
      name: name,
      description: '',
      langFrom: 'en', langTo: 'ru',
      color: pickColor(data.decks.length),
      createdAt: Date.now(), updatedAt: Date.now(), archived: false,
      settings: SRS.sanitizeSettings(null)
    };
    data.decks.push(deck);
    return deck;
  }

  /**
   * Импорт CSV / TSV / строк «слово - перевод».
   * Если в файле есть колонка «Колода», строки раскладываются по своим колодам
   * (существующие находятся по имени, отсутствующие создаются).
   */
  function importTabular(text, opts) {
    var data = get();
    var lines = text.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
    var result = { added: 0, skipped: 0, decks: 0 };
    if (!lines.length) return result;

    var rows = parseDelimited(lines.join('\n'));
    var headerMap = null;
    if (opts.skipHeader !== false) headerMap = detectHeader(rows[0]);
    if (headerMap) rows = rows.slice(1);

    var existing = {};
    if (opts.dedupe !== false) {
      data.cards.forEach(function (c) {
        existing[U.normalize(c.word) + '|' + U.normalize(c.translation)] = true;
      });
    }

    var fixedDeckId = opts.deckId || null;
    var fallbackDeckId = null;
    var deckByName = {};

    /** Колода для строки: явная, из колонки «Колода» или общая по умолчанию. */
    function deckFor(rec) {
      if (fixedDeckId) return fixedDeckId;
      var name = (rec && rec.deck ? rec.deck : '').trim();
      if (name) {
        if (!deckByName[name]) {
          var found = data.decks.filter(function (d) { return d.name === name; })[0];
          if (found) {
            deckByName[name] = found.id;
          } else {
            var created = createDeckSilent(data, name);
            deckByName[name] = created.id;
            result.decks++;
          }
        }
        return deckByName[name];
      }
      if (!fallbackDeckId) {
        fallbackDeckId = createDeckSilent(data, opts.newDeckName || guessDeckName(lines[0])).id;
        result.decks++;
      }
      return fallbackDeckId;
    }

    rows.forEach(function (cells) {
      var rec = recordFromRow(cells, headerMap, opts);
      if (!rec || (!rec.word && !rec.translation)) { result.skipped++; return; }
      var key = U.normalize(rec.word) + '|' + U.normalize(rec.translation);
      if (existing[key]) { result.skipped++; return; }
      var deckId = deckFor(rec);
      var targetDeck = getDeck(deckId);
      data.cards.push({
        id: U.uid('c'),
        deckId: deckId,
        word: rec.word,
        translation: rec.translation,
        transcription: rec.transcription || '',
        examples: (rec.examples || []).filter(function (e) { return e && (e.text || e.translation); }),
        notes: '', tags: rec.tags || [],
        audioUrl: '', createdAt: Date.now(), updatedAt: Date.now(), suspended: false,
        srs: SRS.newState(targetDeck ? targetDeck.settings : SRS.DEFAULT_SETTINGS, Date.now())
      });
      existing[key] = true;
      result.added++;
    });

    notify('import');
    return result;
  }

  /**
   * Заголовок таблицы.
   * Понимает несколько примеров: «Пример», «Пример 2», «Пример 3»… и парные
   * «Перевод примера», «Перевод примера 2»… (то же по-английски: Example 2,
   * Example translation 2). Плюс общий столбец «Примеры», внутри которого
   * примеры разделяются `||` или переводом строки.
   */
  function detectHeader(cells) {
    if (!cells) return null;
    var joined = cells.map(function (c) { return U.normalize(c); }).join('|');
    var hasWord = /(^|\|)(word|слово|термин|term|front|лицо)(\||$)/.test(joined);
    var hasTrans = /(^|\|)(translation|перевод|meaning|значение|back|definition)(\||$)/.test(joined);
    if (!hasWord && !hasTrans) return null;
    var map = {};
    var byNum = {};
    cells.forEach(function (c, i) {
      var k = U.normalize(c);
      var m;
      if (/^(word|слово|термин|term|front)$/.test(k)) map.word = i;
      else if (/^(translation|перевод|meaning|значение|back|definition)$/.test(k)) map.translation = i;
      else if (/^(transcription|транскрипция|ipa|phonetic)$/.test(k)) map.transcription = i;
      else if (/^(tags?|теги)$/.test(k)) map.tags = i;
      else if (/^(deck|колода)$/.test(k)) map.deck = i;
      else if ((m = k.match(/^(?:examples?|примеры?|sentences?|предложения?)\s*(\d*)$/))) {
        var n = m[1] ? parseInt(m[1], 10) : 1;
        byNum[n] = byNum[n] || {};
        byNum[n].text = i;
      } else if ((m = k.match(/^(?:(?:example|пример|sentence|предложение)\s+translation|перевод\s+примера)\s*(\d*)$/))) {
        var n2 = m[1] ? parseInt(m[1], 10) : 1;
        byNum[n2] = byNum[n2] || {};
        byNum[n2].translation = i;
      }
    });
    map.examplePairs = Object.keys(byNum)
      .map(function (k) { return parseInt(k, 10); })
      .sort(function (a, b) { return a - b; })
      .map(function (k) { return byNum[k]; });
    if (map.examplePairs.length) {
      map.example = map.examplePairs[0].text;
      map.exampleTranslation = map.examplePairs[0].translation;
    }
    return map;
  }

  /** Разбить ячейку на несколько значений: через `||` или перевод строки. */
  function splitCellList(value) {
    return String(value === undefined || value === null ? '' : value)
      .split(/\|\||\r?\n/)
      .map(function (s) { return s.trim(); })
      .filter(Boolean);
  }

  /** Собрать примеры употребления из строки таблицы. */
  function collectExamples(cells, headerMap) {
    var pairs = (headerMap && headerMap.examplePairs) || [];
    var out = [];
    pairs.forEach(function (pair) {
      if (pair.text === undefined) return;
      var texts = splitCellList(cells[pair.text]);
      var trans = pair.translation === undefined ? [] : splitCellList(cells[pair.translation]);
      var n = Math.max(texts.length, trans.length);
      for (var i = 0; i < n; i++) {
        var text = texts[i] || '';
        var tr = trans[i] || (trans.length === 1 && i === 0 ? trans[0] : '');
        if (text || tr) out.push({ text: text, translation: tr });
      }
    });
    return out;
  }

  function recordFromRow(cells, headerMap, opts) {
    var get2 = function (i) { return i === undefined || i === null ? '' : String(cells[i] === undefined ? '' : cells[i]).trim(); };
    if (headerMap) {
      return {
        word: get2(headerMap.word !== undefined ? headerMap.word : 0),
        translation: get2(headerMap.translation !== undefined ? headerMap.translation : 1),
        transcription: get2(headerMap.transcription),
        examples: collectExamples(cells, headerMap),
        deck: get2(headerMap.deck),
        tags: get2(headerMap.tags).split(/[\s,]+/).filter(Boolean)
      };
    }
    if (cells.length >= 2) {
      var a = String(cells[0] || '').trim();
      var b = String(cells[1] || '').trim();
      if (!a && !b) return null;
      return {
        word: opts.reverse ? b : a,
        translation: opts.reverse ? a : b,
        transcription: String(cells[2] || '').trim(),
        // без заголовков примеры читаем из 4-й и 5-й колонок (как в экспорте)
        examples: (cells[3] || cells[4])
          ? collectExamples(cells, { examplePairs: [{ text: 3, translation: 4 }] })
          : []
      };
    }
    // одна колонка: «слово - перевод» / «слово = перевод» / «слово : перевод»
    var line = String(cells[0] || '');
    var m = line.match(/^(.+?)\s*(?:[-–—=:]|\t)\s*(.+)$/);
    if (m) {
      var left = m[1].trim(), right = m[2].trim();
      return { word: opts.reverse ? right : left, translation: opts.reverse ? left : right };
    }
    return { word: line.trim(), translation: '' };
  }

  function guessDeckName(firstLine) {
    return 'Импорт ' + new Date().toLocaleDateString('ru-RU');
  }

  /** Полная замена данных (используется при восстановлении бэкапа). */
  function replaceAll(payload, mode) {
    var incoming = migrate(payload);
    if (mode === 'replace') {
      state = incoming;
    } else {
      var data = get();
      var map = {};
      incoming.decks.forEach(function (d) {
        var copy = JSON.parse(JSON.stringify(d));
        copy.id = U.uid('d');
        map[d.id] = copy.id;
        data.decks.push(copy);
      });
      incoming.cards.forEach(function (c) {
        var copy = JSON.parse(JSON.stringify(c));
        copy.id = U.uid('c');
        copy.deckId = map[c.deckId] || c.deckId;
        data.cards.push(copy);
      });
      incoming.logs.forEach(function (l) {
        var copy = JSON.parse(JSON.stringify(l));
        copy.id = U.uid('l');
        copy.cardId = map[c.id] || copy.cardId;
        data.logs.push(copy);
      });
    }
    notify('restore');
    return state;
  }

  function wipe() {
    state = emptyData();
    notify('wipe');
  }

  /**
   * Удалить все учебные данные, но оставить настройки устройства.
   *
   * Так делает кнопка «Удалить все данные» на экране «Данные». Отличается от
   * wipe() двумя вещами, и обе обязательны:
   *
   * 1. На каждую запись ставится надгробие. Без него облако не узнаёт об
   *    удалении и возвращает всё обратно при первом же обмене — человек видит,
   *    что удалённые колоды «сами вернулись».
   * 2. Настройки (в том числе токен синхронизации) остаются на месте. Если
   *    стереть и их, отправлять надгробия будет некуда, и получится то же
   *    самое: данные вернутся, как только синхронизацию включат заново.
   */
  function clearData() {
    var data = get();
    var at = Date.now();

    var tombs = (data.tombstones || []).slice();
    data.decks.forEach(function (d) { tombs.push({ id: d.id, kind: 'deck', at: at }); });
    data.cards.forEach(function (c) { tombs.push({ id: c.id, kind: 'card', at: at }); });

    var next = emptyData();
    next.tombstones = tombs.slice(-TOMBSTONE_LIMIT);
    next.settings = Object.assign({}, data.settings);
    next.settingsUpdatedAt = data.settingsUpdatedAt;
    /* seeded оставляем поднятым: иначе после очистки снова приехали бы
       демонстрационные колоды, которые человек только что удалил. */
    next.meta = Object.assign({}, data.meta, { seeded: true });
    state = next;
    notify('wipe');
    return state;
  }

  /* ---------- Обмен данными для синхронизации ---------- */

  /**
   * Копия данных для отправки в облако. Токен и прочие секреты вырезаются:
   * иначе первый же синхронизированный файл опубликовал бы ключ доступа,
   * а его видит любое устройство, подключённое к тому же хранилищу.
   */
  function syncPayload() {
    var data = get();
    var copy = {
      version: data.version,
      decks: data.decks,
      cards: data.cards,
      logs: data.logs,
      tombstones: data.tombstones || [],
      settingsUpdatedAt: data.settingsUpdatedAt || 0,
      settings: Object.assign({}, data.settings),
      meta: data.meta,
      updatedAt: Date.now(),
      device: deviceId()
    };
    copy.settings.sync = { provider: 'off', token: '', gistId: '', auto: false, lastAt: 0, lastError: '' };
    delete copy.settings.sync;
    return copy;
  }

  /**
   * Принять результат слияния. Локальные секреты (токен, id гиста)
   * сохраняются: они не часть общих данных, а ключ от хранилища.
   */
  function applyMerged(merged) {
    var data = get();
    var keepSync = Object.assign({}, data.settings.sync);
    var keepNotify = Object.assign({}, data.settings.notify);
    var next = migrate(Object.assign({}, merged));
    // Токен и напоминания — локальные для устройства. Из облака их не берём:
    // токен вообще не уезжает наружу, а «последний показ» у каждого свой.
    next.settings.sync = keepSync;
    next.settings.notify = keepNotify;
    state = next;
    notify('sync:apply');
    return state;
  }

  /* Идентификатор устройства: по нему видно, чьи правки победили. */
  var DEVICE_KEY = 'lexiflow.device.v1';
  function deviceId() {
    var id = null;
    try { id = global.localStorage.getItem(DEVICE_KEY); } catch (e) { id = null; }
    if (!id) {
      id = U.uid('dev');
      try { global.localStorage.setItem(DEVICE_KEY, id); } catch (e) { /* приватный режим */ }
    }
    return id;
  }

   * Chrome и Edge ставят длинную фразу на паузу примерно через 15 секунд.

   */
  function startWatchdog() {
    clearWatchdog();
    watchdog = setInterval(function () {
      var syn = global.speechSynthesis;
      var alive = false;
      try { alive = syn.speaking; } catch (e) { alive = false; }

   * повтора, предпросмотр в редакторе. Пока каждое из этих мест звало
   * speak() напрямую, человек слышал системного робота там, где по кнопке
   * уже звучал нормальный файл — и считал озвучку недоделанной.

      speak(text, lang, opts);

   * попытка «занята»: если файла нет и скачать не удалось, кнопка сама
   * упадёт обратно на системный голос.
   *
   * Порядок именно такой: сеть — надстройка над Web Speech, а не замена.
   * Офлайн, выключенная настройка и недоступный сервис одинаково приводят
   * к системному голосу, а не к тишине.
   *
   * Подсветки слов здесь нет намеренно: у MP3 нет события onboundary,
   * и синхронизировать текст со звуком нечем. Подсветка «по расчёту»
   * разъезжалась бы со звуком — это хуже, чем её отсутствие.
   */
  function tryNetworkAudio(btn, text, lang, opts) {
    var T = App.ttsnet;
    if (!T || typeof T.play !== 'function' || typeof T.available !== 'function') return false;
    // Язык обязателен: при нормальном системном голосе сеть не нужна вовсе.
    if (!T.available(lang)) return false;

    T.play(text, lang, { button: btn, onend: clearPlaying }).then(function (ok) {
      if (ok) return;
      // не получилось — за это время могли нажать другую кнопку
      if (playingBtn !== btn) return;
      speakWithVoice(text, lang, opts);
    });
    return true;
  }

  /**
   * Кнопка «Прослушать».
   * @param {string} text
   * @param {string} lang
   * @param {object} opts — {small, rate, target, slow}
   *   target — элемент, слова которого подсвечиваются во время чтения
   */

    opts = opts || {};
    var U = App.util;
    if (!supported()) return null;

    var btn = U.h('button', {
      class: 'icon-btn icon-btn--round' + (opts.small ? ' icon-btn--sm' : ''),
      type: 'button',
      title: 'Прослушать',
      'aria-label': 'Прослушать',
      onclick: function (e) {
        e.stopPropagation();
        e.preventDefault();

        if (playingBtn === btn) { stop(); clearPlaying(); return; }
        stop();
        clearPlaying();
        playingBtn = btn;
        btn.classList.add('is-playing');
        if (tryNetworkAudio(btn, text, lang, opts)) return;
        speakWithVoice(text, lang, opts);
      }

    return btn;
  }

  App.speech = {
    LANGS: LANGS,
    LANG_NAMES: LANG_NAMES,
    supported: supported,
    toBcp47: toBcp47,
    baseLang: baseLang,
    hasVoiceFor: hasVoiceFor,
    voices: refreshVoices,
    voicesFor: voicesFor,
    resolveVoice: resolveVoice,
    scoreVoice: scoreVoice,
    voiceQuality: voiceQuality,
    worstQuality: worstQuality,
    voiceAdvice: voiceAdvice,
    langName: langName,
    browserName: browserName,
    cleanText: cleanText,
    normalizeForSpeech: normalizeForSpeech,
    chunkText: chunkText,
    speak: speak,
    speakBest: speakBest,
    stop: stop,
    isSpeaking: isSpeaking,
    audioButton: audioButton

/* ============================================================
   LexiFlow — ttsnet.js
   Сетевая озвучка: скачивание MP3 со стороннего бесплатного сервиса
   и хранение файлов в Cache API, чтобы после загрузки речь работала
   без интернета.

   Почему отдельный модуль, а не правка speech.js: у сети и кэша своя
   ответственность, а speech.js должен оставаться проверяемым без сети
   (его тесты запускаются в Node, где ни fetch, ни caches нет).

   Как это работает:
   1. providerUrl() собирает адрес запроса, cacheKey() — ключ в кэше.
   2. getAudio() сначала ищет готовый файл в кэше, потом идёт в сеть
      и кладёт результат в кэш. Второй раз та же фраза читается офлайн.
   3. play() играет файл через <audio>. Пофразовой подсветки слов при
      этом НЕТ — у MP3 нет события onboundary, и подделать его нечем.
      Поэтому текст карточки не разбивается на .tts-word и не подсве-
      чивается целиком: подсветка шла бы «на глазок» и расходилась бы
      со звуком. Пока файл играет, кнопка 🔊 просто помечена как играющая.

   Честные ограничения (проверено на этой машине 2026-09-21):
   • Сервис отвечает только на запросы с браузерным User-Agent.
     Из curl без -A приходит 403 {"error":{"code":"API_KEY_REQUIRED"}}.
     Из страницы UA всегда браузерный, поэтому это не мешает.
   • Параметр voice= не работает: Russian Female и Russian Male дают
     БАЙТОВО ОДИНАКОВЫЙ файл (8064 байта, md5 7b3137345aff76e83bd06ec9b3914382).
     Поэтому выбора голоса в интерфейсе нет — только язык.
   • Сервис бесплатный и может отказать или измениться. Любая неудача
     возвращает null, и вызывающий код падает обратно на Web Speech.
   ============================================================ */
(function (global) {
  'use strict';
  var App = (global.App = global.App || {});

  /* Единственный известный адрес, который отдаёт MP3 с CORS-заголовком
     access-control-allow-origin: * — без него байты из страницы не прочитать
     и в кэш не положить (у translate.google.com CORS нет). */
  var ENDPOINT = 'https://code.responsivevoice.org/getvoice.php';

  /* Имя кэша отдельное от служебного кэша service worker (lexiflow-v1.x.x):
     обновление приложения не должно сносить скачанную озвучку, а очистка
     озвучки — ломать офлайн-оболочку. */

     чтобы ключ никогда не совпал с реальным запросом приложения. */
  var KEY_PREFIX = 'https://lexiflow.local/audio/';

  var MIN_AUDIO_BYTES = 1024;

    if (!s) return 'en';

   * проверяют тесты — в первую очередь кодирование кириллицы и знаков.
   * encodeURIComponent, а не escape/encodeURI: только он одинаково
   * безопасно кодирует и «#», и «&», и «+», и кириллицу.

  function providerUrl(text, lang) {

   * один ключ, поэтому повторная загрузка не нужна.
   *
   * РЕГИСТР НЕ НОРМАЛИЗУЕТСЯ — и это важно. В кэше лежат байты озвучки
   * конкретной строки: «US» и «us» сервис прочитает по-разному, «I» и «i»
   * тоже. Если свести регистр, ключ «Hello» вернул бы файл со словом
   * «hello» — то есть приложение отдало бы не то, что просили.
   * А вот пробелы нормализуются, потому что нормализованный текст уходит
   * и в providerUrl: ключ и содержимое всегда описывают одну строку.
   *
   * Язык в ключе обязателен: одно и то же слово в разных языках — разные файлы.
   */
  function cacheKey(text, lang) {
    return KEY_PREFIX + encodeURIComponent(normLang(lang)) + '/' + encodeURIComponent(normText(text));
  }

  /**
   * Похож ли ответ на звук. Отсекает ошибки сервера, отданные как текст
   * или как пустой ответ: 200 с телом {"error":…} в кэш попасть не должен,
   * иначе приложение навсегда сохранит «тишину» и будет считать, что
   * фраза скачана.
   *
   * Чистая функция — проверяется тестами без сети.
   */
  function looksLikeAudio(contentType, size) {
    var n = Number(size) || 0;
    if (n < MIN_AUDIO_BYTES) return false;
    var ct = String(contentType === null || contentType === undefined ? '' : contentType)
      .toLowerCase().trim();
    if (BAD_TYPES.test(ct)) return false;
    if (ct.indexOf('audio/') === 0) return true;
    /* Пустой или незнакомый тип: тип ничего не сказал, но ошибку мы уже
       отсеяли выше, а размер приличный. Так проходит application/octet-stream,
       которым часть серверов отдаёт mp3. */
    return ct === '' || ct === 'application/octet-stream' || ct === 'binary/octet-stream';
  }

  /* ---------- Окружение ---------- */

  function supported() {
    return typeof global.caches !== 'undefined' && typeof global.fetch === 'function';
  }

  function online() {
    try {
      return !(global.navigator && global.navigator.onLine === false);
    } catch (e) { return true; }
  }

  /**
   * Разрешена ли сетевая озвучка в настройках. По умолчанию разрешена —
   * запрет должен быть явным (`enabled: false`), иначе обновление
   * приложения молча вернуло бы пользователя к роботизированному голосу.
   */
  function enabled() {
    try {
      var st = App.store && App.store.settings ? App.store.settings() : null;
      if (!st || !st.ttsNet) return true;
      return st.ttsNet.enabled !== false;
    } catch (e) { return true; }
  }

  /**
   * Нужен ли для этого языка сетевой голос. Решает качество системного:
   * «нет голоса» и «робот» — повод идти в сеть, а обычный или
   * нейросетевой системный голос лучше не трогать вовсе.
   *
   * Здесь же живёт главная экономия: при хорошем системном голосе мы
   * не отправляем текст фраз на чужой сервер ни разу.
   */
  function needsNetwork(lang) {
    var SP = App.speech;
    if (!SP || typeof SP.voiceQuality !== 'function') return false;
    try {
      var v = typeof SP.resolveVoice === 'function' ? SP.resolveVoice(lang) : null;
      var q = SP.voiceQuality(v, lang);
      return q.level === 'none' || q.level === 'poor';
    } catch (e) { return false; }
  }

  function setDownloaded(bytes) {
    try {
      if (!App.store || !App.store.settings) return;
      var cur = App.store.settings().ttsNet || {};
      if (cur.downloaded === bytes) return;
      App.store.updateSettings({ ttsNet: { enabled: !!cur.enabled, downloaded: bytes } });
    } catch (e) { /* настройки недоступны — не повод ломать загрузку */ }
  }

  /**
   * Стоит ли озвучивать файлом, а не синтезом речи.
   *
   * Три условия, и все разные:
   *   1. браузер умеет Cache и fetch;
   *   2. системный голос для этого языка плохой или его нет — при хорошем
   *      голосе файлы не нужны вовсе;
   *   3. озвучку из интернета разрешили ИЛИ в приложении есть свой пакет
   *      файлов. Пакет — это локальные файлы, они не уходят на сервер,
   *      поэтому работают и при выключенном режиме, и без интернета.
   *
   * Офлайн здесь не проверяется намеренно: без сети файлы из пакета и
   * из кэша всё равно годятся, а неудачная попытка скачать просто
   * вернёт null, и вызывающий уйдёт на системный голос.
   */
  function available(lang) {
    if (!supported()) return false;
    if (lang && !needsNetwork(lang)) return false;
    if (enabled()) return true;
    return hasPack();
  }

  /**
   * Озвучим ли этот язык файлом на самом деле — с учётом офлайна.
   *
   * available() отвечает «стоит ли пытаться», а здесь нужен ответ «получится
   * ли»: без интернета и без своих файлов скачивать нечего, и приложение
   * уйдёт на системный голос. Этим пользуется подсказка перед тренировкой,
   * чтобы не обещать качественную озвучку, которой не будет.
   *
   * Оговорка честная: hasPack() говорит лишь, что пакет есть, а не что в нём
   * лежит именно эта фраза. Для свежесобранного пакета это одно и то же.
   */
  function willUseFiles(lang) {
    if (!available(lang)) return false;
    if (online()) return true;
    return hasPack();
  }

  /* ---------- Кэш ---------- */

  function openCache() {
    return global.caches.open(CACHE_NAME);
  }

  /** Файл из кэша или null. Ошибки хранилища не должны ломать озвучку. */
  function cacheGet(text, lang) {
    if (!supported()) return Promise.resolve(null);
    return openCache().then(function (cache) {
      return cache.match(cacheKey(text, lang));
    }).then(function (res) {
      if (!res) return null;
      return res.blob().then(function (blob) {
        return blob && blob.size > 0 ? blob : null;
      });
    }).catch(function () { return null; });
  }

  function cachePut(text, lang, blob) {
    if (!supported() || !blob) return Promise.resolve(false);
    return openCache().then(function (cache) {
      var key = new global.Request(cacheKey(text, lang));
      var res = new global.Response(blob, { headers: { 'Content-Type': 'audio/mpeg' } });
      return cache.put(key, res).then(function () { return true; });
    }).catch(function () { return false; });
  }

  /* ---------- Сеть ---------- */

  /**
   * Скачать озвучку одной фразы.
   * Промис НИКОГДА не отклоняется: любая неудача — это null, и вызывающий
   * код спокойно возвращается к системному голосу.
   */
  function fetchAudio(text, lang) {
    if (!supported()) return Promise.resolve(null);
    var t = normText(text);
    if (!t) return Promise.resolve(null);
    if (!online()) return Promise.resolve(null);

    return global.fetch(providerUrl(t, lang), {
      mode: 'cors',
      credentials: 'omit',
      cache: 'no-store'
    }).then(function (res) {
      if (!res || !res.ok) return null;
      var ct = (res.headers && res.headers.get) ? res.headers.get('content-type') : '';
      return res.blob().then(function (blob) {
        if (!blob || !looksLikeAudio(ct, blob.size)) return null;
        return blob;
      });
    }).catch(function () { return null; });
  }

  /* ---------- Пакет озвучки внутри приложения ---------- */

  /* Манифест и файлы кладёт tools/build-audio-pack.js: это готовая озвучка
     слов приложения, скачанная один раз и лежащая рядом с кодом. */
  var PACK_FILE = 'audio/manifest.json';
  var pack = null;          // загруженный манифест
  var packTried = false;    // уже пробовали — второй раз не дёргаем
  var packPending = null;

  /**
   * Манифест пакета. Пакета может не быть вовсе (приложение поставляется
   * и без него) — тогда null, и всё работает как прежде.
   */
  function loadPack() {
    if (pack) return Promise.resolve(pack);
    if (packTried) return Promise.resolve(null);
    if (!supported()) return Promise.resolve(null);
    if (packPending) return packPending;
    packTried = true;
    packPending = global.fetch(PACK_FILE, { credentials: 'same-origin', cache: 'no-cache' })
      .then(function (res) { return (res && res.ok) ? res.json() : null; })
      .then(function (json) {
        pack = (json && json.phrases) ? json : null;
        return pack;
      })
      .catch(function () { pack = null; return null; });
    return packPending;
  }

  /**
   * Запись пакета для фразы. Чистая функция: манифест передаётся явно,
   * поэтому её проверяют тесты без сети и без загрузки файла.
   */
  function packEntryIn(manifest, text, lang) {
    if (!manifest || !manifest.phrases) return null;
    var entry = manifest.phrases[cacheKey(text, lang)];
    return (entry && entry.file) ? entry : null;
  }

  /** Файл из пакета для фразы. По уже загруженному манифесту. */
  function packFile(text, lang) {
    var entry = packEntryIn(pack, text, lang);
    return entry ? String(entry.file) : null;
  }

  /** Загружен ли пакет (синхронно, по уже прочитанному манифесту). */
  function hasPack() { return !!pack; }

  function packAudio(text, lang) {
    return loadPack().then(function () {
      var file = packFile(text, lang);
      if (!file) return null;
      return global.fetch(file, { credentials: 'same-origin' }).then(function (res) {
        if (!res || !res.ok) return null;
        return res.blob().then(function (blob) {
          return (blob && looksLikeAudio(blob.type, blob.size)) ? blob : null;
        });
      }).catch(function () { return null; });
    });
  }

  /**
   * Порядок: свои файлы → кэш → сеть.
   *
   * Пакет стоит первым, потому что он уже лежит в приложении: ни сети,
   * ни Cache API не нужно, а значит озвучка работает сразу после первой
   * установки и в офлайне. Кэш — то, что докачал сам пользователь.
   * Сеть — только последняя инстанция.
   */
  function getAudio(text, lang) {
    if (!supported()) return Promise.resolve(null);
    var t = normText(text);
    if (!t) return Promise.resolve(null);

    return packAudio(t, lang).then(function (packed) {
      if (packed) return packed;
      return cacheGet(t, lang).then(function (cached) {
        if (cached) return cached;
        if (!enabled() || !online()) return null;
        return fetchAudio(t, lang).then(function (blob) {
          if (!blob) return null;
          return cachePut(t, lang, blob).then(function () { return blob; });
        });
      });
    });
  }

  /* ---------- Проигрывание ---------- */

  var currentAudio = null;   // ссылка держится: иначе сборщик мусора оборвёт звук
  var currentUrl = '';       // objectURL, который надо освободить
  var playingButton = null;
  var currentOnEnd = null;   // чужой колбэк окончания (кнопка из speech.js)

  function releaseAudio() {
    if (currentAudio) {
      try {
        currentAudio.pause();
        /* Снимаем адрес ДО отзыва blob-ссылки. Иначе загрузка, которая ещё
           не закончилась, остаётся висеть на уже несуществующем адресе и
           падает с ERR_FILE_NOT_FOUND — в консоли это выглядит как ошибка
           приложения, хотя звук мы просто остановили сами. */
        currentAudio.removeAttribute('src');
      } catch (e) { /* ignore */ }
      currentAudio = null;
    }
    if (currentUrl && global.URL && global.URL.revokeObjectURL) {
      try { global.URL.revokeObjectURL(currentUrl); } catch (e) { /* ignore */ }
    }
    currentUrl = '';
  }

  function markPlaying(btn, on) {
    if (!btn || !btn.classList) return;
    if (on) {
      playingButton = btn;
      btn.classList.add('is-playing');
    } else {
      btn.classList.remove('is-playing');
      if (playingButton === btn) playingButton = null;
    }
  }

  function makeAudio() {
    if (typeof global.Audio === 'function') return new global.Audio();
    if (global.document && global.document.createElement) return global.document.createElement('audio');
    return null;
  }

  /**
   * Остановить сетевую озвучку. Зовётся в том числе из speech.stop(),
   * чтобы кнопка 🔊 вела себя одинаково для файла и для синтеза речи.
   */
  function stop() {
    releaseAudio();
    if (playingButton) markPlaying(playingButton, false);
    /* Остановка извне (уход с экрана, очистка кэша) должна снять отметку
       и во втором месте: кнопку рисует speech.js и держит своё состояние. */
    var cb = currentOnEnd;
    currentOnEnd = null;
    if (cb) { try { cb(); } catch (e) { /* ignore */ } }
  }

  /**
   * Проиграть фразу из кэша или из сети.
   * @returns Promise<boolean|string> — true, если звук действительно начал
   *   играть; SUPERSEDED, если эту фразу перебила следующая (звук идёт, но
   *   другой); false означает «не получилось», и вызывающий обязан упасть
   *   обратно на Web Speech. Промис не отклоняется никогда.
   *
   * @param {object} [opts] — { button } кнопка, которой управляет is-playing
   */
  function play(text, lang, opts) {
    opts = opts || {};
    if (!supported()) return Promise.resolve(false);

    return getAudio(text, lang).then(function (blob) {
      if (!blob) return false;

      var audio = makeAudio();
      if (!audio) return false;
      if (!global.URL || !global.URL.createObjectURL) return false;

      stop();
      try {
        currentUrl = global.URL.createObjectURL(blob);
      } catch (e) { return false; }

      audio.src = currentUrl;
      audio.preload = 'auto';
      currentAudio = audio;
      currentOnEnd = opts.onend || null;
      markPlaying(opts.button, true);

      var finished = false;
      function done() {
        if (finished) return;
        finished = true;
        /* Освобождаем только свой файл: к этому моменту могло начаться
           проигрывание другой фразы, и её трогать нельзя. */
        if (currentAudio === audio) releaseAudio();
        markPlaying(opts.button, false);
        var cb = currentOnEnd;
        currentOnEnd = null;
        if (cb) { try { cb(); } catch (e) { /* ignore */ } }
      }
      audio.onended = done;
      audio.onerror = done;
      audio.onpause = function () {
        // остановка извне (stop(), уход с экрана) — снимаем отметку с кнопки
        if (audio.paused) markPlaying(opts.button, false);
      };

      var started = audio.play();
      if (started && typeof started.then === 'function') {
        return started.then(function () { return true; }).catch(function () {
          done(false);
          /* Нас перебила другая фраза: пока файл грузился, начали играть
             следующий. Это НЕ провал — значит, звук идёт, просто другой.
             Если здесь вернуть false, вызывающий услужливо включит системный
             голос поверх уже звучащего файла, и человек слышит робота там,
             где уже звучит нормальная озвучка. */
          if (currentAudio && currentAudio !== audio) return SUPERSEDED;
          /* Автовоспроизведение запрещено браузером или файл не открылся.
             Это не ошибка приложения: просто играем системным голосом. */
          return false;
        });
      }
      return true;
    }).catch(function () { return false; });
  }

  /* ============================================================
     Остановка при уходе с экрана

     Звук из свёрнутого окна — та же проблема, что и у синтеза речи:
     браузер не замолкает сам. Слушатели на события, а не таймеры:
     мобильные браузеры замораживают таймеры в фоне.
     ============================================================ */
  function stopWhenHidden() {
    if (global.document && global.document.visibilityState === 'hidden') stop();
  }
  if (global.document && typeof global.document.addEventListener === 'function') {
    global.document.addEventListener('visibilitychange', stopWhenHidden);
  }
  if (typeof global.addEventListener === 'function') {
    global.addEventListener('pagehide', function () { stop(); });
  }

  /* ---------- Пачка ---------- */

  /** Список уникальных нормализованных фраз без пустых строк. */
  function uniqueTexts(texts) {
    var seen = {}, out = [];
    (texts || []).forEach(function (t) {
      var s = normText(t);
      if (!s || seen[s]) return;
      seen[s] = true;
      out.push(s);
    });
    return out;
  }

  /**
   * Скачать пачку фраз (колода или сессия) с прогрессом.
   *
   * Параллелизм ограничен MAX_CONCURRENT: сервис чужой и бесплатный,
   * десяток одновременных запросов выглядит как атака.
   *
   * @param {string[]} texts
   * @param {string} lang
   * @param {function} [onProgress] — { done, total, bytes, failed }
   * @returns Promise<{done, total, bytes, failed, stopped}>
   *   done — сколько фраз доступно офлайн после загрузки (включая те,
   *   что уже лежали в кэше), bytes — сколько байт скачано именно в этом
   *   запуске, failed — сколько фраз не удалось получить, stopped — правда,
   *   если страница выгружалась и очередь оборвалась на середине.
   *   Общий размер кэша берётся из stats(), а не отсюда.
   */
  function preload(texts, lang, onProgress) {
    var list = uniqueTexts(texts);
    var result = { done: 0, total: list.length, bytes: 0, failed: 0, stopped: false };
    if (!list.length) return Promise.resolve(result);
    if (!available()) {
      result.failed = list.length;
      if (onProgress) onProgress(result);
      return Promise.resolve(result);
    }

    var queue = list.slice();
    var active = 0;
    var stopped = false;

    /* Оборвать загрузку на visibilitychange нельзя: её человек запустил сам,
       и переключение вкладки не должно её прерывать. А pagehide означает,
       что страница уходит насовсем — начинать новые запросы бессмысленно.
       Событие, а не таймер: мобильные браузеры таймеры в фоне замораживают. */
    function onPageHide() { stopped = true; }
    if (typeof global.addEventListener === 'function') {
      global.addEventListener('pagehide', onPageHide);
    }

    function cleanup() {
      if (typeof global.removeEventListener === 'function') {
        global.removeEventListener('pagehide', onPageHide);
      }
    }

    return new Promise(function (resolve) {
      function report() {
        if (onProgress) onProgress(result);
      }

      function pump() {
        if (stopped) {
          result.stopped = true;
          if (!active) { cleanup(); resolve(result); }
          return;
        }
        /* Ограничение параллелизма стоит здесь, а не только у вызывающего:
           тогда и стартовый запуск, и «добор» после каждой фразы проходят
           через одну проверку, и больше MAX_CONCURRENT запросов не бывает. */
        if (active >= MAX_CONCURRENT) return;
        if (!queue.length) {
          if (!active) { cleanup(); resolve(result); }
          return;
        }
        var text = queue.shift();
        active++;
        getAudio(text, lang).then(function (blob) {
          if (blob) {
            result.done++;
            result.bytes += blob.size;
          } else {
            result.failed++;
          }
        }).then(function () {
          active--;
          report();
          pump();
        });
        pump();   // добираем параллелизм, пока он ниже предела
      }

      for (var i = 0; i < MAX_CONCURRENT; i++) pump();
      report();
    });
  }

  /* ---------- Статистика и очистка ---------- */

  /**
   * Сколько фраз скачано и сколько это занимает.
   * Это единственный честный источник для «подтверждения загрузки»:
   * число берётся из кэша, а не из настроек, поэтому его нельзя
   * «унаследовать» с другого устройства.
   * @returns Promise<{count, bytes}>
   */
  function stats() {
    if (!supported()) return Promise.resolve({ count: 0, bytes: 0 });
    return openCache().then(function (cache) {
      return cache.keys().then(function (keys) {
        var mine = (keys || []).filter(function (req) {
          return String(req && req.url || '').indexOf(KEY_PREFIX) === 0;
        });
        return Promise.all(mine.map(function (req) {
          return cache.match(req).then(function (res) {
            if (!res) return 0;
            return res.blob().then(function (b) { return b ? b.size : 0; });
          }).catch(function () { return 0; });
        })).then(function (sizes) {
          var bytes = 0;
          sizes.forEach(function (n) { bytes += n; });
          return { count: mine.length, bytes: bytes };
        });
      });
    }).catch(function () { return { count: 0, bytes: 0 }; });
  }

  /** Полная очистка скачанной озвучки. Оболочка приложения не затрагивается. */
  function purge() {
    if (!supported()) return Promise.resolve(0);
    stop();
    return openCache().then(function (cache) {
      return cache.keys().then(function (keys) {
        var mine = (keys || []).filter(function (req) {
          return String(req && req.url || '').indexOf(KEY_PREFIX) === 0;
        });
        return Promise.all(mine.map(function (req) {
          return cache.delete(req).catch(function () { return false; });
        })).then(function () {
          setDownloaded(0);
          return mine.length;
        });
      });
    }).catch(function () { return 0; });
  }

  /* Манифест пакета читаем сразу при загрузке: он маленький, а знать о
     готовых файлах нужно до того, как человек нажмёт 🔊 — иначе первый
     звук ушёл бы в сеть, хотя лежит рядом. */
  if (supported()) loadPack();

  App.ttsnet = {
    ENDPOINT: ENDPOINT,
    CACHE_NAME: CACHE_NAME,
    KEY_PREFIX: KEY_PREFIX,
    MIN_AUDIO_BYTES: MIN_AUDIO_BYTES,
    MAX_CONCURRENT: MAX_CONCURRENT,
    SUPERSEDED: SUPERSEDED,
    normText: normText,
    normLang: normLang,
    providerUrl: providerUrl,
    cacheKey: cacheKey,
    looksLikeAudio: looksLikeAudio,
    supported: supported,
    online: online,
    enabled: enabled,
    needsNetwork: needsNetwork,
    available: available,
    willUseFiles: willUseFiles,
    PACK_FILE: PACK_FILE,
    loadPack: loadPack,
    packEntryIn: packEntryIn,
    packFile: packFile,

  /** Тело файла гиста. Содержимое приходит уже очищенным от секретов. */
  function fileBody(content) {
    var files = {};
    files[GIST_FILE] = { content: content };
    return files;
  }

  /** Пустая строка — можно отправлять; иначе готовое объяснение, почему нет. */
  function tooBig(content) {
    var size = (U && U.bytesOf) ? U.bytesOf(content) : content.length;
    if (size <= MAX_BYTES) return '';
    var human = (U && U.fmtBytes) ? U.fmtBytes(size) : (size + ' Б');
    return 'Данных слишком много для гиста (' + human + '). GitHub хранит файл целиком примерно до 1 МБ — ' +
      'выгрузите лишние колоды в резервную копию или отключите синхронизацию.';
  }

  function createGist(token) {
    var content = JSON.stringify(S.syncPayload());
    var big = tooBig(content);
    if (big) return Promise.resolve({ error: big });

    return request('/gists', {
      method: 'POST',
      token: token,
      body: { description: GIST_DESC, public: false, files: fileBody(content) }
    }).then(function (res) {
      if (!res.ok) return { error: describeError(res) };
      var id = res.json && res.json.id;
      if (!id) return { error: 'GitHub не вернул идентификатор хранилища.' };
      return { id: id };
    });
  }

  function writeGist(token, gistId, content, keepalive) {
    var big = tooBig(content);
    if (big) return Promise.resolve({ error: big });

    return request('/gists/' + gistId, {
      method: 'PATCH',
      token: token,
      keepalive: !!keepalive,
      body: { files: fileBody(content) }
    }).then(function (res) {
      if (!res.ok) return { error: describeError(res) };
      return { id: gistId };
    });
  }

  function readRemote(token, gistId) {
    return request('/gists/' + gistId, { token: token }).then(function (res) {
      if (!res.ok) return { error: describeError(res) };

      var file = (res.json && res.json.files) ? res.json.files[GIST_FILE] : null;
      /* Гист есть, а файла ещё нет — считаем облако пустым и просто
         заливаем свои данные. Это первый запуск, а не ошибка. */
      if (!file) return { data: {} };
      if (file.truncated) {
        return { error: 'Файл синхронизации слишком большой: GitHub отдаёт его частями. ' +
          'Уменьшите набор данных и подключитесь заново.' };
      }
      if (!file.content) return { data: {} };

      var parsed;
      try { parsed = JSON.parse(file.content); }
      catch (e) { return { error: 'Файл синхронизации повреждён: не удалось разобрать JSON.' }; }
      if (!parsed || typeof parsed !== 'object') return { data: {} };
      return { data: parsed };
    });
  }

  /** Переиспользуем уже подключённый гист, чтобы подключения не плодили копии. */
  function ensureGist(token) {
    var existing = String(syncCfg().gistId || '');
    if (!existing) return createGist(token);

    return request('/gists/' + existing, { token: token }).then(function (res) {
      if (res.ok) return writeGist(token, existing, JSON.stringify(S.syncPayload()));
      if (res.status === 404) return createGist(token);
      return { error: describeError(res) };
    });
  }

  /* ============================================================
     4. ПУБЛИЧНЫЕ ДЕЙСТВИЯ
     ============================================================ */

  /**
   * Подключиться к уже существующему хранилищу по его коду.
   *
   * Это нужно второму устройству. Без кода оно создало бы СВОЙ гист:
   * статус был бы «подключено», ошибок бы не было, а данные двух
   * устройств никогда бы не встретились — каждое писало бы в своё.
   */
  function join(token, gistId) {
    var value = String(token || '').trim();
    var id = String(gistId || '').trim();

    return new Promise(function (resolve) {
      if (!value) { resolve(fail('Введите токен GitHub.')); return; }
      if (!id) { resolve(fail('Введите код хранилища.')); return; }
      if (typeof global.fetch !== 'function') {
        resolve(fail('Браузер не поддерживает сетевые запросы — синхронизация недоступна.'));
        return;
      }

      setStatus('syncing', 'Проверяем токен…');
      request('/user', { token: value }).then(function (res) {
        if (!res.ok) { resolve(fail(describeError(res))); return null; }

        return request('/gists/' + encodeURIComponent(id), { token: value }).then(function (gres) {
          if (!gres.ok) {
            if (gres.status === 404) {
              resolve(fail('Хранилище не найдено (404). Код или токен неверные — они должны быть от одного аккаунта GitHub.'));
            } else {
              resolve(fail(describeError(gres) + ' [HTTP ' + gres.status + ']'));
            }
            return null;
          }

          configure({ provider: 'gist', token: value, gistId: id, auto: true, lastError: '' });
          patchSync({ lastAt: 0, lastError: '' });
          setStatus('idle', 'Хранилище подключено, забираем данные…');

          /* Сразу тянем данные: иначе подключение выглядит как «настроено,
             но пусто», и человек не понимает, сработало ли оно. */
          return now().then(function (out) {
            resolve(out && out.ok ? { ok: true, gistId: id, login: (res.json && res.json.login) || '' } : out);
            return null;
          });
        });
      }).then(null, function (e) {
        resolve(fail('Не удалось связаться с GitHub: ' + String(e && e.message || e)));
      });
    });

  /**
   * Подключение: сначала проверяем токен, и только потом сохраняем.
   * Иначе нерабочий токен осел бы в настройках и автосинхронизация
   * молча писала бы ошибку на каждом запуске.
   */
  function connect(token) {
    var value = String(token || '').trim();

    return new Promise(function (resolve) {
      if (!value) { resolve(fail('Введите токен GitHub.')); return; }
      if (typeof global.fetch !== 'function') {
        resolve(fail('Браузер не поддерживает сетевые запросы — синхронизация недоступна.'));
        return;
      }

      setStatus('syncing', 'Проверяем токен…');
      request('/user', { token: value }).then(function (res) {
        if (!res.ok) { resolve(fail(describeError(res))); return; }

        /* Токен рабочий — прошлая ошибка больше не актуальна. */
        live.state = 'idle';
        live.message = '';

        return ensureGist(value).then(function (out) {
          if (out.error) { resolve(fail(out.error)); return; }

          configure({ provider: 'gist', token: value, gistId: out.id, lastError: '' });
          patchSync({ lastAt: 0, lastError: '' });
          var login = (res.json && res.json.login) || '';
          setStatus('idle', login ? 'Хранилище подключено: ' + login : 'Хранилище подключено');

        resolve(fail('Не удалось связаться с GitHub: ' + String(e && e.message || e)));
      });
    });

  /**
   * Обмен с облаком: прочитать, слить, применить, отправить обратно.
   * @param {{keepalive?: boolean}} [opts] — keepalive для отправки в момент,
   *   когда страница закрывается.
   */

    if (!isConfigured()) return Promise.resolve({ ok: false, error: 'Синхронизация не настроена.' });
    if (busy) return Promise.resolve({ ok: false, error: 'Синхронизация уже идёт.' });
    if (typeof global.fetch !== 'function') {
      return Promise.resolve(fail('Браузер не поддерживает сетевые запросы — синхронизация недоступна.'));
    }

    busy = true;
    setStatus('syncing', 'Синхронизация…');

      var before = dataSignature(S.get());
      S.applyMerged(merged.data);

         syncPayload() сам вырезает токен и идентификатор гиста. */
      var content = JSON.stringify(S.syncPayload());
      var big = tooBig(content);
      if (big) return fail(big);

      return writeGist(cfg.token, cfg.gistId, content, opts.keepalive).then(function (written) {
        if (written.error) return fail(written.error);
        var at = Date.now();
        patchSync({ lastAt: at, lastError: '' });
        /* Данные в облаке. Снимаем флаг только здесь: при ошибке он остаётся,
           и приложение повторит отправку, когда связь вернётся. */
        dirty = false;
        setStatus('ok', 'Синхронизировано');
        return { ok: true, stats: merged.stats, at: at };
      });
    }).then(function (out) {
      busy = false;
      return out;
    }, function (e) {
      busy = false;
      return fail('Синхронизация прервана: ' + String(e && e.message || e));
    });
  }

  function disconnect() {

    clearTimers();

      provider: 'off',
      token: '',
      gistId: '',
      auto: false,
      lastAt: 0,
      lastError: ''

    live.message = '';
    live.at = 0;
    setStatus('off', '');

  /* ============================================================
     5. АВТОСИНХРОНИЗАЦИЯ
     ============================================================ */

  function isOnline() {

   * не дожидаясь настоящих таймеров.
   *
   * В фоне браузер режет таймеры и сеть, а тратить заряд на частые запросы
   * незачем: там интервал остаётся длинным, а на возвращение на экран есть
   * отдельное правило (shouldSyncOnResume).
   */

    return visible ? LIVE_INTERVAL : AUTO_INTERVAL;

  function clearTimers() {
    if (autoTimer) { global.clearInterval(autoTimer); autoTimer = null; }
    if (changeTimer) { global.clearTimeout(changeTimer); changeTimer = null; }
    if (firstTimer) { global.clearTimeout(firstTimer); firstTimer = null; }
  }

  function autoSync(opts) {
    if (busy || !running || !isConfigured() || !syncCfg().auto) return;
    if (!isOnline()) return;

  }

  /**
   * Перепланировать очередной обмен.
   *
   * setTimeout, а не setInterval: интервал зависит от того, на экране ли
   * вкладка, и меняется на ходу. Планируем следующий заход сразу после
   * нынешнего — overlapping невозможен, autoSync() сам занятость проверит.
   */
  function scheduleAuto() {
    if (autoTimer) { global.clearTimeout(autoTimer); autoTimer = null; }
    if (!running || !isConfigured() || !syncCfg().auto || !isOnline()) return;
    autoTimer = global.setTimeout(function () {
      autoTimer = null;
      autoSync();
      scheduleAuto();
    }, autoInterval());
  }

  /** Приводит таймеры в соответствие с настройками: без токена ничего не планируется. */
  function applyAuto() {
    if (isConfigured() && syncCfg().auto) {
      running = true;
      clearTimers();
      if (!isOnline()) return;
      scheduleAuto();
    } else {
      running = false;
      clearTimers();
    }
  }

  /**
   * Первый обмен после включения — с задержкой, чтобы не бить в сеть сразу.
   * @param {number} [delay] — своя задержка вместо CHANGE_DELAY (запуск приложения).
   */
  function scheduleSoon(delay) {
    if (firstTimer) { global.clearTimeout(firstTimer); firstTimer = null; }
    if (!running || !isConfigured()) return;
    firstTimer = global.setTimeout(function () {
      firstTimer = null;
      autoSync();
    }, typeof delay === 'number' ? delay : CHANGE_DELAY);
  }

  /** Флаг автосинхронизации пишем только при реальном изменении. */
  function setAutoFlag(value) {

    patchSync({ auto: on });
  }

  function start() {
    setAutoFlag(true);
    applyAuto();
    /* При запуске приложения первый обмен нужен быстро — иначе холодный
       старт показывает вчерашние данные. START_DELAY (1,5 c) быстрее
       обычной задержки (5 c), но не бьёт по сети мгновенно. */
    scheduleSoon(START_DELAY);
    return status();
  }

  function stop() {
    setAutoFlag(false);
    applyAuto();
    return status();
  }

  /**
   * Запланировать отправку после правки.
   * Удаления уходят почти сразу (см. changeDelay): не доехавшее удаление
   * воскрешает запись на другом устройстве, а обычная правка может подождать.
   */
  function scheduleChange(reason) {
    if (!running || !isConfigured() || !syncCfg().auto) return false;
    dirty = true;

    var delay = changeDelay(reason);
    if (changeTimer) {
      /* Отправка уже назначена. Срочную правку переносим на ближайшее время,
         а обычная пусть ждёт уже выбранного срока — не откладываем её заново. */
      if (delay >= CHANGE_DELAY) return true;
      global.clearTimeout(changeTimer);
    }
    changeTimer = global.setTimeout(function () {
      changeTimer = null;
      autoSync();
    }, delay);
    return true;
  }

  /**
   * Отправить несохранённое немедленно — когда страница уходит в фон или
   * закрывается. В фоне таймеры замирают, поэтому удаление, отложенное на
   * пять секунд, могло не уехать вообще. Запрос помечается keepalive, чтобы
   * браузер довёл его до конца уже во время закрытия страницы.
   */
  function flushPending() {
    if (!dirty || !running || !isConfigured() || !syncCfg().auto) return false;
    if (changeTimer) { global.clearTimeout(changeTimer); changeTimer = null; }
    autoSync({ keepalive: true });
    return true;
  }

  /* Любая правка данных планирует отправку. События самого слияния
     пропускаем — иначе синхронизация запускала бы саму себя. */
  if (S && typeof S.subscribe === 'function') {
    S.subscribe(function (reason) {
      if (String(reason || '').indexOf('sync:') === 0) return;
      scheduleChange(reason);
    });
  }

  if (typeof global.addEventListener === 'function') {
    global.addEventListener('online', function () {
      if (running && isConfigured()) autoSync();
    });
    global.addEventListener('offline', function () {
      if (running && isConfigured()) setStatus('idle', 'Офлайн: синхронизация ждёт связи');
    });
    /* pagehide надёжнее beforeunload: на мобильных Safari последний
       не срабатывает, а страница уходит в фоновый кэш. */
    global.addEventListener('pagehide', function () { flushPending(); });

  if (global.document && typeof global.document.addEventListener === 'function') {
    global.document.addEventListener('visibilitychange', function () {
      if (!running || !isConfigured()) return;

      if (global.document.visibilityState === 'hidden') {
        hiddenAt = Date.now();
        flushPending();
        scheduleAuto();   // в фоне реже
        return;
      }

      /* Вернулись на экран: с этого момента снова спрашиваем облако часто. */
      scheduleAuto();

      /* Вернулись в приложение. На телефоне это происходит постоянно, поэтому
         данные забираем, если отсутствовали заметное время: иначе удалённая
         на компьютере колода оставалась бы на экране до ручной синхронизации. */
      var away = hiddenAt ? Date.now() - hiddenAt : Infinity;
      hiddenAt = 0;
      if (shouldSyncOnResume({ dirty: dirty, awayMs: away, sinceLastMs: Date.now() - num(syncCfg().lastAt) })) {
        autoSync();
      }
    });
  }

  /* Автосинхронизация возобновляется из app.js init() после S.load(),
     потому что syncCfg() на момент загрузки модуля ещё не видит
     данные из localStorage. Здесь лишь планируем первый обмен, если
     уже настроено (холодный запуск без app.js — например, unit-тесты). */
  if (syncCfg().auto && isConfigured()) {
    applyAuto();
    scheduleSoon(START_DELAY);
  }

  App.sync = {
    merge: merge,
    isConfigured: isConfigured,
    status: status,
    onChange: onChange,
    configure: configure,
    connect: connect,
    join: join,
    now: now,
    disconnect: disconnect,
    start: start,
    stop: stop,
    /* Есть ли правки, не уехавшие в облако. Панель показывает это словами,
       а страница использует при уходе в фон (flushPending). */
    pending: function () { return dirty; },
    flushPending: flushPending,
    changeDelay: changeDelay,
    shouldSyncOnResume: shouldSyncOnResume,
    shouldRefreshOnRemote: shouldRefreshOnRemote,
    autoInterval: autoInterval,
    dataSignature: dataSignature
  };
})(window);

/* ============================================================
   LexiFlow — notify.js
