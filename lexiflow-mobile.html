          this.classList.add('is-active');
        }
      }, h('span', { text: d.label })));
    });

    var limitInput = h('input', {
      class: 'input', type: 'number', min: 0, max: 500, value: cfg.limit,
      onchange: function () { cfg.limit = Math.max(0, Math.min(500, Number(this.value) || 0)); }
    });

    var limitsToggle = h('input', {
      type: 'checkbox', checked: cfg.useLimits,
      onchange: function () { cfg.useLimits = this.checked; }
    });
    var shuffleToggle = h('input', {
      type: 'checkbox', checked: cfg.shuffle,
      onchange: function () { cfg.shuffle = this.checked; }
    });

    var head = h('div', { class: 'page-head' },
      h('div', { class: 'page-head__main' },
        h('button', { class: 'icon-btn', 'aria-label': 'Назад', onclick: function () { App.router.go(deck ? '#/deck/' + deck.id : '#/decks'); } }, icon('back', 20)),
        h('div', {},
          h('h1', { class: 'page-title', text: deck ? 'Тренировка: ' + deck.name : 'Тренировка по всем колодам' }),
          h('p', { class: 'page-sub', text: totals.due + ' к повторению · ' + totals.learning + ' в обучении · ' + totals.new + ' новых' })
        )
      )
    );

    var launcher = h('div', { class: 'panel panel--wide' },
      h('div', { class: 'panel__head' }, h('h2', { class: 'panel__title', text: 'Режим тренировки' })),
      modeRow,
      h('div', { class: 'panel__section' },
        h('span', { class: 'field__label', text: 'Направление' }),
        dirRow
      ),
      h('div', { class: 'panel__section panel__section--row' },
        h('label', { class: 'switch-row' }, limitsToggle, h('span', { text: 'Учитывать дневные лимиты' })),
        h('label', { class: 'switch-row' }, shuffleToggle, h('span', { text: 'Перемешать порядок' })),
        h('label', { class: 'switch-row switch-row--num' }, h('span', { text: 'Карточек за сессию' }), limitInput)
      ),
      h('div', { class: 'panel__foot' },
        h('button', { class: 'btn btn--primary btn--lg', onclick: function () { startSession(deckIds, cfg, false); } },
          icon('play', 18), h('span', { text: 'Начать тренировку' })),
        h('button', { class: 'btn btn--ghost btn--lg', onclick: function () { App.router.go('#/test/' + (params.id || 'all')); } },
          icon('target', 18), h('span', { text: 'Режим теста' }))
      )
    );

    U.clear(root);
    U.append(root, [h('div', { class: 'page' }, head, launcher)]);
  }

  /* ============================================================
     Сессия
     ============================================================ */

  function startSession(deckIds, cfg, isTest) {
    var opts = {
      ignoreLimits: !cfg.useLimits,
      shuffleMain: !!cfg.shuffle,
      limit: cfg.limit
    };
    var q = isTest ? null : buildQueue(deckIds, opts);
    var queue = isTest
      ? { learn: [], main: buildTestQueue(deckIds, cfg.count || 20), counts: { new: 0, learning: 0, due: 0 } }
      : q;

    session = {
      deckIds: deckIds,
      mode: cfg.mode,
      dir: cfg.dir,
      applySrs: !isTest,
      test: !!isTest,
      learn: queue.learn,
      main: queue.main,
      initialCounts: queue.counts,
      current: null,
      cardStartTs: 0,
      startedAt: Date.now(),
      answered: 0,
      correct: 0,
      totalPlanned: queue.learn.length + queue.main.length,
      history: [],
      undoStack: [],
      mistakes: [],
      finished: false,
      interstitial: null
    };

    /* Дальше отрисовывает роутер: go() либо кликнет render сам (hash тот же),
       либо поменяет hash, и сессию нарисует hashchange. Свой renderSession()
       здесь давал вторую отрисовку той же карточки, а с ней — второй,
       уже ненужный запуск озвучки. */
    App.router.go(isTest ? '#/test/' + (deckIds.length === 1 ? deckIds[0] : 'all') + '/run' : '#/study/' + (deckIds.length === 1 ? deckIds[0] : 'all') + '/run');
  }

  function renderSession() {
    var root = U.qs('#view');
    if (!session) { App.router.refresh(); return; }
    if (session.finished) { finish(); return; }

    var bar = h('header', { class: 'study__bar' },
      h('button', { class: 'icon-btn', title: 'Выйти', onclick: function () { exitSession(); } }, icon('close', 20)),
      h('div', { class: 'study__meter' },
        h('div', { class: 'study__meter-top' },
          h('span', { class: 'study__meter-label', id: 'study-label', text: progressLabel() }),
          h('span', { class: 'study__meter-right', text: modeMeta(currentModeId()).label })
        ),
        h('div', { class: 'progress progress--sm' },
          h('div', { class: 'progress__bar', id: 'study-progress', style: { width: progressPct() + '%' } })
        )
      ),
      h('div', { class: 'study__actions' },
        h('button', {
          class: 'icon-btn', title: 'Отменить последний ответ', id: 'undo-btn',
          disabled: session.undoStack.length ? null : true,
          onclick: function () { undo(); }
        }, icon('undo', 18))
      )
    );

    U.clear(root);
    U.append(root, [
      h('div', { class: 'study' + (session.test ? ' study--test' : '') },
        bar,
        /* Проверка голосов — до первого слова, а не после немой кнопки 🔊 */
        ttsNotice(),
        h('div', { class: 'study__stage', id: 'stage' }),
        h('div', { class: 'study__footer', id: 'study-footer' })
      )
    ]);

    if (!session.current) { next(); return; }

    // повторная отрисовка того же вопроса (например, при смене hash) —
    // карточка не должна «съедаться» повторным вызовом next()
    session.current.revealed = false;
    session.cardStartTs = Date.now();
    renderCard();
    updateProgress();
  }

  function currentModeId() {
    if (session.mode !== 'mixed') return session.mode;
    return session.current ? session.current.mode : 'flip';
  }

  /** Сколько уникальных карточек ещё в работе (включая текущую на экране). */
  function remainingUnique() {
    var set = {};
    session.learn.forEach(function (i) { set[i.card.id] = 1; });
    session.main.forEach(function (i) { set[i.card.id] = 1; });
    if (session.current) set[session.current.card.id] = 1;
    return Object.keys(set).length;
  }

  function progressLabel() {
    return 'Отвечено: ' + session.answered + ' · осталось ' + remainingUnique();
  }

  function progressPct() {
    var rem = remainingUnique();
    var total = session.answered + rem;
    return total ? Math.round(session.answered / total * 100) : 0;
  }

  function updateProgress() {
    var label = U.qs('#study-label'), bar = U.qs('#study-progress');
    if (label) label.textContent = progressLabel();
    if (bar) bar.style.width = progressPct() + '%';
    var undoBtn = U.qs('#undo-btn');
    if (undoBtn) undoBtn.disabled = !session.undoStack.length;
  }

  /** Взять следующую карточку. */
  function next() {
    var now = Date.now();
    var item = null;

    // карточки в обучении, срок которых наступил
    if (session.learn.length && session.learn[0].due <= now) {
      item = session.learn.shift();
    } else if (session.main.length) {
      item = session.main.shift();
    } else if (session.learn.length) {
      // остались только карточки обучения с задержкой
      showInterstitial();
      return;
    }

    if (!item) { finish(); return; }

    var mode = session.mode === 'mixed' ? pickMixedMode(item.card) : session.mode;
    session.current = { item: item, card: item.card, mode: mode, dir: resolveDir(), revealed: false };
    session.cardStartTs = now;
    renderCard();
    updateProgress();
  }

  function pickMixedMode(card) {
    var pool = ['flip', 'choice', 'typing'];
    if (SP.supported()) pool.push('listening');
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function resolveDir() {
    if (session.dir === 'mixed') return Math.random() < 0.5 ? 'fwd' : 'rev';
    return session.dir;
  }

  /* ---------- Отрисовка карточки ---------- */

  function renderCard() {
    var stage = U.qs('#stage');
    var footer = U.qs('#study-footer');
    if (!stage || !footer) return;
    U.clear(stage); U.clear(footer);
    if (!session.current) return;

    var c = session.current;
    var card = c.card;
    var mode = c.mode;
    if (mode === 'listening') { renderListening(stage, footer, c); return; }
    if (mode === 'choice') { renderChoice(stage, footer, c); return; }
    if (mode === 'typing') { renderTyping(stage, footer, c); return; }
    renderFlip(stage, footer, c);
  }

  /** Промпт (лицевая сторона) карточки. */
  function promptSide(card, dir) {
    var frontText = dir === 'fwd' ? card.word : card.translation;
    var lang = dir === 'fwd' ? langForCard(card, 'from') : langForCard(card, 'to');
    var ipa = dir === 'fwd' ? card.transcription : '';
    var wordSpan = h('span', { class: 'qcard__word-text', text: frontText });
    var wrap = h('div', { class: 'qcard__prompt' },
      h('div', { class: 'qcard__label', text: dir === 'fwd' ? 'Переведите' : 'Как это будет на изучаемом языке?' }),
      h('div', { class: 'qcard__word' },
        wordSpan,
        SP.supported() ? SP.audioButton(frontText, lang, { rate: S.settings().ttsRate, target: wordSpan }) : null
      ),
      ipa && S.settings().showTranscription
        ? h('div', { class: 'qcard__ipa', text: '[' + ipa.replace(/^\[|\]$/g, '') + ']' })
        : null
    );
    return wrap;
  }

  function answerSide(card, dir) {
    var answerText = dir === 'fwd' ? card.translation : card.word;
    var lang = dir === 'fwd' ? langForCard(card, 'to') : langForCard(card, 'from');
    var ipa = dir === 'fwd' ? '' : card.transcription;
    var answerSpan = h('span', { class: 'qcard__answer-text', text: answerText });
    return h('div', { class: 'qcard__answer' },
      h('div', { class: 'qcard__answer-main' },
        answerSpan,
        SP.supported() ? SP.audioButton(answerText, lang, { rate: S.settings().ttsRate, target: answerSpan }) : null
      ),
      ipa && S.settings().showTranscription ? h('div', { class: 'qcard__ipa', text: '[' + ipa.replace(/^\[|\]$/g, '') + ']' }) : null,
      card.examples && card.examples.length
        ? h('ul', { class: 'qcard__examples' },
            card.examples.map(function (ex) {
              var exSpan = h('span', { class: 'qcard__example-text', text: ex.text });
              return h('li', {},
                exSpan,
                SP.supported() ? SP.audioButton(ex.text, dir === 'fwd' ? langForCard(card, 'from') : langForCard(card, 'to'), { small: true, target: exSpan }) : null,
                ex.translation ? h('span', { class: 'qcard__example-trans', text: ex.translation }) : null
              );
            })
          )
        : null,
      card.notes ? h('div', { class: 'qcard__notes', text: card.notes }) : null,
      (card.tags && card.tags.length)
        ? h('div', { class: 'qcard__tags' }, card.tags.map(function (t) { return h('span', { class: 'tag', text: t }); }))
        : null
    );
  }

  /* --- Режим «Карточки» --- */

  function renderFlip(stage, footer, c) {
    var card = c.card;
    var wrap = h('div', { class: 'qcard' }, promptSide(card, c.dir));
    stage.appendChild(wrap);

    function reveal() {
      if (c.revealed) return;
      c.revealed = true;
      wrap.appendChild(answerSide(card, c.dir));
      wrap.classList.add('is-revealed');
      U.clear(footer);
      footer.appendChild(ratingRow(card, null));
      autoplayAnswer(card, c.dir);
    }

    if (!c.revealed) {
      footer.appendChild(h('button', { class: 'btn btn--primary btn--lg btn--wide', onclick: reveal },
        h('span', { text: 'Показать ответ' }),
        h('span', { class: 'kbd-hint', text: 'Пробел' })
      ));
      setPrimaryAction(reveal);
    } else {
      footer.appendChild(ratingRow(card, null));
    }
    if (S.settings().ttsAutoPlay && !c.revealed) autoplayQuestion(card, c.dir);
  }

  /* --- Режим «Выбор варианта» --- */

  function renderChoice(stage, footer, c) {
    var card = c.card;
    var correctText = c.dir === 'fwd' ? card.translation : card.word;
    var options = buildOptions(card, c.dir);
    var wrap = h('div', { class: 'qcard' }, promptSide(card, c.dir));
    var grid = h('div', { class: 'choices' });
    var locked = false;

    options.forEach(function (opt) {
      var btn = h('button', { class: 'choice' },
        h('span', { class: 'choice__key', text: String(options.indexOf(opt) + 1) }),
        h('span', { class: 'choice__text', text: opt })
      );
      btn.addEventListener('click', function () {
        if (locked) return;
        locked = true;
        var isCorrect = U.normalize(opt) === U.normalize(correctText);
        U.qsa('.choice', grid).forEach(function (b) {
          var t = b.querySelector('.choice__text').textContent;
          if (U.normalize(t) === U.normalize(correctText)) b.classList.add('is-correct');
          else if (b === btn) b.classList.add('is-wrong');
          b.classList.add('is-locked');
        });
        c.revealed = true;
        wrap.appendChild(answerSide(card, c.dir));
        U.clear(footer);
        footer.appendChild(h('button', {
          class: 'btn btn--primary btn--lg btn--wide',
          onclick: function () { commit(isCorrect ? SRS.GRADES.GOOD : SRS.GRADES.AGAIN, isCorrect); }
        }, h('span', { text: 'Далее' }), h('span', { class: 'kbd-hint', text: 'Пробел' })));
        setPrimaryAction(function () { commit(isCorrect ? SRS.GRADES.GOOD : SRS.GRADES.AGAIN, isCorrect); });
        updateProgress();
      });
      grid.appendChild(btn);
    });

    wrap.appendChild(grid);
    stage.appendChild(wrap);
    if (S.settings().ttsAutoPlay) autoplayQuestion(card, c.dir);
  }

  function buildOptions(card, dir) {
    var correctText = dir === 'fwd' ? card.translation : card.word;
    var pool = S.allCards(session.deckIds.length ? session.deckIds : null);
    var seen = {};
    seen[U.normalize(correctText)] = true;
    var distractors = [];
    // сначала — карточки той же колоды
    var sameDeck = pool.filter(function (x) { return x.deckId === card.deckId; });
    var others = pool.filter(function (x) { return x.deckId !== card.deckId; });
    [sameDeck, others].forEach(function (list) {
      var shuffled = shuffle(list.slice());
      shuffled.forEach(function (x) {
        var t = dir === 'fwd' ? x.translation : x.word;
        if (!t) return;
        var k = U.normalize(t);
        if (seen[k]) return;
        seen[k] = true;
        distractors.push(t);
      });
    });
    distractors = distractors.slice(0, 3);
    var opts = [correctText].concat(distractors);
    shuffle(opts);
    return opts;
  }

  /* --- Режим «Ввод перевода» --- */

  function renderTyping(stage, footer, c) {
    var card = c.card;
    var expected = c.dir === 'fwd' ? card.translation : card.word;
    var input = h('input', {
      class: 'input input--answer', type: 'text', autocomplete: 'off', autocapitalize: 'off',
      spellcheck: 'false', placeholder: 'Введите ответ и нажмите Enter', 'aria-label': 'Ответ'
    });
    var wrap = h('div', { class: 'qcard' }, promptSide(card, c.dir),
      h('div', { class: 'typing' }, input)
    );
    var locked = false;

    function check() {
      if (locked) return;
      var value = input.value.trim();
      if (!value) { U.toast('Введите ответ', 'warn', 1500); return; }
      locked = true;
      var ok = U.normalize(value) === U.normalize(expected);
      var near = !ok && U.levenshtein(U.normalize(value), U.normalize(expected)) <= (U.normalize(expected).length > 6 ? 2 : 1);
      var grade = ok ? SRS.GRADES.GOOD : near ? SRS.GRADES.HARD : SRS.GRADES.AGAIN;

      input.disabled = true;
      input.classList.add(ok ? 'is-ok' : near ? 'is-near' : 'is-bad');
      wrap.appendChild(h('div', { class: 'typing__result typing__result--' + (ok ? 'ok' : near ? 'near' : 'bad') },
        h('div', { class: 'typing__verdict' },
          icon(ok ? 'check' : near ? 'info' : 'close', 17),
          h('span', { text: ok ? 'Верно!' : near ? 'Почти — есть опечатка' : 'Неверно' })
        ),
        h('div', { class: 'typing__diff', html: ok ? U.esc(value) : U.diffHtml(value, expected) })
      ));
      wrap.appendChild(answerSide(card, c.dir));
      U.clear(footer);
      footer.appendChild(ratingRow(card, grade));
      updateProgress();
    }

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); check(); }
    });
    setTimeout(function () { input.focus(); }, 60);
    setPrimaryAction(check);
    stage.appendChild(wrap);
  }

  /* --- Режим «Аудирование» --- */

  function renderListening(stage, footer, c) {
    var card = c.card;
    var dir = c.dir;
    var spoken = dir === 'fwd' ? card.word : card.translation;
    var spokenLang = dir === 'fwd' ? langForCard(card, 'from') : langForCard(card, 'to');
    var correctText = dir === 'fwd' ? card.translation : card.word;
    var options = buildOptions(card, dir);
    var locked = false;

    var playBtn = h('button', { class: 'audio-hero' },
      h('span', { class: 'audio-hero__ring' }),
      icon('sound', 34),
      h('span', { class: 'audio-hero__hint', text: 'Нажмите, чтобы прослушать' })
    );
    function play(rate) {
      playBtn.classList.add('is-playing');
      var done = function () { playBtn.classList.remove('is-playing'); };
      /* Тот же путь, что у 🔊: сначала готовый файл, иначе системный голос.
         Раньше аудирование всегда говорило системой — и в режиме, который
         целиком построен на звуке, это слышнее всего. */
      if (typeof SP.speakBest === 'function') {
        SP.speakBest(spoken, spokenLang, { rate: rate || S.settings().ttsRate, onend: done });
      } else {
        SP.speak(spoken, spokenLang, { rate: rate || S.settings().ttsRate, onend: done });
      }
      // страховка: если ни файл, ни синтез не сказали «конец», кнопка не должна вечно «играть»
      setTimeout(done, 8000);
    }
    playBtn.addEventListener('click', function () { play(); });

    var grid = h('div', { class: 'choices choices--audio' });
    options.forEach(function (opt, i) {
      var btn = h('button', { class: 'choice' },
        h('span', { class: 'choice__key', text: String(i + 1) }),
        h('span', { class: 'choice__text', text: opt })
      );
      btn.addEventListener('click', function () {
        if (locked) return;
        locked = true;
        var isCorrect = U.normalize(opt) === U.normalize(correctText);
        U.qsa('.choice', grid).forEach(function (b) {
          var t = b.querySelector('.choice__text').textContent;
          if (U.normalize(t) === U.normalize(correctText)) b.classList.add('is-correct');
          else if (b === btn) b.classList.add('is-wrong');
          b.classList.add('is-locked');
        });
        wrap.appendChild(answerSide(card, dir));
        U.clear(footer);
        footer.appendChild(h('button', {
          class: 'btn btn--primary btn--lg btn--wide',
          onclick: function () { commit(isCorrect ? SRS.GRADES.GOOD : SRS.GRADES.AGAIN, isCorrect); }
        }, h('span', { text: 'Далее' }), h('span', { class: 'kbd-hint', text: 'Пробел' })));
        setPrimaryAction(function () { commit(isCorrect ? SRS.GRADES.GOOD : SRS.GRADES.AGAIN, isCorrect); });
        updateProgress();
      });
      grid.appendChild(btn);
    });

    var controls = h('div', { class: 'audio-controls' },
      playBtn,
      h('div', { class: 'audio-controls__row' },
        h('button', { class: 'btn btn--ghost btn--sm', onclick: function () { play(0.6); } }, icon('refresh', 15), h('span', { text: 'Медленно' })),
        h('button', { class: 'btn btn--ghost btn--sm', onclick: function () { play(1.05); } }, icon('sound', 15), h('span', { text: 'Обычно' }))
      )
    );

    var wrap = h('div', { class: 'qcard' },
      h('div', { class: 'qcard__prompt qcard__prompt--audio' },
        h('div', { class: 'qcard__label', text: 'Прослушайте и выберите перевод' }),
        controls
      ),
      grid
    );
    stage.appendChild(wrap);
    if (S.settings().ttsAutoPlay) setTimeout(function () { play(); }, 320);
  }

  /* ---------- Ряд кнопок оценки ---------- */

  function ratingRow(card, suggested) {
    var deck = S.getDeck(card.deckId);
    var settings = SRS.sanitizeSettings(deck ? deck.settings : SRS.DEFAULT_SETTINGS);
    var previews = session.applySrs ? SRS.preview(card, settings, Date.now()) : null;
    var row = h('div', { class: 'rating-row' });
    [1, 2, 3, 4].forEach(function (g) {
      var btn = h('button', {
        class: 'rate rate--' + g + (suggested === g ? ' is-suggested' : ''),
        onclick: function () { commit(g, g >= 3); }
      },
        h('span', { class: 'rate__label', text: SRS.GRADE_LABELS[g] }),
        h('span', { class: 'rate__interval', text: previews ? previews[g] : (session.test ? '—' : '') }),
        h('span', { class: 'rate__key', text: SRS.GRADE_HOTKEYS[g] })
      );
      row.appendChild(btn);
    });
    return row;
  }

  /**
   * Озвучить фразу ровно тем же путём, что и кнопка 🔊: сначала файл
   * (свой пакет → кэш → сеть), а если не вышло — системный голос.
   *
   * Раньше автовоспроизведение шло напрямую в App.speech.speak и потому
   * всегда звучало системным голосом — тем самым роботом, от которого
   * человек как раз и ушёл к сетевой озвучке. Путь обязан быть один,
   * иначе карточка «сама» говорит хуже, чем по кнопке.
   *
   * Подсветка слов при файле не работает: у MP3 нет события onboundary.
   */
  function speakAuto(text, lang, highlightEl) {
    if (typeof SP.speakBest === 'function') {
      SP.speakBest(text, lang, { rate: S.settings().ttsRate, highlight: highlightEl });
      return;
    }
    SP.speak(text, lang, { rate: S.settings().ttsRate, highlight: highlightEl });
  }

  var autoTimer = 0;   // ждущий автопрогон вопроса

  function autoplayQuestion(card, dir) {
    if (!SP.supported() || !card.word) return;
    /* Экран иногда отрисовывается дважды подряд (смена hash и перерисовка
       сессии), и без clearTimeout фраза стартовала два раза одновременно:
       второй файл перебивал первый, тот считался провалом, и приложение
       падало обратно на системный голос — ровно тот робот, от которого
       человек ушёл к сетевой озвучке. Ждущий прогон всегда один. */
    if (autoTimer) clearTimeout(autoTimer);
    autoTimer = setTimeout(function () {
      autoTimer = 0;
      if (!session || !session.current || session.current.card.id !== card.id) return;
      speakAuto(dir === 'fwd' ? card.word : card.translation,
        dir === 'fwd' ? langForCard(card, 'from') : langForCard(card, 'to'),
        U.qs('.qcard__word-text'));
    }, 260);
  }

  function autoplayAnswer(card, dir) {
    if (!SP.supported() || !S.settings().ttsAutoPlay) return;
    var text = dir === 'fwd' ? card.word : card.translation;
    speakAuto(text, dir === 'fwd' ? langForCard(card, 'from') : langForCard(card, 'to'),
      U.qs('.qcard__answer-text'));
  }

  /* ---------- Обработка ответа ---------- */

  function commit(grade, correct) {
    if (!session || !session.current) return;
    var c = session.current;
    var card = c.card;
    var now = Date.now();
    var deck = S.getDeck(card.deckId);
    var settings = SRS.sanitizeSettings(deck ? deck.settings : SRS.DEFAULT_SETTINGS);
    var prevSrs = JSON.parse(JSON.stringify(card.srs));
    var result = SRS.answer(card, grade, settings, now);
    var logEntry = null;

    if (session.applySrs) {
      card.srs = result.srs;
      logEntry = S.addLog({
        cardId: card.id, deckId: card.deckId, ts: now, grade: grade,
        mode: c.mode, dir: c.dir, correct: !!correct,
        ms: now - session.cardStartTs,
        stateFrom: result.stateFrom, stateTo: result.stateTo, test: false
      });
      S.save();
      session.undoStack.push({
        cardId: card.id, prevSrs: prevSrs, logId: logEntry.id,
        item: c.item, wasInLearn: result.stateTo === 'learning' || result.stateTo === 'relearning',
        due: result.srs.due, grade: grade
      });
      if (result.leech) U.toast('Карточка помечена как трудная', 'warn', 2000);
    } else {
      logEntry = S.addLog({
        cardId: card.id, deckId: card.deckId, ts: now, grade: grade,
        mode: c.mode, dir: c.dir, correct: !!correct,
        ms: now - session.cardStartTs, stateFrom: 'test', stateTo: 'test', test: true
      });
      S.save();
      session.undoStack.push({ cardId: card.id, prevSrs: prevSrs, logId: logEntry.id, item: c.item, test: true, grade: grade });
    }

    session.answered++;
    if (correct) session.correct++;
    if (!correct) session.mistakes.push({ card: card, mode: c.mode, dir: c.dir });
    session.history.push(card.id);

    // возврат в очередь, если карточка ещё учится
    if (session.applySrs) {
      if (result.stateTo === 'learning' || result.stateTo === 'relearning') {
        session.learn.push({ card: card, kind: 'learn', due: result.srs.due });
        session.learn.sort(function (a, b) { return a.due - b.due; });
      }
    }

    session.current = null;
    next();
  }

  function undo() {
    if (!session || !session.undoStack.length) return;
    var last = session.undoStack.pop();
    var card = S.getCard(last.cardId);
    if (!card) { next(); return; }
    card.srs = last.prevSrs;
    if (last.logId) S.removeLog(last.logId);
    S.save();
    session.answered = Math.max(0, session.answered - 1);
    if (last.grade >= 3) session.correct = Math.max(0, session.correct - 1);
    if (session.history.length) session.history.pop();
    if (session.mistakes.length && last.grade < 3) session.mistakes.pop();

    session.learn = session.learn.filter(function (i) { return i.card.id !== last.cardId; });

    // карточка, которая сейчас на экране, возвращается в очередь
    if (session.current && session.current.item && session.current.item.card.id !== last.cardId) {
      session.main.unshift(session.current.item);
    }
    // отменённая карточка показывается снова — первой
    if (last.item) session.main.unshift(last.item);

    U.toast('Ответ отменён', 'info', 1600);
    session.current = null;
    next();
  }

  /* ---------- Ожидание карточек обучения ---------- */

  function showInterstitial() {
    var stage = U.qs('#stage');
    var footer = U.qs('#study-footer');
    if (!stage || !footer) return;
    var item = session.learn[0];
    var now = Date.now();
    var wait = Math.max(0, item.due - now);

    U.clear(stage); U.clear(footer);
    var timerEl = h('b', { class: 'inter__timer', text: U.fmtInterval(Math.max(wait, 1000)) });
    var box = h('div', { class: 'inter' },
      h('div', { class: 'inter__icon' }, icon('clock', 30)),
      h('h2', { class: 'inter__title', text: 'Карточки в обучении' }),
      h('p', { class: 'inter__text' }, 'Осталось ' + session.learn.length + ' ' +
        U.plural(session.learn.length, 'карточка', 'карточки', 'карточек') + '. Следующая будет доступна через ', timerEl),
      h('div', { class: 'inter__actions' },
        h('button', { class: 'btn btn--primary', onclick: function () { forceNext(); } }, icon('play', 17), h('span', { text: 'Показать сейчас' })),
        h('button', { class: 'btn btn--ghost', onclick: function () { finish(); } }, h('span', { text: 'Завершить сессию' }))
      )
    );
    stage.appendChild(box);

    var tick = setInterval(function () {
      if (!session || session.current || !document.body.contains(box)) { clearInterval(tick); return; }
      var left = item.due - Date.now();
      if (left <= 0) { clearInterval(tick); next(); return; }
      timerEl.textContent = U.fmtInterval(left);
    }, 500);
    session._interTimer = tick;
  }

  function forceNext() {
    if (session._interTimer) clearInterval(session._interTimer);
    var item = session.learn.shift();
    if (!item) { finish(); return; }
    var mode = session.mode === 'mixed' ? pickMixedMode(item.card) : session.mode;
    session.current = { item: item, card: item.card, mode: mode, dir: resolveDir(), revealed: false };
    session.cardStartTs = Date.now();
    renderCard();
    updateProgress();
  }

  /* ---------- Завершение ---------- */

  function finish() {
    if (!session) return;
    if (session._interTimer) clearInterval(session._interTimer);
    session.finished = true;
    SP.stop();
    var stage = U.qs('#stage');
    var footer = U.qs('#study-footer');
    if (!stage) { App.router.refresh(); return; }
    U.clear(stage); U.clear(footer);

    var answered = session.answered;
    var accuracy = answered ? Math.round(session.correct / answered * 100) : 0;
    var elapsed = Date.now() - session.startedAt;
    var remaining = countRemaining();

    var statRow = h('div', { class: 'result-stats' },
      resultStat('Повторено', String(answered)),
      resultStat('Верно', accuracy + '%'),
      resultStat('Время', U.fmtDuration(elapsed)),
      resultStat('В минуту', answered ? U.round1(answered / Math.max(elapsed / 60000, 0.05)) : '0')
    );

    var body = [h('div', { class: 'result' },
      h('div', { class: 'result__icon' + (session.test ? ' result__icon--test' : '') },
        icon(session.test ? 'trophy' : 'sparkle', 34)),
      h('h2', { class: 'result__title', text: session.test ? 'Тест завершён' : 'Сессия завершена' }),
      h('p', { class: 'result__sub', text: session.test
        ? 'Результат: ' + session.correct + ' из ' + answered + ' верных ответов'
        : (answered ? 'Отличная работа! Продолжайте в том же темпе.' : 'Сегодня нечего повторять — возвращайтесь позже.') }),
      statRow
    )];

    if (session.test && session.mistakes.length) {
      body.push(h('div', { class: 'panel' },
        h('div', { class: 'panel__head' }, h('h3', { class: 'panel__title', text: 'Ошибки (' + session.mistakes.length + ')' })),
        h('div', { class: 'mistake-list' },
          session.mistakes.slice(0, 30).map(function (m) {
            return h('div', { class: 'mistake' },
              h('b', { text: m.card.word }),
              h('span', { class: 'mistake__trans', text: m.card.translation })
            );
          })
        )
      ));
    }

    var actions = h('div', { class: 'result__actions' });
    if (session.test) {
      if (session.mistakes.length) {
        actions.appendChild(h('button', {
          class: 'btn btn--primary btn--lg',
          onclick: function () { retryMistakes(); }
        }, icon('refresh', 17), h('span', { text: 'Повторить ошибки (' + session.mistakes.length + ')' })));
      }
      actions.appendChild(h('button', {
        class: 'btn btn--ghost btn--lg',
        onclick: function () {
          var ids = session.deckIds;
          session = null;
          App.router.go('#/test/' + (ids.length === 1 ? ids[0] : 'all'));
        }
      }, h('span', { text: 'Пройти заново' })));
    } else if (remaining.total > 0) {
      actions.appendChild(h('button', {
        class: 'btn btn--primary btn--lg',
        onclick: function () { continueSession(); }
      }, icon('play', 17), h('span', { text: 'Продолжить (' + remaining.total + ')' })));
    }
    actions.appendChild(h('button', {
      class: 'btn btn--ghost btn--lg',
      onclick: function () {
        var ids = session.deckIds;
        session = null;
        App.router.go(ids.length === 1 ? '#/deck/' + ids[0] : '#/decks');
      }
    }, h('span', { text: 'К колоде' })));
    actions.appendChild(h('button', {
      class: 'btn btn--ghost btn--lg',
      onclick: function () { session = null; App.router.go('#/stats'); }
    }, icon('chart', 17), h('span', { text: 'Статистика' })));

    body.push(actions);
    U.append(stage, body);
    updateProgress();
    var label = U.qs('#study-label');
    if (label) label.textContent = 'Итоги';
    var bar = U.qs('#study-progress');
    if (bar) bar.style.width = '100%';
  }

  function resultStat(label, value) {
    return h('div', { class: 'result-stat' }, h('b', { text: value }), h('span', { text: label }));
  }

  function countRemaining() {
    var now = Date.now();
    var ids = session ? session.deckIds : [];
    var cards = S.allCards(ids).filter(function (c) { return !c.suspended; });
    var due = cards.filter(function (c) { return !SRS.isNew(c) && c.srs.due <= now; }).length;
    return { total: due, due: due };
  }

  function continueSession() {
    var ids = session.deckIds;
    var cfg = { mode: session.mode, dir: session.dir, useLimits: true, shuffle: false, limit: 0 };
    var more = buildQueue(ids, { ignoreLimits: false, shuffleMain: false, limit: 0 });
    session.learn = session.learn.concat(more.learn);
    session.main = session.main.concat(more.main);
    session.finished = false;
    renderSession();
  }

  function retryMistakes() {
    var cards = session.mistakes.map(function (m) { return m.card; }).filter(function (c) { return S.getCard(c.id); });
    var ids = session.deckIds;
    var mode = session.mode === 'mixed' ? 'choice' : session.mode;
    session = {
      deckIds: ids, mode: mode, dir: session.dir, applySrs: false, test: true,
      learn: [], main: cards.map(function (c) { return { card: c, kind: 'test', due: 0 }; }),
      initialCounts: { new: 0, learning: 0, due: 0 }, current: null, cardStartTs: 0,
      startedAt: Date.now(), answered: 0, correct: 0, totalPlanned: cards.length,
      history: [], undoStack: [], mistakes: [], finished: false, interstitial: null
    };
    App.router.go('#/test/' + (ids.length === 1 ? ids[0] : 'all') + '/run');
    renderSession();
  }

  function exitSession() {
    if (!session) { App.router.go('#/decks'); return; }
    var answered = session.answered;
    var ids = session.deckIds;
    function leave() {
      session = null;
      SP.stop();
      App.router.go(ids.length === 1 ? '#/deck/' + ids[0] : '#/decks');
    }
    if (!answered) { leave(); return; }
    U.confirmDialog('Выйти из тренировки?', 'Прогресс по отвеченным карточкам уже сохранён.', 'Выйти')
      .then(function (ok) { if (ok) leave(); });
  }

  /** Тихий сброс сессии при переходе на другой экран (без диалогов). */
  function discardSession() {
    if (!session) return;
    if (session._interTimer) clearInterval(session._interTimer);
    SP.stop();
    session = null;
  }

  /* ---------- Клавиатура ---------- */

  function setPrimaryAction(fn) {
    App.router.setPrimary(fn);
  }

  function bindKeyboard() {
    if (App._studyKeysBound) return;
    App._studyKeysBound = true;
    document.addEventListener('keydown', function (e) {
      if (!session || session.finished) return;
      if (!S.settings().keyboardShortcuts) return;
      var tag = (e.target.tagName || '').toLowerCase();
      var typingInField = tag === 'input' || tag === 'textarea' || tag === 'select';
      if (e.key === 'Escape') { return; }
      if (typingInField) return;

      if (e.key === ' ' || e.key === 'Enter') {
        if (session.current && !session.current.revealed && session.current.mode !== 'flip') {
          e.preventDefault();
          var primary = U.qs('#study-footer .btn--primary');
          if (primary) primary.click();
          return;
        }
        e.preventDefault();
        var primary2 = U.qs('#study-footer .btn--primary');
        if (primary2) primary2.click();
        return;
      }
      if (/^[1-4]$/.test(e.key)) {
        var rates = U.qsa('.rate');
        if (rates.length) { e.preventDefault(); rates[Number(e.key) - 1].click(); return; }
        var choices = U.qsa('.choice');
        if (choices.length && Number(e.key) <= choices.length) { e.preventDefault(); choices[Number(e.key) - 1].click(); }
        return;
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
      if (e.key === 'r' && SP.supported() && session.current) {
        var card = session.current.card;
        var dir = session.current.dir;
        var say = typeof SP.speakBest === 'function' ? SP.speakBest : SP.speak;
        say(dir === 'fwd' ? card.word : card.translation,
          dir === 'fwd' ? langForCard(card, 'from') : langForCard(card, 'to'), { rate: S.settings().ttsRate });
      }
    });
  }

  /* ============================================================
     Экран теста
     ============================================================ */

  function renderTest(root, params) {
    bindKeyboard();
    if (params.sub === 'run' && session && session.test) { renderSession(); return; }

    var deckIds = params.id && params.id !== 'all' ? [params.id] : S.get().decks.map(function (d) { return d.id; });
    var deck = params.id && params.id !== 'all' ? S.getDeck(params.id) : null;
    var available = S.allCards(deckIds).filter(function (c) { return c.word && c.translation && !c.suspended; }).length;

    if (!available) {
      U.clear(root);
      root.appendChild(h('div', { class: 'page' },
        V.decks.emptyState('cards', 'Нет слов для теста', 'Добавьте слова в колоду, чтобы пройти тест.',
          h('button', { class: 'btn btn--primary', onclick: function () { App.router.go(deck ? '#/deck/' + deck.id : '#/decks'); } }, h('span', { text: 'К колоде' })))));
      return;
    }

    var cfg = renderTest._cfg || (renderTest._cfg = { mode: 'choice', count: Math.min(20, available), dir: 'fwd' });
    if (cfg.count > available) cfg.count = available;

    var head = h('div', { class: 'page-head' },
      h('div', { class: 'page-head__main' },
        h('button', { class: 'icon-btn', 'aria-label': 'Назад', onclick: function () { App.router.go(deck ? '#/deck/' + deck.id : '#/decks'); } }, icon('back', 20)),
        h('div', {},
          h('h1', { class: 'page-title', text: 'Тест' + (deck ? ': ' + deck.name : ' по всем колодам') }),
          h('p', { class: 'page-sub', text: 'Проверка знаний без влияния на интервалы повторения' })
        )
      )
    );

    var modeRow = h('div', { class: 'mode-grid mode-grid--compact' });
    MODES.filter(function (m) { return m.id !== 'flip'; }).forEach(function (m) {
      if (m.id === 'listening' && !SP.supported()) return;
      modeRow.appendChild(h('button', {
        class: 'mode-card' + (cfg.mode === m.id ? ' is-active' : ''),
        onclick: function () {
          cfg.mode = m.id;
          U.qsa('.mode-card', modeRow).forEach(function (c) { c.classList.remove('is-active'); });
          this.classList.add('is-active');
        }
      }, h('span', { class: 'mode-card__icon' }, icon(m.icon, 18)), h('b', { text: m.label })));
    });

    var countInput = h('input', {
      class: 'input', type: 'number', min: 5, max: available, value: cfg.count,
      onchange: function () { cfg.count = Math.max(1, Math.min(available, Number(this.value) || 10)); }
    });

    var dirRow = h('div', { class: 'chips' });
    DIRS.forEach(function (d) {
      dirRow.appendChild(h('button', {
        class: 'chip' + (cfg.dir === d.id ? ' is-active' : ''),
        onclick: function () {
          cfg.dir = d.id;
          U.qsa('.chip', dirRow).forEach(function (c) { c.classList.remove('is-active'); });
          this.classList.add('is-active');
        }
      }, h('span', { text: d.label })));
    });

    var panel = h('div', { class: 'panel panel--wide' },
      h('div', { class: 'panel__head' }, h('h2', { class: 'panel__title', text: 'Параметры теста' })),
      modeRow,
      h('div', { class: 'panel__section' }, h('span', { class: 'field__label', text: 'Направление' }), dirRow),
      h('div', { class: 'panel__section panel__section--row' },
        h('label', { class: 'switch-row switch-row--num' }, h('span', { text: 'Количество вопросов' }), countInput),
        h('span', { class: 'muted small', text: 'Доступно слов: ' + available })
      ),
      h('div', { class: 'panel__foot' },
        h('button', {
          class: 'btn btn--primary btn--lg',
          onclick: function () {
            var mode = cfg.mode === 'mixed' ? 'mixed' : cfg.mode;
            startSession(deckIds, { mode: mode, dir: cfg.dir, count: cfg.count, useLimits: false, limit: 0 }, true);
          }
        }, icon('target', 18), h('span', { text: 'Начать тест' }))
      )
    );

    U.clear(root);
    U.append(root, [h('div', { class: 'page' }, head, panel)]);
  }

  /* ============================================================
     Публичный API
     ============================================================ */

  V.study = {
    render: function (root, params) { bindKeyboard(); if (params.sub === 'run' && session && !session.test) { renderSession(); return; } renderStudy(root, params); },
    renderTest: renderTest,
    renderSession: renderSession,
    hasSession: function () { return !!session; },
    activeSession: function () { return session; },
    exit: exitSession,
    discard: discardSession,
    MODES: MODES,
    DIRS: DIRS,
    modeMeta: modeMeta
  };
})(window);

// ===== js/views/stats.js =====
/* ============================================================
   LexiFlow — views/stats.js
   Статистика обучения: активность, серия дней, точность,
   тепловая карта, прогноз повторений, распределение карточек.
   Графики — собственный SVG без внешних библиотек (офлайн).
   ============================================================ */
(function (global) {
  'use strict';
  var App = (global.App = global.App || {});
  var U = App.util, S = App.store, SRS = App.srs;
  var h = U.h, icon = U.icon;
  var V = (App.views = App.views || {});
  var SVGNS = 'http://www.w3.org/2000/svg';

  function svg(tag, attrs) {
    var node = document.createElementNS(SVGNS, tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (attrs[k] === null || attrs[k] === undefined) return;
      node.setAttribute(k, attrs[k]);
    });
    return node;
  }

  /* ---------- Графики ---------- */

  function barChart(days, opts) {
    opts = opts || {};
    var W = 680, Hgt = 200, padL = 36, padR = 10, padT = 14, padB = 26;
    var plotW = W - padL - padR, plotH = Hgt - padT - padB;
    var max = Math.max.apply(null, days.map(function (d) { return d.total; }).concat([5]));
    var step = plotW / days.length;
    var barW = Math.max(4, step * 0.62);

    var root = svg('svg', { viewBox: '0 0 ' + W + ' ' + Hgt, class: 'chart', role: 'img', 'aria-label': 'Активность повторений' });

    // сетка
    [0, 0.5, 1].forEach(function (t) {
      var y = padT + plotH * (1 - t);
      root.appendChild(svg('line', { x1: padL, x2: W - padR, y1: y, y2: y, class: 'chart__grid' }));
      var label = svg('text', { x: padL - 8, y: y + 4, class: 'chart__axis', 'text-anchor': 'end' });
      label.textContent = String(Math.round(max * t));
      root.appendChild(label);
    });

    days.forEach(function (d, i) {
      var x = padL + i * step + (step - barW) / 2;
      var totalH = d.total ? Math.max(2, plotH * (d.total / max)) : 0;
      if (totalH) {
        root.appendChild(svg('rect', {
          x: x, y: padT + plotH - totalH, width: barW, height: totalH, rx: Math.min(3, barW / 2),
          class: 'chart__bar'
        }));
      }
      if (d.fresh) {
        var freshH = Math.max(2, plotH * (d.fresh / max));
        root.appendChild(svg('rect', {
          x: x, y: padT + plotH - freshH, width: barW, height: Math.min(freshH, totalH || freshH),
          rx: Math.min(3, barW / 2), class: 'chart__bar chart__bar--fresh'
        }));
      }
      if (d.total) {
        var title = svg('title');
        title.textContent = d.label + ': ' + d.total + ' повторений' + (d.fresh ? ' (' + d.fresh + ' новых)' : '');
        var hit = svg('rect', { x: padL + i * step, y: padT, width: step, height: plotH, class: 'chart__hit' });
        hit.appendChild(title);
        root.appendChild(hit);
      }
      if (i % 5 === 0 || i === days.length - 1) {
        var t = svg('text', { x: padL + i * step + step / 2, y: Hgt - 8, class: 'chart__axis', 'text-anchor': 'middle' });
        t.textContent = d.short;
        root.appendChild(t);
      }
    });
    return root;
  }

  function forecastChart(days) {
    var W = 680, Hgt = 170, padL = 34, padR = 10, padT = 14, padB = 26;
    var plotW = W - padL - padR, plotH = Hgt - padT - padB;
    var max = Math.max.apply(null, days.map(function (d) { return d.value; }).concat([3]));
    var step = plotW / days.length;
    var barW = Math.max(6, step * 0.6);
    var root = svg('svg', { viewBox: '0 0 ' + W + ' ' + Hgt, class: 'chart', role: 'img', 'aria-label': 'Прогноз повторений' });
    [0, 1].forEach(function (t) {
      var y = padT + plotH * (1 - t);
      root.appendChild(svg('line', { x1: padL, x2: W - padR, y1: y, y2: y, class: 'chart__grid' }));
      var label = svg('text', { x: padL - 8, y: y + 4, class: 'chart__axis', 'text-anchor': 'end' });
      label.textContent = String(Math.round(max * t));
      root.appendChild(label);
    });
    days.forEach(function (d, i) {
      var x = padL + i * step + (step - barW) / 2;
      var barH = d.value ? Math.max(2, plotH * (d.value / max)) : 0;
      if (barH) {
        root.appendChild(svg('rect', {
          x: x, y: padT + plotH - barH, width: barW, height: barH, rx: 3, class: 'chart__bar chart__bar--forecast'
        }));
      }
      var t = svg('text', { x: padL + i * step + step / 2, y: Hgt - 8, class: 'chart__axis', 'text-anchor': 'middle' });
      t.textContent = d.label;
      root.appendChild(t);
      if (d.value) {
        var v = svg('text', { x: padL + i * step + step / 2, y: padT + plotH - barH - 4, class: 'chart__value', 'text-anchor': 'middle' });
        v.textContent = String(d.value);
        root.appendChild(v);
      }
    });
    return root;
  }

  function donut(parts) {
    var size = 168, r = 60, cx = size / 2, cy = size / 2, stroke = 20;
    var circ = 2 * Math.PI * r;
    var total = parts.reduce(function (a, p) { return a + p.value; }, 0) || 1;
    var root = svg('svg', { viewBox: '0 0 ' + size + ' ' + size, class: 'donut', role: 'img', 'aria-label': 'Распределение карточек' });
    root.appendChild(svg('circle', { cx: cx, cy: cy, r: r, fill: 'none', class: 'donut__track', 'stroke-width': stroke }));
    var offset = 0;
    parts.forEach(function (p) {
      if (!p.value) return;
      var len = circ * (p.value / total);
      var arc = svg('circle', {
        cx: cx, cy: cy, r: r, fill: 'none', stroke: p.color, 'stroke-width': stroke,
        'stroke-dasharray': len + ' ' + (circ - len),
        'stroke-dashoffset': -offset,
        transform: 'rotate(-90 ' + cx + ' ' + cy + ')',
        'stroke-linecap': 'butt'
      });
      var title = svg('title');
      title.textContent = p.label + ': ' + p.value;
      arc.appendChild(title);
      root.appendChild(arc);
      offset += len;
    });
    var big = svg('text', { x: cx, y: cy + 2, class: 'donut__value', 'text-anchor': 'middle' });
    big.textContent = String(total);
    root.appendChild(big);
    var cap = svg('text', { x: cx, y: cy + 20, class: 'donut__label', 'text-anchor': 'middle' });
    cap.textContent = 'карточек';
    root.appendChild(cap);
    return root;
  }

  function heatmap(days) {
    // days: [{key, count, label}] — 26 недель, столбцы = недели
    var cell = 13, gap = 3, cols = Math.ceil(days.length / 7);
    var W = cols * (cell + gap) + 26, Hgt = 7 * (cell + gap) + 22;
    var root = svg('svg', { viewBox: '0 0 ' + W + ' ' + Hgt, class: 'heatmap', role: 'img', 'aria-label': 'Тепловая карта активности' });
    var levels = ['l0', 'l1', 'l2', 'l3', 'l4'];
    function levelOf(n) {
      if (!n) return 0;
      if (n < 8) return 1;
      if (n < 20) return 2;
      if (n < 40) return 3;
      return 4;
    }
    ['пн', 'ср', 'пт'].forEach(function (name, i) {
      var row = i * 2;
      var t = svg('text', { x: 0, y: 12 + row * (cell + gap) + cell - 2, class: 'chart__axis' });
      t.textContent = name;
      root.appendChild(t);
    });
    days.forEach(function (d, i) {
      var col = Math.floor(i / 7), row = i % 7;
      var rect = svg('rect', {
        x: 26 + col * (cell + gap), y: 12 + row * (cell + gap),
        width: cell, height: cell, rx: 3, class: 'heat heat--' + levels[levelOf(d.count)]
      });
      var title = svg('title');
      title.textContent = d.label + ': ' + d.count + ' ' + U.plural(d.count, 'повторение', 'повторения', 'повторений');
      rect.appendChild(title);
      root.appendChild(rect);
    });
    return root;
  }

  /* ---------- Агрегация данных ---------- */

  function buildStats(deckId) {
    var now = Date.now();
    var data = S.get();
    var logs = deckId ? data.logs.filter(function (l) { return l.deckId === deckId; }) : data.logs;
    var realLogs = logs.filter(function (l) { return !l.test; });

    var byDay = {};
    realLogs.forEach(function (l) {
      var k = U.dayKey(l.ts);
      if (!byDay[k]) byDay[k] = { total: 0, fresh: 0, correct: 0 };
      byDay[k].total++;
      if (l.stateFrom === 'new') byDay[k].fresh++;
      if (l.correct) byDay[k].correct++;
    });

    // активность за 30 дней
    var activity = [];
    for (var i = 29; i >= 0; i--) {
      var ts = U.startOfDay(now) - i * U.MS_DAY;
      var k = U.dayKey(ts);
      var d = byDay[k] || { total: 0, fresh: 0 };
      var date = new Date(ts);
      activity.push({
        key: k, total: d.total, fresh: d.fresh,
        label: date.getDate() + ' ' + U.MONTHS_SHORT[date.getMonth()],
        short: String(date.getDate())
      });
    }

    // тепловая карта 26 недель
    var heat = [];
    var totalDays = 26 * 7;
    var start = U.startOfDay(now) - (totalDays - 1) * U.MS_DAY;
    // выравниваем по понедельнику
    var startDow = (new Date(start).getDay() + 6) % 7;
    start -= startDow * U.MS_DAY;
    for (var j = 0; j < totalDays + startDow; j++) {
      var ts2 = start + j * U.MS_DAY;
      var k2 = U.dayKey(ts2);
      var rec = byDay[k2];
      var dt = new Date(ts2);
      heat.push({
        key: k2, count: rec ? rec.total : 0,
        label: dt.getDate() + ' ' + U.MONTHS_SHORT[dt.getMonth()] + ' ' + dt.getFullYear()
      });
    }
    // последняя колонка может быть неполной — это нормально для тепловой карты

    // прогноз на 14 дней
    var cards = deckId ? S.cardsOf(deckId) : data.cards;
    var forecast = [];
    var base = U.startOfDay(now);
    for (var f = 0; f < 14; f++) {
      var from = base + f * U.MS_DAY, to = from + U.MS_DAY;
      var cnt = cards.filter(function (c) {
        return c.srs && c.srs.state !== 'new' && !c.suspended && c.srs.due >= (f === 0 ? 0 : from) && c.srs.due < to;
      }).length;
      var d2 = new Date(from);
      forecast.push({ label: f === 0 ? 'сег' : String(d2.getDate()), value: cnt });
    }

    // распределение
    var states = { new: 0, learning: 0, review: 0 };
    var leeches = [];
    cards.forEach(function (c) {
      if (SRS.isNew(c)) states.new++;
      else if (SRS.isLearning(c)) states.learning++;
      else states.review++;
      if (c.srs && c.srs.leech) leeches.push(c);
    });

    var todayLogs = realLogs.filter(function (l) { return l.ts >= U.startOfDay(now); });
    var todayTime = todayLogs.reduce(function (a, l) { return a + (l.ms || 0); }, 0);
    var last30 = realLogs.filter(function (l) { return l.ts >= U.startOfDay(now) - 29 * U.MS_DAY; });
    var correct30 = last30.filter(function (l) { return l.correct; }).length;
    var accuracy = last30.length ? Math.round(correct30 / last30.length * 100) : 0;
    var totalTime = realLogs.reduce(function (a, l) { return a + (l.ms || 0); }, 0);

    return {
      activity: activity, heat: heat, forecast: forecast, states: states,
      leeches: leeches.sort(function (a, b) { return (b.srs.lapses || 0) - (a.srs.lapses || 0); }).slice(0, 20),
      todayCount: todayLogs.length, todayTime: todayTime, accuracy: accuracy,
      last30Count: last30.length, totalReviews: realLogs.length, totalTime: totalTime,
      streak: S.streak(now), cards: cards
    };
  }

          text: list.length ? 'Автоматически — лучший доступный' : 'Голоса для этого языка не найдены'
        }));
        list.forEach(function (v) {
          sel.appendChild(h('option', {
            value: v.voiceURI,
            text: v.name + (v.localService === false ? ' · онлайн' : '')
          }));
        });
        sel.value = pinned;
        sel.addEventListener('change', function () {
          var next = Object.assign({}, st.ttsVoice || {});
          if (this.value) next[lang] = this.value; else delete next[lang];
          st.ttsVoice = next;
          S.updateSettings({ ttsVoice: next });
          U.toast(this.value ? 'Голос закреплён' : 'Голос снова выбирается автоматически', 'ok', 2400);
        });

        var sample = sampleFor(lang);
        var effective = SP.resolveVoice(lang, pinned);
        var quality = SP.voiceQuality(effective, lang);
        return h('div', { class: 'setting-row' },
          h('div', { class: 'setting-row__text' },
            h('b', { text: SP.LANG_NAMES[lang] || lang.toUpperCase() }),
            h('span', { class: 'inline-row' },
              h('span', { class: 'quality-badge quality-badge--' + quality.level, text: quality.label }),
              h('span', { class: 'muted small', text: effective ? effective.name : 'голос не найден' })
            ),
            h('span', { class: 'muted small', text: list.length + ' ' + U.plural(list.length, 'голос', 'голоса', 'голосов') +
              ' · ' + quality.hint })
          ),
          h('div', { class: 'setting-row__control setting-row__control--stack' },
            sel,
            h('div', { class: 'inline-row' },
              h('button', {
                class: 'btn btn--ghost btn--sm',
                title: sample,
                /* Здесь НАМЕРЕННО системный голос, а не файл: кнопка отвечает
                   на вопрос «как звучит выбранный голос», и подменить её
                   файлом — значит обмануть человека. Настройки темпа, высоты
                   и громкости тоже действуют только на синтез. */
                onclick: function () { SP.speak(sample, lang, { rate: st.ttsRate, pitch: st.ttsPitch, volume: st.ttsVolume }); }
              }, icon('sound', 15), h('span', { text: 'Прослушать: ' + (sample.length > 42 ? sample.slice(0, 40).trim() + '…' : sample) }))
            )
          )
        );
      }

      /** Сводка: понятно, что за голос звучит и что делать, если он плохой. */
      function voiceDiagnostics(langs) {
        var all = SP.voices();
        var worst = SP.worstQuality(langs) || SP.voiceQuality(null, langs[0]);
        var browser = SP.browserName();

        var fix = null;
        if (worst.level === 'neural') {
          fix = 'Всё в порядке: браузер отдаёт нейросетевой голос.';
        } else if (browser === 'Edge') {
          fix = 'В Edge есть нейросетевые голоса Microsoft Natural — выберите голос с этим словом в названии в списке ниже.';
        } else if (browser === 'Chrome' || browser === 'Яндекс Браузер' || browser === 'Opera') {
          fix = 'Этот браузер берёт голоса из системы, и они звучат механически. Откройте приложение в Microsoft Edge — там те же нейросетевые голоса Microsoft Natural доступны бесплатно и без ключей.';
        } else if (browser === 'Firefox') {
          fix = 'Firefox в Windows читает только системные голоса. Откройте приложение в Microsoft Edge, чтобы получить нейросетевые голоса Microsoft Natural.';
        } else {
          fix = 'Откройте приложение в браузере с нейросетевыми голосами — например, в Microsoft Edge на компьютере или в Chrome на Android.';
        }

        return h('div', { class: 'voice-diag voice-diag--' + worst.level },
          h('div', { class: 'voice-diag__head' },
            icon('sound', 16),
            h('b', { text: worst.label }),
            h('span', { class: 'muted small', text: 'браузер: ' + browser + ' · голосов найдено: ' + all.length })
          ),
          h('p', { class: 'voice-diag__fix', text: fix })
        );
      }

      function fillVoiceRows() {
        U.clear(voiceRows);
        var langs = deckLanguages();
        if (!langs.length) {
          voiceRows.appendChild(h('p', { class: 'muted small', text: 'Создайте колоду — здесь появятся голоса для её языков.' }));
          return;
        }
        voiceRows.appendChild(voiceDiagnostics(langs));
        langs.forEach(function (l) { voiceRows.appendChild(voiceRow(l)); });
      }

      fillVoiceRows();
      // список голосов браузер отдаёт асинхронно — перерисовываем, когда он придёт
      var onVoicesChanged = function () {
        if (!document.body.contains(voiceRows)) {
          try { global.speechSynthesis.removeEventListener('voiceschanged', onVoicesChanged); } catch (e) { /* ignore */ }
          return;
        }
        fillVoiceRows();
      };
      try { global.speechSynthesis.addEventListener('voiceschanged', onVoicesChanged); } catch (e) { /* ignore */ }

      ttsPanel.querySelector('.panel__body').appendChild(
        h('div', { class: 'panel__section' },
          h('span', { class: 'field__label', text: 'Голоса' }),
          voiceRows,
          h('p', { class: 'muted small', text: 'Приложение не обращается к платным сервисам: оно использует голоса, которые уже есть в браузере. Голоса с пометкой Natural, Neural или Google звучат естественно, «Compact» — механически. Если голос помечен как «онлайн», в офлайне браузер вернётся к системному.' })
        )
      );
    }

    /* --- Качественная озвучка из интернета (js/ttsnet.js) ---
       Здесь человек сам решает отдать текст фраз на сторонний сервис.
       По умолчанию это выключено, поэтому панель начинается с честного
       предупреждения, а не с кнопки «Скачать». */
    var netSection = ttsNetSection(data);
    if (netSection) ttsPanel.querySelector('.panel__body').appendChild(netSection);

    /* --- Приложение и офлайн --- */
    var swStatus = h('span', { class: 'tag tag--muted', text: App.pwa.statusText() });
    var installBtn = h('button', { class: 'btn btn--primary', onclick: function () { App.pwa.promptInstall(); } },
      icon('install', 17), h('span', { text: 'Установить приложение' }));

    var appPanel = panel('Приложение', 'install',
      h('div', { class: 'setting-row' },
        h('div', { class: 'setting-row__text' },
          h('b', { text: 'Установка на устройство' }),
          h('span', { class: 'muted small', text: 'Добавьте LexiFlow на главный экран — приложение откроется без браузера и будет работать офлайн.' })
        ),
        App.pwa.canInstall() ? installBtn : h('span', { class: 'tag', text: App.pwa.isStandalone() ? 'Уже установлено' : 'Через меню браузера' })
      ),
      row('Офлайн-режим', swStatus),
      h('div', { class: 'setting-row' },
        h('div', { class: 'setting-row__text' },
          h('b', { text: 'Версия' }),
          h('span', { class: 'muted small', text: 'LexiFlow 1.0 · данные хранятся только на этом устройстве' })
        ),
        h('button', { class: 'btn btn--ghost btn--sm', onclick: function () { App.pwa.update(); } }, icon('refresh', 15), h('span', { text: 'Проверить обновления' }))
      )
    );

    /* --- Хранилище --- */
    var used = App.util.bytesOf(JSON.stringify(data));
    var quota = 5 * 1024 * 1024;
    var pct = Math.min(100, Math.round(used / quota * 100));
    var storagePanel = panel('Хранилище', 'layers',
      h('div', { class: 'storage' },
        h('div', { class: 'storage__row' },
          h('span', { text: 'Занято: ' + App.util.fmtBytes(used) + ' из ~5 МБ' }),
          h('b', { text: pct + '%' })
        ),
        h('div', { class: 'progress' }, h('div', { class: 'progress__bar', style: { width: pct + '%' } })),
        h('div', { class: 'storage__stats' },
          chip(String(data.decks.length), 'колод'),
          chip(String(data.cards.length), 'карточек'),
          chip(String(data.logs.length), 'записей журнала')
        )
      ),
      h('div', { class: 'inline-row' },
        h('button', { class: 'btn btn--ghost btn--sm', onclick: function () { App.router.go('#/data'); } }, icon('download', 15), h('span', { text: 'Импорт и экспорт' })),
        h('button', { class: 'btn btn--ghost btn--sm', onclick: function () { App.router.go('#/ai'); } }, icon('sparkle', 15), h('span', { text: 'Промпт для нейросети' })),
        h('button', { class: 'btn btn--danger btn--sm', onclick: wipeAll }, icon('trash', 15), h('span', { text: 'Удалить все данные' }))
      ),
      !S.isStorageOk() ? h('p', { class: 'warn-text', text: 'Внимание: браузер не смог сохранить данные. Освободите место и сделайте резервную копию.' }) : null
    );

    /* --- Синхронизация и напоминания ---
       Панели живут в своих модулях: у каждого своя логика и свои тесты.
       Здесь только подключаем их в общий экран настроек. */
    var syncPanel = (App.views.sync && App.views.sync.panel) ? App.views.sync.panel() : null;
    var notifyPanel = (App.views.notify && App.views.notify.panel) ? App.views.notify.panel() : null;

    var about = h('div', { class: 'about' },
      h('p', {}, 'LexiFlow — тренажёр иностранных слов с интервальным повторением. ',
        'Работает полностью на вашем устройстве: слова, прогресс и статистика не отправляются на серверы.'),
      h('p', { class: 'muted small', text: 'Совет: делайте экспорт резервной копии — данные хранятся в браузере и могут быть потеряны при очистке сайта.' })
    );

    U.clear(root);
    U.append(root, [h('div', { class: 'page page--narrow' }, head, appearance, training, ttsPanel, syncPanel, notifyPanel, appPanel, storagePanel, about)]);
  }

  /* ============================================================
     Качественная озвучка из интернета (js/ttsnet.js)
     ============================================================ */

  /**
   * Скачивание озвучки со стороннего сервиса в кэш браузера.
   *
   * Зачем это вообще: голос в систему из веб-страницы поставить нельзя —
   * в Web Speech API такого метода нет (проверено аудитором: у speechSynthesis
   * только speak/cancel/pause/resume/getVoices, у SpeechSynthesisVoice —
   * только чтение свойств, new SpeechSynthesisVoice() даёт TypeError).
   * А на проверенной машине для en/de/fr/es голосов в системе НОЛЬ.
   * Единственный доступный способ получить естественную речь — скачать
   * готовые файлы. Плата за это — текст фраз уходит на чужой сервер,
   * поэтому по умолчанию режим выключен.
   */
  function ttsNetSection(data) {
    var T = App.ttsnet;
    if (!T) return null;

    function netSettings() { return S.settings().ttsNet || { enabled: false, downloaded: 0 }; }

    function saveNet(patch) {
      var cur = netSettings();
      S.updateSettings({ ttsNet: {
        enabled: patch.enabled === undefined ? !!cur.enabled : !!patch.enabled,
        downloaded: patch.downloaded === undefined ? (cur.downloaded || 0) : patch.downloaded
      } });
    }

    var statusText = h('span', { class: 'muted small', text: 'Считаю скачанное…' });
    var barFill = h('div', { class: 'progress__bar', style: { width: '0%' } });
    var progressText = h('span', { class: 'muted small' });
    var progressWrap = h('div', { class: 'tts-net__progress', style: { display: 'none' } },
      progressText, h('div', { class: 'progress progress--sm' }, barFill));

    function setProgress(text, pct) {
      progressWrap.style.display = '';
      progressText.textContent = text;
      barFill.style.width = Math.max(0, Math.min(100, pct || 0)) + '%';
    }

    /**
     * Строка состояния. Число берётся из кэша, а не из настроек: настройки
     * синхронизируются между устройствами, а кэш у каждого свой, и число
     * из настроек показало бы на телефоне чужие фразы.
     */
    function refreshStats() {
      return T.stats().then(function (s) {
        statusText.textContent = s.count
          ? 'Фраз сохранено: ' + s.count + ', занимает ' + U.fmtBytes(s.bytes) + '.'
          : 'Пока ничего не скачано.';
        saveNet({ downloaded: s.bytes });
        return s;
      }).catch(function () {
        statusText.textContent = 'Не удалось прочитать кэш озвучки.';
        return { count: 0, bytes: 0 };
      });
    }

    /** Фразы колоды: слово и примеры — на её языке, перевод — на языке перевода. */
    function deckPhrases(deckId) {
      var deck = S.getDeck(deckId);
      if (!deck) return {};
      var byLang = {};
      function add(lang, text) {
        if (!lang || !text) return;
        var base = SP.baseLang(lang);
        if (!byLang[base]) byLang[base] = [];
        byLang[base].push(text);
      }
      S.cardsOf(deckId).forEach(function (c) {
        add(deck.langFrom, c.word);
        add(deck.langTo, c.translation);
        (c.examples || []).forEach(function (ex) { if (ex && ex.text) add(deck.langFrom, ex.text); });
      });
      return byLang;
    }

    var enabledInput = h('input', { type: 'checkbox', checked: !!netSettings().enabled });
    enabledInput.addEventListener('change', function () {
      saveNet({ enabled: enabledInput.checked });
      U.toast(enabledInput.checked
        ? 'Озвучка из интернета включена'
        : 'Озвучка из интернета выключена — остаётся системный голос', 'ok', 2800);
    });

    /**
     * Включение — это согласие отдать текст фраз на чужой сервер, поэтому
     * оно всегда через явный вопрос, а не «само собой» при нажатии кнопки.
     */
    function ensureEnabled() {
      if (netSettings().enabled) return Promise.resolve(true);
      return U.confirmDialog('Включить озвучку из интернета?',
        'Текст озвучиваемых фраз уйдёт на сторонний бесплатный сервис code.responsivevoice.org. ' +
        'Нужен интернет; скачанное потом работает без интернета. Сервис может отказать — тогда ' +
        'приложение вернётся к системному голосу.',
        'Включить').then(function (ok) {
          if (!ok) return false;
          saveNet({ enabled: true });
          enabledInput.checked = true;
          return true;
        });
    }

    var deckSel = h('select', { class: 'input' });
    data.decks.forEach(function (d) {
      deckSel.appendChild(h('option', { value: d.id, text: d.name }));
    });

    function downloadDeck() {
      var deckId = deckSel.value;
      if (!deckId) return;
      var byLang = deckPhrases(deckId);
      var langs = Object.keys(byLang);
      if (!langs.length) { setProgress('В этой колоде нечего озвучивать.', 0); return; }

      var total = 0;
      langs.forEach(function (l) { total += byLang[l].length; });
      var seen = 0, failed = 0;
      setProgress('Скачиваю: 0 из ' + total, 0);

      /* Языки по очереди: у preload свой предел параллелизма, складывать их
         нельзя — сервис чужой и бесплатный. */
      var chain = Promise.resolve();
      langs.forEach(function (lang) {
        chain = chain.then(function () {
          return T.preload(byLang[lang], lang, function (p) {
            var processed = seen + p.done + p.failed;
            setProgress('Скачиваю: ' + Math.min(processed, total) + ' из ' + total,
              total ? processed / total * 100 : 0);
          });
        }).then(function (res) {
          failed += res.failed;
          seen += res.done + res.failed;
          return res;
        });
      });

      chain.then(refreshStats).then(function (s) {
        if (!s.count) { setProgress('Не удалось: сервис озвучки недоступен. Остаётся системный голос.', 0); return; }
        setProgress(failed
          ? 'Готово частично: озвучено ' + s.count + ' фраз, ' + U.fmtBytes(s.bytes) + '. Часть фраз сервис не отдал.'
          : 'Готово: озвучено ' + s.count + ' фраз, ' + U.fmtBytes(s.bytes) + ' — теперь работает без интернета.', 100);
      }).catch(function () {
        setProgress('Не удалось: сервис озвучки недоступен. Остаётся системный голос.', 0);
      });
    }

    function listenSample() {
      var deck = S.getDeck(deckSel.value);
      var lang = deck ? SP.baseLang(deck.langFrom) : 'en';
      var byLang = deckPhrases(deckSel.value);
      var sample = (byLang[lang] || [])[0] || 'Hello';
      setProgress('Скачиваю пример: ' + sample, 30);
      T.play(sample, lang, {}).then(function (ok) {
        if (ok) { setProgress('Играет: ' + sample, 100); refreshStats(); return; }
        setProgress('Не удалось получить пример — сервис не ответил.', 0);
      });
    }

    var deckRow = h('div', { class: 'setting-row' },
      h('div', { class: 'setting-row__text' },
        h('b', { text: 'Скачать озвучку колоды' }),
        h('span', { class: 'muted small', text: 'Слова, переводы и примеры выбранной колоды сохранятся в браузере.' })
      ),
      h('div', { class: 'setting-row__control setting-row__control--stack' },
        data.decks.length ? deckSel : h('span', { class: 'muted small', text: 'Сначала создайте колоду.' }),
        h('div', { class: 'inline-row' },
          h('button', {
            class: 'btn btn--primary btn--sm',
            disabled: data.decks.length ? null : true,
            onclick: function () { ensureEnabled().then(function (ok) { if (ok) downloadDeck(); }); }
          }, icon('download', 15), h('span', { text: 'Скачать озвучку' })),
          h('button', {
            class: 'btn btn--ghost btn--sm',
            disabled: data.decks.length ? null : true,
            onclick: function () { ensureEnabled().then(function (ok) { if (ok) listenSample(); }); }
          }, icon('sound', 15), h('span', { text: 'Послушать пример' }))
        )
      )
    );

    var clearBtn = h('button', {
      class: 'btn btn--danger btn--sm',
      onclick: function () {
        U.confirmDialog('Очистить скачанную озвучку?',
          'Файлы озвучки будут удалены из кэша браузера. Системный голос продолжит работать, ' +
          'а скачанные фразы при необходимости можно загрузить снова.', 'Очистить')
          .then(function (ok) {
            if (!ok) return;
            T.purge().then(function (n) {
              U.toast('Удалено фраз: ' + n, 'ok', 2600);
              setProgress('Кэш озвучки очищен.', 0);
              return refreshStats();
            });
          });
      }
    }, icon('trash', 15), h('span', { text: 'Очистить кэш' }));

    /* Статус считаем сразу при отрисовке панели. */
    refreshStats();

    return h('div', { class: 'panel__section tts-net' },
      h('span', { class: 'field__label', text: 'Качественная озвучка из интернета' }),
      h('div', { class: 'tts-net__warn' },
        h('span', {}, h('b', { text: 'Нужен интернет. ' }),
          'Текст озвучиваемых фраз отправляется на сторонний бесплатный сервис ' +
          '(code.responsivevoice.org). По умолчанию это выключено.'),
        h('span', {}, 'Скачанное остаётся в браузере и работает без интернета. ',
          'Сервис бесплатный и может перестать работать — тогда приложение вернётся к системному голосу, ' +
          'ничего не сломается.'),
        h('span', {}, 'Голос в системе этот режим не меняет: он только добавляет второй источник звука.')
      ),
      h('label', { class: 'setting-row setting-row--switch' },
        h('div', { class: 'setting-row__text' },
          h('b', { text: 'Скачивать озвучку из интернета' }),
          h('span', { class: 'muted small', text: 'Кнопка 🔊 сначала берёт скачанный файл, и только если его нет — системный голос.' })
        ),
        h('span', { class: 'switch' }, enabledInput, h('span', { class: 'switch__track' }))
      ),
      deckRow,
      progressWrap,
      h('div', { class: 'tts-net__status' }, statusText, clearBtn),
      h('p', { class: 'muted small', text: 'Выбора голоса здесь нет намеренно: у сервиса параметр voice= не работает — Russian Female и Russian Male дают байтово одинаковый файл (проверено). Меняется только язык.' })
    );
  }

  function panel(title, iconName, ...children) {
    return h('section', { class: 'panel' },
      h('div', { class: 'panel__head' },
        h('h2', { class: 'panel__title' }, icon(iconName, 17), h('span', { text: title }))
      ),
      h('div', { class: 'panel__body' }, children.filter(Boolean))
    );
  }

  function row(label, control, hint) {
    return h('div', { class: 'setting-row' },
      h('div', { class: 'setting-row__text' },
        h('b', { text: label }),
        hint ? h('span', { class: 'muted small', text: hint }) : null
      ),
      h('div', { class: 'setting-row__control' }, control)
    );
  }

  /** Строка с ползунком: подпись, значение и пояснение под ними. */
  function rangeRow(label, hint, min, max, step, value, format, onChange) {
    var input = h('input', { class: 'input', type: 'range', min: String(min), max: String(max), step: String(step), value: String(value) });
    var out = h('span', { class: 'range-row__value muted small', text: format(value) });
    input.addEventListener('input', function () {
      var v = Number(this.value);
      out.textContent = format(v);
      onChange(v);
    });
    return row(label, h('div', { class: 'range-row' }, input, out), hint);
  }

  function switchRow(label, checked, onChange) {
    var input = h('input', { type: 'checkbox', checked: checked });
    input.addEventListener('change', function () { onChange(input.checked); });
    return h('label', { class: 'setting-row setting-row--switch' },
      h('div', { class: 'setting-row__text' }, h('b', { text: label })),

        'Слово,Перевод,Транскрипция,Пример,Перевод примера\nalthough,хотя,ɔːlˈðəʊ,"Although it was late, we kept working.","Хотя было поздно, мы продолжали работать."'),
