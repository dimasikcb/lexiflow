   (работает, пока вкладка открыта) и зеркало сводки в IndexedDB.

   Зачем зеркало: service worker не видит localStorage. Поэтому
   страница кладёт короткую сводку в IndexedDB, а sw.js читает её
   оттуда — тогда уведомление можно показать даже с закрытой

       хранилище: 'reminder', ключ — свойство 'key'
       запись:    { key: 'state', enabled, time, onlyIfDue, due,
                    streak, goal, reviewsToday, updatedAt, lastShown }

     хранилище не используются, чтобы sw.js не перебирал записи.

       enabled      — boolean, включены ли напоминания
       time         — 'HH:MM', локальное время показа
       onlyIfDue    — boolean, показывать только при наличии долга
       due          — number, сколько карточек ждёт повторения сейчас
       streak       — number, серия дней подряд
       goal         — number, цель повторений в день
       reviewsToday — number, повторений за сегодня
       updatedAt    — number, когда запись обновлена (мс)

  var DB_VERSION = 1;
  var STORE = 'reminder';
  var SUMMARY_KEY = 'state';

  var DEFAULT_TIME = '19:00';

  function toast(message, type, ms) {

    var m = value.trim().match(/^(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?$/);
    if (!m) return null;
    var hh = parseInt(m[1], 10), mm = parseInt(m[2], 10);
    if (!isFinite(hh) || !isFinite(mm)) return null;
    if (hh > 23 || mm > 59) return null;
    return hh * 60 + mm;
  }

  /** Привести время к каноническому 'HH:MM'; непонятное значение → null. */
  function normalizeTime(value) {
    var mins = timeToMinutes(value);
    if (mins === null) return null;
    var hh = Math.floor(mins / 60), mm = mins % 60;
    return (hh < 10 ? '0' + hh : String(hh)) + ':' + (mm < 10 ? '0' + mm : String(mm));
  }

  function minutesOfDay(ts) {
    var d = new Date(ts);
    return d.getHours() * 60 + d.getMinutes();
  }

  /**
   * Пора ли показать напоминание. Функция чистая: ничего не читает
   * из DOM и глобальных переменных, ничего не меняет — только считает.
   *
   * @param {{now:number, time:string, due:number, enabled:boolean,
   *          onlyIfDue:boolean, lastShown:string}} input
   * @returns {boolean}
   */
  function shouldNotify(input) {
    input = input || {};
    if (!input.enabled) return false;

    var now = (input.now === undefined || input.now === null) ? Date.now() : input.now;
    if (typeof now !== 'number' || !isFinite(now)) return false;

    /* Непонятное время — не повод падать, но и не повод придумывать
       своё: считаем напоминание ненастроенным и молчим. */
    var target = timeToMinutes(input.time);
    if (target === null) return false;

    // время ещё не наступило (полночь переживаем спокойно: сравниваем минуты дня)
    if (minutesOfDay(now) < target) return false;

    /* Один показ в сутки. Сравниваем локальные даты, а не «прошло 24 часа»,
       иначе напоминание уезжало бы на всё более позднее время. */
    if (String(input.lastShown || '') === dateKey(now)) return false;

    var due = Number(input.due);
    if (!isFinite(due) || due < 0) due = 0;
    // Значение по умолчанию — как в настройках приложения (onlyIfDue: true)
    var onlyIfDue = input.onlyIfDue === undefined ? true : !!input.onlyIfDue;
    if (onlyIfDue && due <= 0) return false;

    return true;
  }

  /* ============================================================
     Данные приложения
     ============================================================ */

  function defaultSettings() {
    return { enabled: false, time: DEFAULT_TIME, onlyIfDue: true, lastShown: '' };
  }

  /** Копия настроек напоминаний: правки снаружи не должны течь в store. */
  function settings() {
    var S = store();
    var st = S && typeof S.settings === 'function' ? S.settings() : null;
    return Object.assign(defaultSettings(), (st && st.notify) || {});
  }

  /**
   * Сколько карточек ждёт повторения прямо сейчас. Считаем ровно так же,
   * как экран колод (сумма deckStats().due по неархивным колодам), иначе
   * число в напоминании разошлось бы с тем, что видит пользователь.
   */
  function dueToday(now) {
    var S = store();
    if (!S || typeof S.deckStats !== 'function') return 0;
    now = now || Date.now();
    var total = 0;
    ((S.get() || {}).decks || []).forEach(function (d) {
      if (!d || d.archived) return;
      var st = S.deckStats(d.id, now);
      if (st && st.due) total += st.due;
    });
    return total;
  }

  /** Сводка для service worker — ровно та запись, что лежит в IndexedDB. */
  function summary(now) {
    var S = store();
    var cfg = settings();
    now = now || Date.now();
    var appSettings = (S && typeof S.settings === 'function' ? S.settings() : {}) || {};
    return {
      key: SUMMARY_KEY,
      enabled: !!cfg.enabled,
      time: cfg.time,
      onlyIfDue: !!cfg.onlyIfDue,
      due: dueToday(now),
      streak: S && typeof S.streak === 'function' ? S.streak(now) : 0,
      goal: Number(appSettings.dailyGoal) || 30,
      reviewsToday: S && typeof S.reviewsToday === 'function' ? S.reviewsToday(null, now) : 0,
      updatedAt: Date.now(),
      lastShown: String(cfg.lastShown || '')
    };
  }

  function writeNotify(next) {
    var S = store();
    if (!S || typeof S.updateSettings !== 'function') return;
    S.updateSettings({ notify: next });
    // Важнее всего именно здесь: в lastShown лежит «сегодня уже показали».
    // Если запись задержится, service worker пришлёт напоминание второй раз.
    refreshMirror();
    syncScheduler();

  /* ============================================================
     Разрешение браузера
     ============================================================ */

  /* Notification читаем каждый раз заново: в приватном режиме и в тестах
     API может появиться или исчезнуть уже после загрузки страницы. */
  function notificationApi() {
    return typeof global.Notification === 'undefined' ? null : global.Notification;
  }

    return 'default';

  /**
   * Запросить разрешение. Вызывать только из жеста пользователя
   * (клик по кнопке) — браузеры игнорируют запрос при загрузке.
   * Промис разрешается всегда: и при отказе, и при отсутствии API.
   */
  function request() {
    return new Promise(function (resolve) {
      var api = notificationApi();
      if (!api) { resolve('unsupported'); return; }
      if (api.permission === 'granted' || api.permission === 'denied') {

        return;
      }

      function settle(value) {
        if (settled) return;
        settled = true;
        resolve(value === 'granted' || value === 'denied' ? value : 'default');
      }

      try {

        // новые — промисом; поддерживаем оба варианта
        var res = api.requestPermission(function (value) { settle(value); });
        if (res && typeof res.then === 'function') {
          res.then(settle, function () { settle('default'); });
        }
      } catch (e) {
        settle('default');
      }
    });
  }

  /* ============================================================
     Показ уведомления
     ============================================================ */

  /** Текст уведомления: «К повторению: 12 карточек». */
  function reminderText(due) {
    var n = Number(due);
    if (!isFinite(n) || n <= 0) return 'Самое время немного позаниматься.';
    return 'К повторению: ' + n + ' ' + plural(n, 'карточка', 'карточки', 'карточек');
  }

  function notificationOptions(kind, due) {
    return {
      body: reminderText(due),
      tag: TAG,                      // повтор заменяет прошлое, а не копится
      icon: 'icons/icon-192.png',
      badge: 'icons/favicon.svg',
      lang: 'ru',
      /* sw.js по клику ведёт на data.url — держим адрес в записи,
         чтобы обработчик в service worker не хардкодил маршрут. */
      data: { url: TARGET_HASH, kind: kind }

  }

  /** Обычное уведомление из окна — когда service worker недоступен. */
  function directNotification(title, options) {
    var api = notificationApi();
    if (!api) return false;
    try {
      var n = new api(title, options);
      n.onclick = function () {
        try {
          if (typeof global.focus === 'function') global.focus();
          if (global.location) global.location.hash = TARGET_HASH;
          if (typeof n.close === 'function') n.close();
        } catch (e) { /* окно могло уже закрыться */ }
      };
      return true;
    } catch (e) {
      return false;
    }

    return new Promise(function (resolve, reject) {
      var t = global.setTimeout(function () { reject(new Error('timeout')); }, ms);
      promise.then(function (v) { global.clearTimeout(t); resolve(v); },

   * независимо от вкладки), при отсутствии регистрации — напрямую.
   * Промис не отклоняется: на любой сбой возвращаем false.

            return reg.showNotification(title, options).then(
              function () { return true; },
              function () { return directNotification(title, options); }
            );
          } catch (e) {
            // showNotification без разрешения бросает синхронно
            return directNotification(title, options);
          }

        return directNotification(title, options);
      }, function () {
        return directNotification(title, options);

       Объясняем, где это меняется, — иначе выглядит как поломка приложения. */

          writeNotify(next);

          writeNotify(next);

    // есть, во втором напоминания всё равно работать не будут, но настройка
    // сохраняется — панель настроек честно объясняет ограничение.
    writeNotify(next);

  /** Пробное уведомление по кнопке из настроек. */

    if (!supported()) {
      toast('Этот браузер не умеет показывать уведомления — напоминания будут недоступны.', 'warn', 6000);
      return Promise.resolve(false);
    }
    return request().then(function (perm) {
      if (perm !== 'granted') {
        toast('Браузер не разрешил уведомления. Разрешите их в настройках сайта и попробуйте снова.', 'err', 6000);
        return false;
      }
      return show('LexiFlow', {
        body: 'Пробное уведомление — всё работает.',
        tag: TAG,
        icon: 'icons/icon-192.png',
        badge: 'icons/favicon.svg',
        lang: 'ru',
        data: { url: TARGET_HASH, kind: 'test' }
      }).then(function (shown) {
        toast(shown ? 'Пробное уведомление отправлено' : 'Не удалось показать уведомление', shown ? 'ok' : 'err', 3600);
        return !!shown;
      });

  /* ============================================================
     Планировщик (пока вкладка открыта)
     ============================================================ */

  function onVisibility() {
    if (global.document && global.document.visibilityState === 'visible') tick();
  }

  function tick() {
    if (checking) return;
    var cfg = settings();
    var now = Date.now();
    var due = dueToday(now);

    if (!shouldNotify({
      now: now, time: cfg.time, due: due,
      enabled: cfg.enabled, onlyIfDue: cfg.onlyIfDue, lastShown: cfg.lastShown
    })) return;

    checking = true;
    show('LexiFlow', notificationOptions('reminder', due)).then(function (shown) {
      checking = false;
      // Не показали — не отмечаем день: попробуем на следующей проверке.
      if (!shown) return;
      var next = Object.assign({}, settings(), { lastShown: dateKey(Date.now()) });
      writeNotify(next);
    }, function () {
      checking = false;
    });
  }

  function start() {
    if (started || !supported()) return;
    started = true;
    timer = global.setInterval(tick, CHECK_MS);
    if (global.document && global.document.addEventListener) {
      global.document.addEventListener('visibilitychange', onVisibility);
    }
    // первая проверка — вскоре после запуска, но не в момент отрисовки
    global.setTimeout(tick, FIRST_CHECK_MS);
  }

  function stop() {
    if (!started) return;
    started = false;
    if (timer) { global.clearInterval(timer); timer = null; }
    if (global.document && global.document.removeEventListener) {
      global.document.removeEventListener('visibilitychange', onVisibility);
    }
  }

  /** Включено и поддерживается — планировщик работает, иначе молчит. */
  function syncScheduler() {

  }

  /* ============================================================
     Зеркало в IndexedDB
     ============================================================ */

  /** Запись сводки в IndexedDB. Никогда не отклоняется: false = не удалось. */
  function mirror() {
    return new Promise(function (resolve) {
      var record;
      try { record = summary(); } catch (e) { resolve(false); return; }
      if (!global.indexedDB) { resolve(false); return; }

      var req;
      try {
        req = global.indexedDB.open(DB_NAME, DB_VERSION);
      } catch (e) {
        resolve(false);
        return;
      }

      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(STORE)) {
          db.createObjectStore(STORE, { keyPath: 'key' });
        }
      };
      req.onblocked = function () { resolve(false); };
      req.onerror = function () { resolve(false); };
      req.onsuccess = function () {
        var db = req.result;
        try {

          tx.objectStore(STORE).put(record);
          tx.oncomplete = function () { closeDb(db); resolve(true); };
          tx.onerror = function () { closeDb(db); resolve(false); };
          tx.onabort = function () { closeDb(db); resolve(false); };

          resolve(false);
        }

    try { if (db && typeof db.close === 'function') db.close(); } catch (e) { /* уже закрыта */ }
  }

  /**
   * Дебаунс записи: настройки меняются по буквам, а в IndexedDB
   * незачем ходить на каждое нажатие клавиши.
   */
  function scheduleMirror() {
    if (mirrorTimer) global.clearTimeout(mirrorTimer);

      mirrorTimer = null;
      mirror();

  }

  /** Страница уходит в фон (или уже ушла) — таймеры вот-вот замрут. */
  function isHidden() {

  /**
   * Записать сводку немедленно, отменив отложенную запись.
   *
   * Дебаунс выше нужен, пока страница на экране: настройки меняются по
   * буквам. Но ждать 1,2 с при уходе со страницы нельзя — мобильные
   * браузеры замораживают таймеры сразу после ухода в фон, и отложенная
   * запись не случится уже никогда. Тогда service worker прочитает
   * устаревшую сводку: например, увидит старую дату последнего показа
   * и пришлёт второе напоминание за день.
   */
  function flushMirror() {
    if (mirrorTimer) { global.clearTimeout(mirrorTimer); mirrorTimer = null; }
    return mirror();
  }

  /**
   * Обновить сводку: на экране — с дебаунсом, в фоне — сразу.
   * Единая точка входа, чтобы ни один путь не остался «отложенным».
   */
  function refreshMirror() {
    if (isHidden()) return flushMirror();
    scheduleMirror();
    return true;
  }

  /**
   * Держим зеркало свежим. Подписка на store ловит смену настроек и правки
   * через store, а обёртка над flush — завершение сессии тренировки:
   * study.js сохраняет прогресс через S.save() и подписчиков не будит.
   * Обёртка не меняет поведение flush, только добавляет запись сводки.
   */
  function installHooks() {
    if (hooksInstalled) return;
    hooksInstalled = true;

    var S = store();
    if (!S) return;
    if (typeof S.subscribe === 'function') S.subscribe(function () { refreshMirror(); });
    if (typeof S.flush === 'function') {
      var original = S.flush;
      S.flush = function () {
        var result = original.apply(this, arguments);
        // flush зовут и при уходе со страницы (app.js: pagehide и
        // visibilitychange) — тогда пишем сводку сразу, без дебаунса.
        refreshMirror();
        return result;
      };
    }

  /**
   * Уход со страницы: дописываем сводку немедленно.
   *
   * app.js тоже зовёт store.flush() на этих событиях, и обычно этого
   * достаточно (обёртка над flush выше). Свой слушатель нужен на случай,
   * когда данных не менялось и flush ничего не делает, — тогда сводка
   * уже свежая, а вызов выходит пустым и ничего не портит.
   */
  function installLifecycle() {
    if (lifecycleInstalled) return;
    lifecycleInstalled = true;

    if (typeof global.addEventListener === 'function') {
      global.addEventListener('pagehide', function () { flushMirror(); });
    }
    if (global.document && typeof global.document.addEventListener === 'function') {
      global.document.addEventListener('visibilitychange', function () {
        if (isHidden()) flushMirror();
      });
    }
  }

  installHooks();
  installLifecycle();

  // Если напоминания уже включены — поднимаем планировщик сами:
  // приложение может не знать о модуле (его подключает другой файл).
  if (supported() && settings().enabled) start();

  App.notify = {
    /* замороженная схема IndexedDB — sw.js ссылается на эти константы */
    DB_NAME: DB_NAME,
    DB_VERSION: DB_VERSION,
    STORE: STORE,
    SUMMARY_KEY: SUMMARY_KEY,
    TAG: TAG,
    TARGET_HASH: TARGET_HASH,

    supported: supported,
    permission: permission,
    request: request,

    settings: settings,
    configure: configure,

    dueToday: dueToday,
    shouldNotify: shouldNotify,

    test: test,
    start: start,
    stop: stop,

    summary: summary,
    mirror: mirror,

    /* помощники, полезные и снаружи (и в тестах) */
    dateKey: dateKey,
    timeToMinutes: timeToMinutes,

    flushMirror: flushMirror,

})(window);

  /* ============================================================

  function dataCodewords(version, level) {

  /* ============================================================

  /* ============================================================

  /* ============================================================
     Кодирование
     ============================================================ */

  /**

    // Проверяем именно по списку: обращение к EC_TOTAL пропустило бы
    // унаследованные свойства вроде «constructor».

    }

    buffer.put(data.length, version <= 9 ? 8 : 16);      // счётчик символов

    var PAD = [0xec, 0x11];
    for (i = 0; codewords.length < totalData; i++) codewords.push(PAD[i % 2]);

    var blocks = [], ecc = [], offset = 0;
    var blockCount = layout.shortBlocks + layout.longBlocks;
    for (i = 0; i < blockCount; i++) {
      var blockSize = i < layout.shortBlocks ? layout.shortData : layout.shortData + 1;
      var block = codewords.slice(offset, offset + blockSize);
      offset += blockSize;
      blocks.push(block);
      ecc.push(rsRemainder(block, layout.ecPerBlock));
    }

    var stream = [];
    var longest = layout.shortData + (layout.longBlocks ? 1 : 0);
    for (var k = 0; k < longest; k++) {
      for (i = 0; i < blockCount; i++) {
        if (k < blocks[i].length) stream.push(blocks[i][k]);
      }
    }
    for (k = 0; k < layout.ecPerBlock; k++) {
      for (i = 0; i < blockCount; i++) stream.push(ecc[i][k]);
    }

    /* --- матрица --- */
    var size = 17 + 4 * version;
    var matrix = blank(size);
    var reserved = blank(size);

    placeFinder(matrix, reserved, 0, 0);
    placeFinder(matrix, reserved, 0, size - 7);
    placeFinder(matrix, reserved, size - 7, 0);
    placeTiming(matrix, reserved);
    placeAlignment(matrix, reserved, version);
    reserveFormat(reserved);
    if (version >= 7) placeVersion(matrix, reserved, version);
    placeData(matrix, reserved, stream);

    /* --- выбор маски: наименьший штраф по четырём правилам стандарта --- */
    var bestMask = 0, bestScore = Infinity, bestMatrix = null;
    for (var mask = 0; mask < 8; mask++) {

      applyMask(candidate, reserved, mask);
      placeFormat(candidate, level, mask);
      var score = penalty(candidate);
      if (score < bestScore) {
        bestScore = score;
        bestMask = mask;
        bestMatrix = candidate;
      }
    }

    return {
      version: version,
      ec: level,
      mask: bestMask,
      score: bestScore,
      size: size,
      core: bestMatrix,
      matrix: addQuietZone(bestMatrix, quiet),
      quiet: quiet
    };
  }

  /* ============================================================
     Отрисовка
     ============================================================ */

  var SVG_NS = 'http://www.w3.org/2000/svg';

    background.setAttribute('y', '0');
    background.setAttribute('width', String(count));
    background.setAttribute('height', String(count));

    var path = '';

    formatBits: formatBits,
    versionBits: versionBits,

      ),

  function renderDeckList(container, decks, query, now) {
    U.clear(container);
    var filtered = decks.filter(function (d) {
      if (!query) return true;
      return (d.name + ' ' + d.description).toLowerCase().indexOf(query.toLowerCase()) >= 0;
    });
    if (!decks.length) {
      container.appendChild(emptyState('layers', 'Пока нет ни одной колоды',

  /* ============================================================

  function openDeckDialog(deck) {
    var isNew = !deck;
    deck = deck || { name: '', description: '', langFrom: 'en', langTo: 'ru', color: S.COLORS[0], settings: SRS.DEFAULT_SETTINGS };

    var nameInput = h('input', { class: 'input', placeholder: 'Например: Английский: базовый', value: deck.name, maxlength: 60 });
    var descInput = h('input', { class: 'input', placeholder: 'Короткое описание (необязательно)', value: deck.description || '' });
    var fromSel = langSelect(deck.langFrom);
    var toSel = langSelect(deck.langTo);
    var colorRow = h('div', { class: 'color-row' });
    var chosen = { color: deck.color || S.COLORS[0] };
    S.COLORS.forEach(function (c) {
      var b = h('button', {
        type: 'button',
        class: 'color-dot' + (c === chosen.color ? ' is-active' : ''),
        style: { background: c },
        'aria-label': 'Цвет ' + c,
        onclick: function () {
          chosen.color = c;
          U.qsa('.color-dot', colorRow).forEach(function (x) { x.classList.remove('is-active'); });
          b.classList.add('is-active');
        }
      });
      colorRow.appendChild(b);
    });

    var body = h('div', { class: 'form' },
      field('Название колоды', nameInput),
      field('Описание', descInput),
      h('div', { class: 'form__row' },
        field('Изучаемый язык', fromSel),
        field('Язык перевода', toSel)
      ),
      field('Цвет', colorRow)
    );

    U.modal({
      title: isNew ? 'Новая колода' : 'Настройки колоды',
      body: body,
      actions: [
        { label: 'Отмена', variant: 'ghost' },
        {
          label: isNew ? 'Создать' : 'Сохранить', variant: 'primary', keepOpen: false,
          onClick: function () {
            var name = nameInput.value.trim();
            if (!name) { U.toast('Введите название колоды', 'err'); nameInput.focus(); return false; }
            var payload = {
              name: name,
              description: descInput.value.trim(),
              langFrom: fromSel.value,
              langTo: toSel.value,
              color: chosen.color
            };
            if (isNew) {
              var created = S.createDeck(payload);
              U.toast('Колода создана', 'ok');
              App.router.go('#/deck/' + created.id);
            } else {
              S.updateDeck(deck.id, payload);
              U.toast('Сохранено', 'ok');
              App.router.refresh();
            }
          }
        }
      ]
    });
  }

  function langSelect(value) {
    var sel = h('select', { class: 'input' });
    var codes = Object.keys(SP.LANG_NAMES).sort(function (a, b) {
      return SP.LANG_NAMES[a].localeCompare(SP.LANG_NAMES[b], 'ru');
    });
    codes.forEach(function (c) {
      sel.appendChild(h('option', { value: c, text: SP.LANG_NAMES[c] + ' (' + c + ')', selected: c === value }));
    });
    if (value && codes.indexOf(value) < 0) sel.appendChild(h('option', { value: value, text: value, selected: true }));
    return sel;

  function field(label, control, hint) {

          ),

      ),

        h('button', { class: 'btn btn--ghost', onclick: function () { openDeckSettings(deck); } }, icon('clock', 16), h('span', { text: 'Интервалы' })),
        h('button', { class: 'btn btn--primary', onclick: function () { App.router.go('#/study/' + deck.id); } }, icon('play', 16), h('span', { text: 'Учить' }))
      )
    );

    var actions = h('div', { class: 'action-bar' },
      actionCard('sparkle', 'Добавить слово', 'Слово, перевод, транскрипция, примеры', function () { openCardEditor(null, deck.id); }),
      actionCard('target', 'Тест', 'Выбор варианта, ввод, аудирование', function () { App.router.go('#/test/' + deck.id); }),
      actionCard('list', 'Список слов', 'Поиск, правка, массовые операции', function () { App.router.go('#/browse/' + deck.id); }),
      actionCard('chart', 'Прогресс', 'Статистика по этой колоде', function () { App.router.go('#/stats/' + deck.id); })
    );

    var statsRow = h('div', { class: 'stat-row' },
      statChip('К повторению', stats.due, 'due'),
      statChip('Новые', stats.new, 'new'),
      statChip('В обучении', stats.learning, 'learning'),

      statChip('Всего', stats.total, 'total')
    );

    var body = h('div', { class: 'page' },
      head,
      statsRow,
      actions,
      h('section', { class: 'panel' },
        h('div', { class: 'panel__head' },

        h('b', { text: title }),
        h('small', { text: text })
      ),
      icon('chevron', 16)
    );
  }

  function filterChips(deck, onPick) {
    var current = renderDeck._filter || 'all';
    var defs = [
      { id: 'all', label: 'Все' },
      { id: 'due', label: 'К повторению' },
      { id: 'new', label: 'Новые' },
      { id: 'learning', label: 'В обучении' },
      { id: 'review', label: 'Повторение' },
      { id: 'leech', label: 'Трудные' }
    ];
    var row = h('div', { class: 'chips' });
    defs.forEach(function (d) {
      row.appendChild(h('button', {
        class: 'chip' + (current === d.id ? ' is-active' : ''),
        onclick: function () {
          U.qsa('.chip', row).forEach(function (c) { c.classList.remove('is-active'); });
          this.classList.add('is-active');
          onPick(d.id);
        }
      }, h('span', { text: d.label })));
    });
    return row;
  }

  function cardMatches(card, filter, now) {
    var dayEnd = U.startOfDay(now) + U.MS_DAY;
    switch (filter) {
      case 'due': return card.srs && card.srs.due < dayEnd && !card.suspended;
      case 'new': return SRS.isNew(card);
      case 'learning': return SRS.isLearning(card);
      case 'review': return SRS.isReview(card);
      case 'leech': return !!(card.srs && card.srs.leech);
      default: return true;
    }
  }

  function renderWordList(container, deck, query, filter, now) {
    if (!container) return;
    U.clear(container);
    var cards = S.cardsOf(deck.id);
    var q = (query || '').trim().toLowerCase();
    var list = cards.filter(function (c) {
      if (!cardMatches(c, filter, now)) return false;
      if (!q) return true;
      return (c.word + ' ' + c.translation + ' ' + c.transcription + ' ' + (c.tags || []).join(' ')).toLowerCase().indexOf(q) >= 0;
    });
    list.sort(function (a, b) { return (a.srs && a.srs.due || 0) - (b.srs && b.srs.due || 0); });

    if (!cards.length) {
      container.appendChild(emptyState('cards', 'В колоде пока нет слов',
        'Добавьте первое слово вручную или импортируйте список из файла.',

          h('button', { class: 'btn btn--primary', onclick: function () { openCardEditor(null, deck.id); } }, icon('plus', 16), h('span', { text: 'Добавить слово' })),

          h('button', { class: 'btn btn--ghost', onclick: function () { App.router.go('#/ai'); } }, icon('sparkle', 16), h('span', { text: 'Слова от нейросети' }))
        )));
      return;
    }
    if (!list.length) {
      container.appendChild(emptyState('search', 'Ничего не найдено', 'Измените запрос или выберите другой фильтр.'));
      return;
    }

    list.forEach(function (card) {
      container.appendChild(wordRow(card, deck, now));
    });
  }

  function wordRow(card, deck, now) {
    var stateKind = SRS.isNew(card) ? 'new' : SRS.isLearning(card) ? 'learning' : 'review';
    var wordSpan = h('span', { class: 'word-row__word', text: card.word });
    var row = h('div', { class: 'word-row' },
      h('div', { class: 'word-row__main' },
        h('div', { class: 'word-row__top' },
          wordSpan,
          card.transcription ? h('span', { class: 'word-row__ipa', text: '[' + card.transcription.replace(/^\[|\]$/g, '') + ']' }) : null,
          SP.supported() ? SP.audioButton(card.word, deck.langFrom, { small: true, target: wordSpan }) : null,
          card.suspended ? h('span', { class: 'tag tag--muted', text: 'на паузе' }) : null,
          card.srs && card.srs.leech ? h('span', { class: 'tag tag--warn', text: 'трудное' }) : null
        ),
        h('div', { class: 'word-row__trans', text: card.translation }),
        card.examples && card.examples.length
          ? h('div', { class: 'word-row__example' },
              h('span', { text: card.examples[0].text ? '«' + card.examples[0].text + '»' : card.examples[0].translation }),
              card.examples[0].text && card.examples[0].translation

                : null,
              card.examples.length > 1
                ? h('span', { class: 'word-row__example-more', text: ' +' + (card.examples.length - 1) })
                : null
            )
          : null

  function filtered() {
    var now = Date.now();

    var cards = state.deckId === 'all' ? S.get().cards.slice() : S.cardsOf(state.deckId);
    var dayEnd = U.startOfDay(now) + U.MS_DAY;

    cards = cards.filter(function (c) {
      switch (state.status) {
        case 'new': if (!SRS.isNew(c)) return false; break;
        case 'learning': if (!SRS.isLearning(c)) return false; break;
        case 'review': if (!SRS.isReview(c)) return false; break;
        case 'due': if (!(c.srs && c.srs.due < dayEnd)) return false; break;
        case 'leech': if (!(c.srs && c.srs.leech)) return false; break;
        case 'suspended': if (!c.suspended) return false; break;

      if (!q) return true;
      return (c.word + ' ' + c.translation + ' ' + c.transcription + ' ' + (c.tags || []).join(' ')).toLowerCase().indexOf(q) >= 0;

/* ============================================================
   LexiFlow — views/study.js

(function (global) {

  var MODES = [
    { id: 'flip', label: 'Карточки', icon: 'cards', hint: 'Классический флип: смотрите слово и оцените себя' },
    { id: 'choice', label: 'Выбор варианта', icon: 'list', hint: 'Выберите правильный перевод из четырёх' },
    { id: 'typing', label: 'Ввод перевода', icon: 'keyboard', hint: 'Вспомните и напишите перевод вручную' },
    { id: 'listening', label: 'Аудирование', icon: 'sound', hint: 'Слушайте слово и выбирайте перевод' },
    { id: 'mixed', label: 'Микс', icon: 'shuffle', hint: 'Все режимы по очереди в одной сессии' }
  ];

  var DIRS = [
    { id: 'fwd', label: 'Слово → перевод' },
    { id: 'rev', label: 'Перевод → слово' },
    { id: 'mixed', label: 'В обе стороны' }
  ];

  var session = null;

  /* ---------- Вспомогательные ---------- */

  function modeMeta(id) {
    return MODES.find(function (m) { return m.id === id; }) || MODES[0];
  }

  function deckSettingsFor(deckIds) {
    // если выбрана одна колода — берём её настройки; иначе усреднённые (берём первую)
    var d = deckIds.length === 1 ? S.getDeck(deckIds[0]) : null;
    return SRS.sanitizeSettings(d ? d.settings : SRS.DEFAULT_SETTINGS);
  }

  function primaryLang(deckIds, side) {
    var deck = deckIds.length ? S.getDeck(deckIds[0]) : null;
    if (!deck) return side === 'to' ? 'ru' : 'en';
    return side === 'to' ? deck.langTo : deck.langFrom;
  }

  function langForCard(card, side) {
    var deck = S.getDeck(card.deckId);
    if (!deck) return side === 'to' ? 'ru' : 'en';
    return side === 'to' ? deck.langTo : deck.langFrom;
  }

  /* ---------- Проверка озвучки перед началом ---------- */

  /**
   * Языки, которые понадобятся в этой тренировке.
   * Слово читается на языке колоды, но в обратном направлении и в примерах
   * звучит и язык перевода, поэтому проверяем оба.
   */
  function sessionLangs() {
    var langs = [];
    ((session && session.deckIds) || []).forEach(function (id) {
      var deck = S.getDeck(id);
      if (!deck) return;
      [deck.langFrom, deck.langTo].forEach(function (lang) {
        if (lang && langs.indexOf(lang) < 0) langs.push(lang);
      });
    });
    return langs;
  }

  /* Ключ включает уровень голоса: если голос появится или сменится на
     роботизированный, предупреждение покажется снова, а не потеряется. */
  function noticeKey(langs, level) {
    return langs.slice().sort().join(',') + ':' + level;
  }

  function rememberNotice(key) {
    var seen = Object.assign({}, S.settings().ttsNoticeSeen);
    seen[key] = true;
    S.updateSettings({ ttsNoticeSeen: seen });
  }

  /**
   * Фразы текущей сессии по языкам: слово и перевод каждой карточки плюс
   * примеры. Именно это уйдёт на скачивание, поэтому список строится из
   * очереди сессии, а не из всей колоды — качать то, что человек не увидит,
   * значит зря дёргать чужой бесплатный сервис.
   */
  function sessionPhrases() {
    var byLang = {};
    var seen = {};
    function add(lang, text) {
      if (!lang || !text) return;
      var base = SP.baseLang(lang);
      if (!byLang[base]) byLang[base] = [];
      byLang[base].push(text);
    }
    var items = session.learn.concat(session.main);
    if (session.current && session.current.item) items.push(session.current.item);
    items.forEach(function (item) {
      var card = item.card;
      if (!card || seen[card.id]) return;
      seen[card.id] = true;
      var deck = S.getDeck(card.deckId);
      var from = deck ? deck.langFrom : 'en';
      var to = deck ? deck.langTo : 'ru';
      add(from, card.word);
      add(to, card.translation);
      (card.examples || []).forEach(function (ex) { if (ex && ex.text) add(from, ex.text); });
    });
    return byLang;
  }

  function pluralPhrases(n) {
    return n + ' ' + U.plural(n, 'фраза', 'фразы', 'фраз');
  }

  /**
   * Кнопка «Скачать качественную озвучку»: включает сетевую озвучку
   * (это и есть осознанное согласие — текст уходит на чужой сервер)
   * и качает фразы сессии, показывая прогресс и честный итог.
   *
   * Итог не «загружено успешно», а «сколько фраз теперь доступно офлайн»:
   * число берётся из кэша (ttsnet.stats), а не из факта запуска загрузки.
   */
  function downloadAudioButton() {
    if (!App.ttsnet || !App.ttsnet.preload) return null;

    var status = h('span', { class: 'muted small' });
    var bar = h('div', { class: 'progress progress--sm' }, h('div', { class: 'progress__bar', style: { width: '0%' } }));
    var box = h('div', { class: 'tts-notice__progress', style: { display: 'none' } }, status, bar);

    function show(text, pct) {
      box.style.display = '';
      status.textContent = text;
      var fill = bar.querySelector('.progress__bar');
      if (fill && pct !== undefined && pct !== null) {
        fill.style.width = Math.max(0, Math.min(100, pct)) + '%';
      }
    }

    function run() {
      var byLang = sessionPhrases();
      var langs = Object.keys(byLang);
      if (!langs.length) { show('В этой тренировке нечего озвучивать.', 0); return; }

      /* Настройка включена по умолчанию, но пишем её явно: человек мог
         выключить сетевую озвучку раньше, а это действие — его осознанное
         согласие (в диалоге прямо сказано, что текст уходит на чужой сервер). */
      var cur = S.settings().ttsNet || {};
      S.updateSettings({ ttsNet: { enabled: true, downloaded: cur.downloaded || 0 } });
      if (!App.ttsnet.available()) {
        show('Нет интернета — остаётся системный голос.', 0);
        return;
      }

      var total = 0;
      langs.forEach(function (l) { total += byLang[l].length; });
      var seen = 0;      // обработано фраз в уже пройденных языках
      var failed = 0;
      show('Скачиваю озвучку: 0 из ' + total, 0);

      /* Языки идут по очереди, а не параллельно: у preload свой предел
         параллелизма внутри языка, и складывать их не нужно — сервис чужой. */
      var chain = Promise.resolve();
      langs.forEach(function (lang) {
        chain = chain.then(function () {
          return App.ttsnet.preload(byLang[lang], lang, function (p) {
            var processed = seen + p.done + p.failed;
            show('Скачиваю озвучку: ' + Math.min(processed, total) + ' из ' + total,
              total ? processed / total * 100 : 0);
          });
        }).then(function (res) {
          failed += res.failed;
          seen += res.done + res.failed;
          return res;
        });
      });

      chain.then(function () {
        return App.ttsnet.stats();
      }).then(function (st) {
        if (!st.count) {
          show('Не удалось: сервис озвучки недоступен. Остаётся системный голос.', 0);
          return;
        }
        var size = U.fmtBytes(st.bytes);
        if (failed) {
          show('Частично: озвучено ' + pluralPhrases(st.count) + ', ' + size +
            '. Остальное прочитает системный голос.', 100);
        } else {
          show('Готово: озвучено ' + pluralPhrases(st.count) + ', ' + size +
            ' — теперь работает без интернета.', 100);
        }
      }).catch(function () {
        show('Не удалось: сервис озвучки недоступен. Остаётся системный голос.', 0);
      });
    }

    var btn = h('button', {
      class: 'btn btn--primary btn--sm',
      onclick: function () {
        U.confirmDialog('Скачать качественную озвучку?',
          'Нужен интернет. Текст фраз этой тренировки уйдёт на сторонний бесплатный сервис ' +
          'озвучки (code.responsivevoice.org). После загрузки озвучка работает без интернета. ' +
          'Сервис может отказать — тогда останется системный голос.',
          'Скачать').then(function (ok) {
            if (!ok) return;
            run();
          });
      }
    }, icon('download', 15), h('span', { text: 'Скачать качественную озвучку' }));

    return h('div', { class: 'tts-notice__download' }, h('div', { class: 'inline-row' }, btn), box);
  }

  /**
   * Предупреждение об озвучке в начале тренировки.
   *
   * Зачем: человек нажимает 🔊, слышит чужое произношение или робота и не
   * понимает почему. Голоса для этого языка в системе может не быть вовсе —
   * а изнутри карточки это выглядит как поломка приложения. Поэтому
   * проверяем голоса до первого слова и говорим, что делать: поставить
   * голос в системе, открыть приложение в Edge или скачать озвучку здесь.

    var langs = sessionLangs();
    if (!langs.length) return null;

    /* Что именно не так с голосами, решает speech.js — там же это и проверяется. */
    var advice = SP.voiceAdvice(langs);
    if (!advice) return null;

    var level = advice.level;
    var key = noticeKey(langs, level);
    if ((S.settings().ttsNoticeSeen || {})[key]) return null;

    var notice = h('div', { class: 'tts-notice' + (level === 'poor' ? ' tts-notice--soft' : '') },
      h('div', { class: 'tts-notice__text' },
        h('b', { text: advice.title }),
        h('span', { class: 'small', text: advice.text })
      ),
      h('div', { class: 'tts-notice__actions' },
        h('button', {
          class: 'btn btn--ghost btn--sm',
          onclick: function () { App.router.go('#/settings'); }
        }, icon('sound', 15), h('span', { text: 'Настройки озвучки' })),
        h('button', {
          class: 'icon-btn', title: 'Больше не показывать',
          onclick: function () {
            session.ttsNoticeClosed = true;
            rememberNotice(key);
            if (notice && notice.remove) notice.remove();
          }
        }, icon('close', 16))
      ),
      /* Кнопка действия, а не только совет уйти в настройки: раньше блок
         честно объяснял проблему, но решить её из тренировки было нельзя. */
      downloadAudioButton()
    );
    return notice;
  }

  /** Собрать очередь на сессию. */
  function buildQueue(deckIds, opts) {
    var now = Date.now();
    var settings = deckSettingsFor(deckIds);
    var cards = S.allCards(deckIds).filter(function (c) { return !c.suspended; });

    var learning = [], review = [], fresh = [];
    cards.forEach(function (c) {
      if (SRS.isNew(c)) fresh.push(c);
      else if (SRS.isLearning(c)) learning.push(c);
      else review.push(c);
    });

    learning = learning.filter(function (c) { return c.srs.due <= now; })
      .sort(function (a, b) { return a.srs.due - b.srs.due; });
    review = review.filter(function (c) { return c.srs.due <= now; })
      .sort(function (a, b) { return a.srs.due - b.srs.due; });

    // лимит новых в день
    var newBudget;
    if (opts.ignoreLimits) {
      newBudget = fresh.length;
    } else {
      var perDeck = {};
      deckIds.forEach(function (id) {
        var used = S.newIntroducedToday(id, now);
        var d = S.getDeck(id);
        perDeck[id] = Math.max(0, (d ? d.settings.newPerDay : settings.newPerDay) - used);
      });
      var budget = 0;
      fresh.forEach(function (c) { if (perDeck[c.deckId] === undefined) perDeck[c.deckId] = settings.newPerDay; });
      Object.keys(perDeck).forEach(function (k) { budget += perDeck[k]; });
      newBudget = Math.min(fresh.length, budget);
    }

    if (settings.newOrder === 'random') shuffle(fresh);
    else fresh.sort(function (a, b) { return a.createdAt - b.createdAt; });
    fresh = fresh.slice(0, newBudget);

    // лимит повторений
    var reviewBudget = opts.ignoreLimits ? review.length : Math.min(review.length, settings.maxReviewsPerDay);

    var learnQueue = learning.map(function (c) { return { card: c, kind: 'learn', due: c.srs.due }; });
    var mainQueue = review.slice(0, reviewBudget).map(function (c) { return { card: c, kind: 'review', due: c.srs.due }; })
      .concat(fresh.map(function (c) { return { card: c, kind: 'new', due: 0 }; }));

    if (opts.shuffleMain) shuffle(mainQueue);
    if (opts.limit) mainQueue = mainQueue.slice(0, opts.limit);

    return {
      learn: learnQueue,
      main: mainQueue,
      counts: { new: fresh.length, learning: learning.length, due: review.slice(0, reviewBudget).length }
    };
  }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function buildTestQueue(deckIds, count) {
    var cards = S.allCards(deckIds).filter(function (c) { return !c.suspended && c.word && c.translation; });
    // приоритет карточкам с прогрессом
    cards.sort(function (a, b) {
      var sa = SRS.isNew(a) ? 1 : 0, sb = SRS.isNew(b) ? 1 : 0;
      if (sa !== sb) return sa - sb;
      return (b.srs.reps || 0) - (a.srs.reps || 0);
    });
    var pool = cards.slice(0, Math.max(count * 2, count));
    shuffle(pool);
    return pool.slice(0, count).map(function (c) { return { card: c, kind: 'test', due: 0 }; });
  }

  /* ============================================================
     Стартовый экран сессии
     ============================================================ */

  function renderStudy(root, params) {
    var deckIds = params.id && params.id !== 'all' ? [params.id] : S.get().decks.map(function (d) { return d.id; });
    var deck = params.id && params.id !== 'all' ? S.getDeck(params.id) : null;
    if (!deckIds.length) {
      U.clear(root);
      root.appendChild(h('div', { class: 'page' },
        V.decks.emptyState('layers', 'Нет колод для тренировки', 'Сначала создайте колоду и добавьте в неё слова.',
          h('button', { class: 'btn btn--primary', onclick: function () { App.router.go('#/decks'); } }, h('span', { text: 'К колодам' })))));
      return;
    }

    var cfg = renderStudy._cfg || (renderStudy._cfg = {
      mode: S.settings().defaultMode || 'flip',
      dir: S.settings().defaultDir || 'fwd',
      limit: S.settings().sessionLimit || 40,
      useLimits: true,
      shuffle: false
    });

    var now = Date.now();
    var totals = { new: 0, learning: 0, due: 0, total: 0 };
    deckIds.forEach(function (id) {
      var st = S.deckStats(id, now);
      totals.new += st.new; totals.learning += st.learning; totals.due += st.due; totals.total += st.total;
    });

    var modeRow = h('div', { class: 'mode-grid' });
    MODES.forEach(function (m) {
      if (m.id === 'listening' && !SP.supported()) return;
      modeRow.appendChild(h('button', {
        class: 'mode-card' + (cfg.mode === m.id ? ' is-active' : ''),
        onclick: function () {
          cfg.mode = m.id;
          U.qsa('.mode-card', modeRow).forEach(function (c) { c.classList.remove('is-active'); });
          this.classList.add('is-active');
        }
      },
        h('span', { class: 'mode-card__icon' }, icon(m.icon, 20)),
        h('b', { text: m.label }),
        h('small', { text: m.hint })

      dirRow.appendChild(h('button', {
        class: 'chip' + (cfg.dir === d.id ? ' is-active' : ''),
        onclick: function () {
          cfg.dir = d.id;
